name: Tests

# Pull requests only. Pushes to main are tested by deploy.yml, which gates the publish on the same
# suite, so running it here too would just double the minutes.
on:
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      # Only Chromium is installed: both configured projects (desktop and mobile) use it, so
      # pulling Firefox and WebKit would add minutes for browsers nothing runs on.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the suite
        run: npm test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
          if-no-files-found: ignore
