name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # index.html is committed because GitHub Pages serves it directly, so the
      # first thing to establish is that it still matches src/. Everything after
      # this point tests the file that would actually be deployed.
      - name: Verify index.html matches src/
        run: node build/build.js --check

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Parser suite
        run: node tests/parser.test.js
        env:
          SYNC_PLAYWRIGHT: playwright

      - name: Smoke suite
        run: node tests/smoke.test.js
        env:
          SYNC_PLAYWRIGHT: playwright
