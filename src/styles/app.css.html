<style>
*{margin:0;padding:0;box-sizing:border-box}
.sync-mark{display:inline-grid;place-items:center;position:relative;flex:0 0 auto;color:var(--accent,#9381ff)}
.sync-mark svg{display:block;width:100%;height:100%;overflow:visible}
.sync-mark .sync-frame{fill:none;stroke:var(--ink,var(--text));stroke-width:4.2;stroke-linecap:round;stroke-linejoin:round;opacity:.92}
.sync-mark .sync-spine{fill:none;stroke:var(--ink,var(--text));stroke-width:8.4;stroke-linecap:round;stroke-linejoin:round}
.sync-mark .sync-link{fill:none;stroke:var(--early,#2f7a63);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round;opacity:.88}
.sync-mark .sync-link-alt{fill:none;stroke:var(--accent,#9381ff);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;opacity:.68}
.sync-mark .sync-node{fill:var(--ink,var(--text))}
.sync-mark .sync-node-accent{fill:var(--accent,#9381ff)}
.sync-mark .sync-node-alt{fill:var(--early,#2f7a63)}
.sync-mark--masthead{width:20px;height:20px;margin-right:2px}
.sync-mark--launch{width:100%;height:100%}
.sync-boot{position:fixed;inset:0;z-index:100000;display:grid;place-items:center;background:radial-gradient(circle at 50% 44%,rgba(47,122,99,.18),transparent 34%),linear-gradient(135deg,#0a1715 0%,#0e0a14 54%,#111827 100%);color:#e9f8f2;transition:opacity .42s ease,visibility .42s ease;overflow:hidden}
.sync-boot::before{content:"";position:absolute;inset:-10%;background-image:linear-gradient(rgba(233,248,242,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(233,248,242,.045) 1px,transparent 1px);background-size:42px 42px;mask-image:radial-gradient(circle at center,#000 0%,transparent 70%);animation:syncGridDrift 8s linear infinite}
.sync-boot.done{opacity:0;visibility:hidden;pointer-events:none}
.sync-boot-panel{position:relative;display:grid;justify-items:center;gap:18px;padding:24px;text-align:center}
/* The splash is always dark, so its mark draws in the splash's light ink, not the theme's (a light
   theme's dark ink left the frame and S nearly invisible). */
.sync-boot-mark{--ink:#e9f8f2;width:min(168px,38vw);aspect-ratio:1;color:#9381ff;filter:drop-shadow(0 22px 44px rgba(0,0,0,.35))}
.sync-boot-mark .sync-frame,.sync-boot-mark .sync-link,.sync-boot-mark .sync-link-alt{stroke-dasharray:220;stroke-dashoffset:220;animation:syncDraw 1.05s ease forwards}
.sync-boot-mark .sync-link{animation-delay:.18s}
.sync-boot-mark .sync-link-alt{animation-delay:.34s}
.sync-boot-mark .sync-spine{stroke-dasharray:180;stroke-dashoffset:180;animation:syncDraw 1.1s ease forwards .42s}
.sync-boot-mark .sync-node,.sync-boot-mark .sync-node-accent,.sync-boot-mark .sync-node-alt{transform-origin:center;animation:syncNodePop 1.6s ease-in-out infinite .9s}
.sync-boot-title{font-family:'DM Sans',system-ui,sans-serif;font-size:14px;font-weight:800;letter-spacing:.34em;text-transform:uppercase}
.sync-boot-sub{font-family:'DM Mono',ui-monospace,monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:rgba(233,248,242,.62)}
.sync-boot-bar{width:168px;height:2px;background:rgba(233,248,242,.14);overflow:hidden}
.sync-boot-bar::after{content:"";display:block;width:44%;height:100%;background:linear-gradient(90deg,transparent,#9381ff,#2f7a63,transparent);animation:syncScan 1.15s ease-in-out infinite}
@keyframes syncDraw{to{stroke-dashoffset:0}}
@keyframes syncNodePop{0%,100%{transform:scale(1)}42%{transform:scale(1.22);filter:drop-shadow(0 0 10px currentColor)}}
@keyframes syncScan{0%{transform:translateX(-120%)}100%{transform:translateX(260%)}}
@keyframes syncGridDrift{to{transform:translate3d(42px,42px,0)}}
@media (prefers-reduced-motion:reduce){.sync-boot::before,.sync-boot-mark .sync-frame,.sync-boot-mark .sync-spine,.sync-boot-mark .sync-link,.sync-boot-mark .sync-link-alt,.sync-boot-mark .sync-node,.sync-boot-mark .sync-node-accent,.sync-boot-mark .sync-node-alt,.sync-boot-bar::after{animation:none}.sync-boot-mark .sync-frame,.sync-boot-mark .sync-spine,.sync-boot-mark .sync-link,.sync-boot-mark .sync-link-alt{stroke-dashoffset:0}}

/* Light variant fixes — press/newsprint variants inherit these */
body[data-theme="press"],body[data-theme="newsprint"]{
  --glow1:rgba(0,0,0,.04);--glow2:rgba(0,0,0,.02);--dot:rgba(0,0,0,.06);
}
/* ── Dropdown/select visibility fix — critical for all themes ── */
select,input[type=text],input[type=number],input[type=date],input[type=time],textarea{
  background:var(--bg2,var(--bg));color:var(--ink,var(--text));
  border-color:var(--rule,var(--bdr));
}
body.th-press select,body.th-press input,body.th-press textarea,
body.th-newsprint select,body.th-newsprint input,body.th-newsprint textarea{
  background:var(--bg2);color:var(--ink);border-color:var(--rule);
}
/* ── Option elements inherit correct colours ── */
option{background:var(--bg2,var(--hbg));color:var(--ink,var(--text));}
body.th-press option,body.th-newsprint option{background:#fff;color:#1a1815;}

html{min-height:100%;background:var(--bg);overflow-x:hidden}body{min-height:100vh;min-height:100dvh;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;overflow-x:hidden;overscroll-behavior-y:auto}
/* ── Help system ── */
.help-overlay{position:fixed;inset:0;z-index:800;display:flex;align-items:flex-start;justify-content:flex-start;padding:0;pointer-events:none}
.help-overlay.open{pointer-events:all}
.help-overlay-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .2s;pointer-events:none}
.help-overlay.open .help-overlay-bg{opacity:1;pointer-events:all}
.help-drawer{position:relative;z-index:1;width:min(480px,100vw);height:100vh;background:var(--hbg);border-right:1px solid var(--bdr);overflow-y:auto;display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .22s cubic-bezier(.4,0,.2,1);backdrop-filter:blur(20px)}
.help-overlay.open .help-drawer{transform:translateX(0)}
.help-drawer::-webkit-scrollbar{width:4px}.help-drawer::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px}
.help-drawer-hd{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--bdr);position:sticky;top:0;background:var(--hbg);z-index:2}
.help-drawer-hd h2{font-size:16px;font-weight:700}
.help-close{background:none;border:1px solid var(--bdr);color:var(--text);width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .1s}
.help-close:hover{background:var(--al);color:var(--accent)}
.help-section{padding:14px 20px;border-bottom:1px solid rgba(255,255,255,.06)}
.help-section h3{font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.help-section p,.help-section li{font-size:12px;color:var(--tm);line-height:1.6;margin-bottom:4px}
.help-section ul{padding-left:14px}
.help-section li{list-style:disc}
.help-section strong{color:var(--text);font-weight:600}
.help-shortcut{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--tm);margin-top:4px;flex-wrap:wrap}
.help-shortcut kbd{background:rgba(255,255,255,.1);padding:1px 6px;border-radius:3px;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--text)}
.help-workflow{background:var(--al);border-radius:10px;padding:12px 14px;margin-bottom:8px}
.help-workflow-step{display:flex;align-items:flex-start;gap:8px;padding:4px 0;font-size:12px}
.help-workflow-step .ws-num{width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.help-workflow-step .ws-text{color:var(--text);line-height:1.5}
.help-workflow-step .ws-text span{color:var(--tm);font-size:11px;display:block}
.ctx-help{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.08);border:1px solid var(--bdr);color:var(--tm);font-size:9px;cursor:pointer;transition:all .1s;flex-shrink:0;font-weight:700;line-height:1;vertical-align:middle;margin-left:5px}
.ctx-help:hover{background:var(--al);border-color:var(--accent);color:var(--accent)}
.ctx-panel{position:fixed;z-index:600;background:var(--hbg);border:1px solid var(--bdr);border-radius:10px;padding:10px 13px;font-size:11px;box-shadow:var(--sl);backdrop-filter:blur(20px);max-width:260px;min-width:200px}
.ctx-panel-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.ctx-panel-hd span{font-weight:600;font-size:12px;color:var(--accent)}
.ctx-panel-hd button{background:none;border:none;color:var(--tm);cursor:pointer;font-size:12px;line-height:1;padding:0}
.ctx-panel p{color:var(--tm);line-height:1.55;margin-bottom:4px}
.load-splash{position:fixed;inset:0;z-index:700;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);animation:fadeIn .25s ease-out}
.load-splash-card{background:var(--card);border:1px solid var(--card-border);border-radius:18px;padding:24px 28px;max-width:440px;width:90%;box-shadow:var(--sl);backdrop-filter:blur(20px)}
.load-splash-card h2{font-size:18px;font-weight:700;margin-bottom:4px}
.load-splash-card .ls-sub{font-size:12px;color:var(--tm);margin-bottom:16px}
.ls-quickstarts{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.ls-qs{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:8px;background:var(--al);cursor:pointer;transition:background .1s;border:none;font-family:inherit;text-align:left;width:100%}
.ls-qs:hover{background:var(--bdr)}
.ls-qs .qs-ico{font-size:16px;width:28px;flex-shrink:0;text-align:center}
.ls-qs .qs-text{font-size:12px;font-weight:500;color:var(--text)}
.ls-qs .qs-sub{font-size:10px;color:var(--tm);margin-top:1px}
.ls-actions{display:flex;gap:8px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideInRight{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes slideInLeft{from{transform:translateX(-100%)}to{transform:translateX(0)}}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(900px 700px at 15% 10%,var(--glow1),transparent 60%),radial-gradient(700px 600px at 85% 20%,var(--glow2),transparent 60%),radial-gradient(800px 600px at 50% 100%,rgba(122,180,255,.07),transparent 60%)}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.55;background-image:radial-gradient(circle at 1px 1px,var(--dot) 0 1px,transparent 1.2px);background-size:28px 28px}
.app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;position:relative;z-index:1;padding-top:var(--sat);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
/* Notch / status bar. viewport-fit=cover lets the page run under both; the shell pads itself clear
   and the phone heights below subtract --sat, so the bottom nav still ends at the screen edge. */
:root{--sat:env(safe-area-inset-top,0px)}
/* ── Department strip ── */
.dept-strip{display:none;align-items:center;gap:0;background:rgba(5,8,16,.9);border-bottom:1px solid var(--bdr);padding:0 12px;overflow-x:auto;min-height:34px;flex-shrink:0}
.dept-strip.show{display:flex}
.dept-strip::-webkit-scrollbar{height:3px}.dept-strip::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px}
.dept-tab{display:flex;align-items:center;gap:5px;padding:0 10px;height:34px;font-size:12px;font-weight:500;color:var(--tm);cursor:pointer;border:none;background:none;font-family:inherit;border-bottom:2px solid transparent;transition:all .1s;white-space:nowrap;position:relative}
.dept-tab:hover{color:var(--text);background:rgba(255,255,255,.04)}
.dept-tab.active{color:var(--accent);border-bottom-color:var(--accent);background:rgba(122,180,255,.06)}
.dept-tab .dt-name{max-width:120px;overflow:hidden;text-overflow:ellipsis}
.dept-tab .dt-close{opacity:0;font-size:11px;line-height:1;padding:1px 3px;border-radius:3px;transition:opacity .1s;margin-left:2px;cursor:pointer;background:none;border:none;color:inherit}
.dept-tab:hover .dt-close{opacity:.5}.dept-tab .dt-close:hover{opacity:1;background:rgba(220,38,38,.2);color:#dc2626}
.dept-tab .dt-badge{font-size:9px;padding:1px 5px;border-radius:8px;background:var(--al);color:var(--accent);font-weight:600}
.dept-add{display:flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:5px;background:rgba(255,255,255,.06);border:1px solid var(--bdr);color:var(--tm);cursor:pointer;font-size:15px;transition:all .1s;margin-left:4px;flex-shrink:0}
.dept-add:hover{background:var(--al);color:var(--accent);border-color:var(--accent)}
.dept-add-menu{position:fixed;z-index:260;min-width:210px;padding:5px;border:1px solid var(--bdr);border-radius:7px;background:var(--hbg);box-shadow:var(--sl);display:flex;flex-direction:column;gap:2px}
.dept-add-menu button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;padding:8px 9px;border:0;border-radius:5px;background:transparent;color:var(--text);font:11px var(--font);text-align:left;cursor:pointer}
.dept-add-menu button:hover{background:var(--al);color:var(--accent)}
.dept-add-menu button small{font-size:9px;color:var(--tm)}
/* ── Blueprint Editor ── */
.bp-editor{margin-top:8px}
.bp-grid{display:grid;grid-template-columns:auto repeat(7,1fr);gap:1px;font-size:11px}
.bp-grid .bp-hd{font-size:9px;font-weight:600;color:var(--tm);text-transform:uppercase;letter-spacing:.3px;padding:4px 6px;text-align:center}
.bp-grid .bp-wk{font-weight:600;color:var(--accent);padding:4px 6px;font-size:11px;font-family:'JetBrains Mono',monospace;cursor:grab;user-select:none;border-radius:4px;transition:background .1s}
.bp-grid .bp-wk:hover{background:var(--al)}
.bp-grid .bp-wk:active{cursor:grabbing}
.bp-grid .bp-wk.bp-dragging{opacity:.35;background:var(--al)}
.bp-grid .bp-drop-above{border-top:2px solid var(--accent)}
.bp-grid .bp-drop-below{border-bottom:2px solid var(--accent)}
.bp-grid input{width:100%;padding:3px 4px;border:1px solid var(--bdr);border-radius:3px;background:rgba(255,255,255,.04);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:10px;text-align:center}
.bp-grid input:focus{border-color:var(--accent);outline:none;background:rgba(122,180,255,.08)}
.bp-grid input.bp-off{color:var(--tm);opacity:.5}
.bp-actions{display:flex;gap:6px;margin-top:8px;align-items:center}
.bp-drag-hint{font-size:9px;color:var(--tm);opacity:.5;margin-left:4px;font-style:italic}
/* ── Position Confirmation ── */
.pos-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.pos-table th{text-align:left;font-size:10px;font-weight:600;color:var(--tm);text-transform:uppercase;letter-spacing:.3px;padding:5px 8px;border-bottom:1px solid var(--bdr)}
.pos-table td{padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.04)}
.pos-table select{padding:3px 6px;border:1px solid var(--bdr);border-radius:4px;background:var(--bg);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:12px}
.pos-table .pos-match{color:var(--early);font-size:10px}.pos-table .pos-diff{color:var(--wknd);font-size:10px}
.pos-anchor{font-size:10px;color:var(--tm);margin-top:6px;font-style:italic}
/* ── Month Generator ── */
.gen-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.gen-controls select,.gen-controls input{padding:4px 8px;border:1px solid var(--bdr);border-radius:4px;background:var(--bg);color:var(--text);font-family:inherit;font-size:12px}
/* ── Planner Month Nav ── */
.pl-nav{display:flex;align-items:center;gap:10px}
.pl-nav-btn{background:none;border:1px solid var(--bdr);color:var(--text);width:28px;height:28px;border-radius:6px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:all .1s}
.pl-nav-btn:hover{background:var(--al);border-color:var(--accent);color:var(--accent)}
.pl-nav-label{font-size:15px;font-weight:600;min-width:140px;text-align:center}
/* ── Planner Week Block — Bento ── */
.pw-block{margin-bottom:10px;border:1px solid var(--card-border);border-radius:12px;overflow:hidden;background:var(--card);backdrop-filter:blur(12px);box-shadow:var(--sh)}
.pw-hd{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;font-size:12px;color:var(--tm);border-bottom:1px solid rgba(255,255,255,.06);background:rgba(255,255,255,.025)}
.pw-hd .pw-wk{font-weight:700;color:var(--accent);font-family:'JetBrains Mono',monospace;font-size:11px;padding:2px 8px;background:var(--al);border-radius:5px}
.pw-grid{display:grid;grid-template-columns:130px repeat(7,1fr);font-size:12px}
.pw-grid .pw-dh{font-size:10px;font-weight:600;color:var(--tm);text-transform:uppercase;text-align:center;padding:6px 4px;letter-spacing:.4px;background:rgba(255,255,255,.02)}
.pw-grid .pw-name{padding:7px 12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-top:1px solid rgba(255,255,255,.04);font-size:12px;display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.015)}
.pw-grid .pw-name .pw-nwk{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent);opacity:.75;flex-shrink:0;background:var(--al);padding:1px 5px;border-radius:4px}
.pw-grid .pw-cell{text-align:center;padding:7px 3px;font-family:'JetBrains Mono',monospace;font-size:11px;border-top:1px solid rgba(255,255,255,.04);white-space:nowrap;letter-spacing:-.2px}
.pw-cell.pw-off{color:var(--tm);opacity:.28;font-size:10px}.pw-cell.pw-early{color:var(--early)}.pw-cell.pw-mid{color:var(--mid)}.pw-cell.pw-late{color:var(--late)}.pw-cell.pw-wknd{color:var(--wknd)}
.pw-cell.pw-out{opacity:.15}
.pw-grid .pw-cov{font-weight:700;font-size:14px;padding:6px 3px;text-align:center;border-top:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.02)}
.pw-cov.pw-cov-ok{color:var(--early)}.pw-cov.pw-cov-low{color:#dc2626}.pw-cov.pw-cov-des{color:var(--wknd)}
/* Coverage row label */
.pw-cov-label{font-size:10px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.4px;padding:6px 12px;border-top:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.02);display:flex;align-items:center}
/* ── Planner save bar ── */
.pl-save-bar{display:flex;gap:8px;align-items:center;padding:12px 16px;background:rgba(52,211,153,.04);border:1px solid rgba(52,211,153,.14);border-radius:10px;font-size:12px;margin-top:4px}
.pl-save-bar .ps-info{color:var(--tm);flex:1}
/* ── Coverage Intelligence ── */
.cov-dash{margin-top:12px}
.cov-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:2px;margin-top:8px}
.cov-day{border-radius:4px;padding:4px 2px;text-align:center;font-size:10px;font-family:'JetBrains Mono',monospace;cursor:default;position:relative}
.cov-day .cd-date{font-weight:600;font-size:9px;color:var(--tm)}.cov-day .cd-count{font-size:14px;font-weight:700}
.cov-day .cd-types{display:flex;gap:1px;justify-content:center;margin-top:2px}
.cov-day .cd-dot{width:5px;height:5px;border-radius:50%}
.cov-day.cov-ok{background:rgba(52,211,153,.08)}.cov-day.cov-ok .cd-count{color:var(--early)}
.cov-day.cov-low{background:rgba(220,38,38,.08)}.cov-day.cov-low .cd-count{color:#dc2626}
.cov-day.cov-designed{background:rgba(251,191,36,.06)}.cov-day.cov-designed .cd-count{color:var(--wknd)}
.cov-day.cov-off{background:rgba(255,255,255,.02);opacity:.4}
.cov-day.wknd-col{border-left:1px solid var(--bdr)}
.cov-summary{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.cov-stat{background:var(--card);border:1px solid var(--card-border);border-radius:8px;padding:8px 12px;min-width:100px;text-align:center}
.cov-stat .cs-n{font-size:20px;font-weight:700}.cov-stat .cs-l{font-size:10px;color:var(--tm)}
.cov-floor{margin-top:10px;display:flex;gap:2px;flex-wrap:wrap}
.cov-floor-day{background:var(--card);border:1px solid var(--card-border);border-radius:6px;padding:4px 8px;font-size:10px;text-align:center;min-width:38px}
.cov-floor-day .cfd-d{font-weight:600;color:var(--tm);font-size:9px;margin-bottom:2px}
.cov-floor-day .cfd-t{font-family:'JetBrains Mono',monospace;color:var(--accent);font-weight:500}
.cov-floor-day .cfd-w{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--tm)}
.cov-conflict{margin-top:8px;padding:8px 12px;background:rgba(220,38,38,.06);border:1px solid rgba(220,38,38,.15);border-radius:6px;font-size:11px;color:#dc2626}
/* .hd chrome styles moved to v49 token-based block below */
.btn{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border:none;border-radius:6px;font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;transition:all .12s;white-space:nowrap;color:inherit}
.bp{background:var(--accent);color:#fff}.bp:hover{background:var(--ah)}
.bi{width:28px;height:28px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:6px;background:rgba(255,255,255,.06);border:none;color:var(--ht);cursor:pointer;font-size:14px}.bi:hover{background:rgba(255,255,255,.12)}
/* ── Toolbar ── */
/* .tb old style removed */
.tg{display:flex;align-items:center;gap:4px}
.tsp{width:1px;height:16px;background:var(--bdr);margin:0 5px;opacity:.5}
.tb label{font-size:11px;color:var(--tm);font-weight:500;letter-spacing:.1px}
.tb select{padding:4px 8px;border:1px solid var(--bdr);border-radius:6px;font-family:inherit;font-size:12px;background:var(--bg);color:var(--text);cursor:pointer;transition:border-color .1s}
.tb select:hover,.tb select:focus{border-color:rgba(122,180,255,.3);outline:none}
.tb input[type=text]{width:80px}
/* ── Month nav ── */
/* .mnav old style removed */
/* ── Search ── */
.srch-wrap{position:relative;display:flex;align-items:center}
.srch-inp{padding:5px 28px 5px 28px;border:1px solid var(--bdr);border-radius:8px;font-family:inherit;font-size:12px;background:var(--bg);color:var(--text);width:200px;transition:all .15s}
.srch-inp:focus{width:260px;border-color:rgba(122,180,255,.35);background:rgba(122,180,255,.06);outline:none}
.srch-ico{position:absolute;left:8px;font-size:12px;opacity:.35;pointer-events:none}
.srch-clr{position:absolute;right:8px;cursor:pointer;font-size:12px;opacity:.4;line-height:1;transition:opacity .1s}
.srch-clr:hover{opacity:.9}
.srch-dd{position:absolute;top:calc(100% + 5px);right:0;width:280px;background:rgba(10,14,26,.97);border:1px solid var(--bdr);border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.5);z-index:300;overflow:hidden;backdrop-filter:blur(20px)}
.srch-section{padding:4px 0}
.srch-label{padding:4px 12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--tm);opacity:.5}
.srch-item{padding:7px 12px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .1s}
.srch-item:hover,.srch-item.active{background:var(--al);color:var(--accent)}
.srch-item .si-tag{font-size:10px;opacity:.45;margin-left:auto;font-family:'JetBrains Mono',monospace}
/* ── Tabs ── */
/* ── v50 Phase D: Masthead + Rail Chrome ── */
.mf-masthead{display:flex;align-items:center;height:36px;padding:0 14px;background:var(--bg2);border-bottom:2px solid var(--ink,var(--text));flex-shrink:0;position:sticky;top:0;z-index:100;gap:6px;font-family:'DM Sans',sans-serif}
.mf-mh-left{display:flex;align-items:baseline;gap:8px;flex-shrink:0}
.mf-mh-brand{font-family:'Playfair Display',Georgia,serif;font-size:16px;font-weight:700;color:var(--ink,var(--text));letter-spacing:-.2px;line-height:1;flex-shrink:0}
.mf-mh-stat{font-family:'DM Mono',monospace;font-size:11px;color:var(--ink3,var(--tm));letter-spacing:.2px}
.mf-mh-stat.health{font-weight:700;padding:1px 5px;border-radius:3px}
.mf-mh-sep{width:1px;height:14px;background:var(--rule,var(--bdr));margin:0 2px}
.mf-mh-center{display:flex;align-items:center;justify-content:center;flex:1}
.mf-mh-right{display:flex;align-items:center;gap:6px;margin-left:auto;flex-shrink:0}
.mf-mh-ticker{display:flex;align-items:center;gap:10px;font-size:11px;margin-right:6px}
.mf-mh-ticker .tk-item{display:flex;align-items:center;gap:3px}
.mf-mh-ticker .tk-label{font-size:9px;color:var(--ink4,var(--tm));text-transform:uppercase;letter-spacing:.3px}
.mf-mh-ticker .tk-val{font-family:'DM Mono',monospace;font-weight:600;color:var(--ink2,var(--text))}
.mh-theme-controls{display:inline-flex;align-items:center;gap:5px;margin:0 1px 0 2px}
.mh-theme-btn{width:16px;height:16px;border-radius:4px;border:2px solid var(--mhc-br,var(--rule,var(--bdr)));background:var(--mhc-bg,var(--bg3));cursor:pointer;padding:0;transition:transform .12s,box-shadow .12s,border-color .12s}
.mh-theme-btn:hover{transform:translateY(-1px);border-color:var(--accent)}
.mh-theme-btn.active{box-shadow:0 0 0 2px var(--al)}
.mh-theme-shuffle{width:18px;height:18px;border-radius:5px;background:var(--bg);color:var(--ink2,var(--text));border-color:var(--rule,var(--bdr));font-size:11px;line-height:1}
.mh-theme-shuffle:hover{background:var(--al);color:var(--accent)}
.mf-mh-save{font-size:10px;padding:2px 8px;background:var(--accent);color:#fff;border:none;border-radius:4px;font-family:'DM Mono',monospace;font-weight:600;cursor:pointer;letter-spacing:.2px}
.mf-mh-save:hover{opacity:.85}
.mf-mh-btn{padding:2px 8px;border:1px solid var(--rule,var(--bdr));border-radius:4px;background:none;color:var(--ink3,var(--tm));font-family:inherit;font-size:10px;cursor:pointer}
/* ── Masthead nav toggle (Claude-style) ── */
/* ── Nav toggle — lives inside the rail as the first item ── */
.mf-nav-toggle{display:flex;align-items:center;justify-content:flex-start;width:142px;height:30px;padding:0 10px;border-radius:6px;border:none;background:none;color:var(--ink3,var(--tm));cursor:pointer;margin:0 0 8px;flex-shrink:0;transition:all .15s;gap:8px}
.mf-nav-toggle:hover{background:var(--al);color:var(--ink,var(--text))}
.mf-rail.collapsed .mf-nav-toggle{width:30px;padding:0;justify-content:center;margin:0 0 8px}
/* ── Rail ── */
.mf-body{display:flex;flex:1;min-height:0;overflow:hidden}
.mf-rail{width:160px;background:var(--bg3,var(--bg));border-right:1px solid var(--rule,var(--bdr));display:flex;flex-direction:column;align-items:flex-start;padding:8px 0;gap:1px;flex-shrink:0;transition:width .22s cubic-bezier(.4,0,.2,1);overflow-x:clip;overflow-y:auto;z-index:50}
.mf-rail.collapsed{width:42px;align-items:center}
.mf-rail-item{width:142px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:flex-start;padding-left:10px;cursor:pointer;flex-shrink:0;gap:8px;white-space:nowrap;transition:all .15s;color:var(--ink3,var(--tm))}
.mf-rail-item:hover{background:var(--al,rgba(255,255,255,.06))}
.mf-rail-item.active{background:rgba(196,149,42,.1);color:var(--accent)}
.mf-rail-item .ri-label{font-size:11px;font-weight:500;color:var(--ink2,var(--tm));opacity:1;transition:opacity .15s;pointer-events:none}
.mf-rail-item.active .ri-label{font-weight:600;color:var(--accent)}
.mf-rail.collapsed .mf-rail-item{width:30px;justify-content:center;padding-left:0}
.mf-rail.collapsed .mf-rail-item .ri-label{opacity:0;width:0;overflow:hidden}
.mf-rail-nav{width:100%;overflow:auto;padding:0 8px 8px}
.mf-rail-group{width:100%;display:flex;flex-direction:column;gap:2px;margin-bottom:6px}
.mf-rail-parent{width:142px;min-height:30px;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--ink3,var(--tm));display:grid;grid-template-columns:18px 1fr auto;align-items:center;gap:8px;padding:0 8px;font-family:inherit;cursor:pointer;text-align:left}
.mf-rail-parent:hover,.mf-rail-group.active .mf-rail-parent{background:var(--al);color:var(--accent)}
.mf-rail-parent .ri-icon{display:grid;place-items:center}
.mf-rail-parent .ri-label{font-size:11px;font-weight:700;color:var(--ink2,var(--tm));overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mf-rail-group.active .mf-rail-parent .ri-label{color:var(--accent)}
.mf-rail-parent .ri-tail{display:inline-flex;align-items:center;gap:4px}
.mf-rail-parent .ri-chev{font-size:13px;color:var(--ink4,var(--tm));transition:transform .15s}
.mf-rail-group.open .ri-chev{transform:rotate(90deg)}
.mf-rail-children{display:none;flex-direction:column;gap:1px;margin-left:17px;padding-left:8px;border-left:1px solid var(--rule2,var(--bdr))}
.mf-rail-group.open .mf-rail-children{display:flex}
.mf-rail-child{width:116px;min-height:27px;border:1px solid transparent;border-radius:5px;background:transparent;color:var(--ink2,var(--tm));display:flex;align-items:center;justify-content:space-between;gap:6px;padding:0 8px;font-family:inherit;font-size:11px;cursor:pointer;text-align:left}
.mf-rail-child:hover,.mf-rail-child.active{background:var(--al);border-color:var(--card-border,var(--bdr));color:var(--accent)}
.mf-rail-child.active{font-weight:700}
.mf-rail-badge{min-width:14px;height:14px;padding:0 4px;border-radius:7px;background:#dc2626;color:#fff;font-size:8px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;line-height:1}
.mf-rail.collapsed .mf-rail-nav{padding:0 6px 8px;overflow:hidden}
.mf-rail.collapsed .mf-rail-group{align-items:center;margin-bottom:3px}
.mf-rail.collapsed .mf-rail-parent{width:30px;grid-template-columns:1fr;place-items:center;padding:0}
.mf-rail.collapsed .mf-rail-parent .ri-label,.mf-rail.collapsed .mf-rail-parent .ri-tail,.mf-rail.collapsed .mf-rail-parent .ri-chev,.mf-rail.collapsed .mf-rail-children{display:none}
.mf-rail.collapsed .mf-rail-bottom{align-items:center}
.mf-rail-nav{flex:1}
/* Rail bottom — pinned via flex:1 on nav above */
.mf-rail-bottom{background:var(--bg3,var(--bg));padding:8px 0 10px;width:100%;border-top:1px solid var(--rule,var(--bdr));display:flex;flex-direction:column;gap:1px}
/* Masthead brand label — always visible */
.mf-mh-dept{font-family:'DM Mono',monospace;font-size:11px;font-weight:500;color:var(--ink2,var(--text))}
/* ── Subbar (universal toolbar — inside content column) ── */
.mf-content-col{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}
.mf-subbar{display:flex;align-items:center;padding:0 12px;height:38px;border-bottom:1px solid var(--rule2,var(--bdr));gap:6px;flex-shrink:0;background:var(--bg,var(--bg))}
/* ── Leader dropdown — pill style ── */
.mf-subbar .sb-leader{-webkit-appearance:none;appearance:none;padding:5px 28px 5px 10px;border:1px solid var(--rule,var(--bdr));border-radius:20px;background:var(--bg2);color:var(--ink2,var(--text));font-size:11px;font-weight:500;font-family:inherit;cursor:pointer;transition:all .15s;background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%23888' stroke-width='1.3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 10px center;background-size:10px 6px;min-width:80px;max-width:160px;text-overflow:ellipsis}
.mf-subbar .sb-leader:hover{border-color:var(--accent);background-color:var(--al)}
.mf-subbar .sb-leader:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px var(--al)}
/* ── Month picker — dropdown (Base style) ── */
.mf-subbar .sb-month-nav{display:flex;align-items:center;gap:4px}
.mf-subbar .sb-month-btn{width:22px;height:22px;border:1px solid var(--rule,var(--bdr));border-radius:4px;background:transparent;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;color:var(--ink3,var(--tm));transition:all .1s;font-family:inherit}
.mf-subbar .sb-month-btn:hover{background:var(--al);border-color:var(--accent);color:var(--accent)}
.mf-subbar .sb-month-label{font-family:'DM Mono',monospace;font-size:12px;font-weight:500;color:var(--ink,var(--text));min-width:70px;text-align:center;cursor:default}
.mf-subbar .sb-month-select{height:28px;padding:2px 8px;border:1px solid var(--rule,var(--bdr));border-radius:6px;background:var(--bg2,var(--hbg));color:var(--ink,var(--text));font-family:'DM Sans',sans-serif;font-size:12px;font-weight:500;cursor:pointer;outline:none;min-width:120px;max-width:160px}
.mf-subbar .sb-month-select:hover{border-color:var(--accent)}
.mf-subbar .sb-month-select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--al)}
/* ── Calendar sub-tab nav (DAY / CARDS) ── */
.people-subtab-nav{display:flex;gap:0;border-bottom:1px solid var(--bdr);padding:0 16px;background:var(--bg);flex-shrink:0}
.pst-btn{padding:7px 14px;font-size:11px;font-weight:600;cursor:pointer;background:none;border:none;border-bottom:2px solid transparent;color:var(--tm);font-family:inherit;transition:all .12s;letter-spacing:.4px;text-transform:uppercase}
.pst-btn:hover{color:var(--text)}
.pst-btn.a{color:var(--accent);border-bottom-color:var(--accent)}

/* ── People HQ — Dashboard, Team, Agents, Logbook ── */
.people-hq{display:flex;flex-direction:column;height:100%;overflow:hidden}
.people-context{display:flex;align-items:center;gap:8px;padding:7px 16px;border-bottom:1px solid var(--bdr);background:rgba(255,255,255,.01);flex-wrap:wrap}
.people-context .ctx-label{font-size:10px;color:var(--tm);text-transform:uppercase;letter-spacing:.5px;font-weight:700}
.people-context .ctx-pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--bdr);background:rgba(255,255,255,.02);color:var(--text)}
.people-hq-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:12px;padding:12px 16px;overflow-y:auto;flex:1}
@media(max-width:1100px){.people-hq-grid{grid-template-columns:1fr}}
.phq-card{background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:12px 14px}
.phq-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.phq-title{font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;color:var(--tm)}
.phq-sub{font-size:11px;color:var(--tm)}
.phq-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media(max-width:900px){.phq-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}
.phq-metric{padding:10px;border-radius:10px;background:rgba(255,255,255,.03);border:1px solid var(--bdr)}
.phq-metric .k{font-size:20px;font-weight:700;color:var(--accent);line-height:1}
.phq-metric .l{font-size:10px;color:var(--tm);text-transform:uppercase;letter-spacing:.5px;margin-top:4px}
.phq-quick{display:flex;gap:6px;flex-wrap:wrap}
.phq-btn{padding:5px 10px;border:1px solid var(--bdr);border-radius:7px;background:none;color:var(--tm);font-family:inherit;font-size:11px;cursor:pointer}
.phq-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--al)}
.phq-btn.a{border-color:var(--accent);color:var(--accent);background:var(--al)}
.phq-risk-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.phq-risk-row:last-child{border-bottom:none}
.phq-risk-name{font-size:12px;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.phq-risk-meta{font-size:11px;color:var(--tm)}
.phq-risk-badge{margin-left:auto;font-size:10px;padding:1px 7px;border-radius:999px;border:1px solid var(--bdr);color:var(--tm);white-space:nowrap}
.people-logbook-wrap{display:flex;flex-direction:column;height:100%;overflow:hidden}
.people-logbook-tools{display:flex;gap:6px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--bdr);flex-wrap:wrap}
.plg-feed{flex:1;overflow-y:auto;padding:0 14px 14px}
.plg-card{border:1px solid var(--bdr);border-radius:10px;padding:10px 11px;background:var(--card);margin-top:8px}
.plg-card-hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.plg-kind{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.05);color:var(--tm)}
.plg-date{font-size:10px;color:var(--tm);font-family:'JetBrains Mono',monospace}
.plg-title{font-size:12px;font-weight:700;color:var(--text)}
.plg-body{font-size:12px;color:var(--tm);margin-top:4px;line-height:1.5;white-space:pre-wrap}
.plg-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.plg-tag{font-size:10px;padding:1px 6px;border-radius:8px;background:rgba(122,180,255,.08);color:var(--accent)}
.plg-actions{margin-left:auto;display:flex;gap:4px}

/* ── Cards panel: sticky controls bar + leader strip ── */
.cards-ctrl-bar{display:flex;align-items:center;gap:6px;padding:6px 12px;border-bottom:1px solid var(--bdr);background:var(--bg);flex-shrink:0;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.cards-ctrl-bar .cc-btn{padding:4px 10px;border:1px solid var(--bdr);border-radius:6px;background:none;color:var(--tm);font-family:inherit;font-size:11px;cursor:pointer;transition:all .12s;white-space:nowrap}
.cards-ctrl-bar .cc-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--al)}
.cards-ctrl-bar .cc-btn.on{border-color:var(--accent);color:var(--accent);background:var(--al);font-weight:700}
.cards-leader-strip{display:flex;align-items:center;gap:5px;padding:5px 12px;border-bottom:1px solid var(--bdr);background:var(--bg2);flex-shrink:0;flex-wrap:wrap}
.cards-leader-strip .cls-label{font-size:10px;font-weight:700;color:var(--tm);text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
.cards-leader-strip .cls-pill{padding:3px 10px;border:1px solid var(--bdr);border-radius:12px;background:none;color:var(--tm);font-family:inherit;font-size:11px;cursor:pointer;transition:all .12s;white-space:nowrap}
.cards-leader-strip .cls-pill:hover{border-color:var(--accent);color:var(--accent)}
.cards-leader-strip .cls-pill.sel{border-color:var(--accent);color:var(--accent);background:var(--al);font-weight:700}
.cards-leader-strip .cls-multi{padding:3px 9px;border:1px solid var(--bdr);border-radius:12px;background:none;color:var(--tm);font-family:inherit;font-size:10px;font-weight:700;cursor:pointer;letter-spacing:.3px;text-transform:uppercase;transition:all .12s}
.cards-leader-strip .cls-multi.on{border-color:rgba(122,180,255,.5);color:var(--accent);background:rgba(122,180,255,.08)}

/* ═══ v48.2 — Coaching What's Next card ═══ */
.wn-card{background:linear-gradient(135deg,rgba(122,180,255,.08),rgba(122,180,255,.02));border:1px solid rgba(122,180,255,.2);border-radius:10px;padding:16px 18px;margin:10px 14px 6px}
.wn-title{font-size:14px;font-weight:700;color:var(--accent);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.wn-person{font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px}
.wn-detail{font-size:11px;color:var(--tm);line-height:1.6}
.wn-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.wn-actions .btn{font-size:11px;padding:5px 14px}
.wn-empty{text-align:center;padding:18px;font-size:12px;color:var(--tm)}
.wn-done{text-align:center;padding:18px}

/* ── Focus mode pills ── */
.sb-focus{display:flex;align-items:center;gap:0;background:var(--bg2);border:1px solid var(--rule,var(--bdr));border-radius:20px;padding:2px;height:28px}
.sb-focus-btn{padding:2px 10px;border:none;border-radius:16px;background:none;color:var(--ink3,var(--tm));font-size:10px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .12s;letter-spacing:.3px;text-transform:uppercase;line-height:1.6}
.sb-focus-btn:hover{color:var(--ink,var(--text))}
.sb-focus-btn.active{background:var(--accent);color:var(--bg,#070A12);box-shadow:0 1px 4px rgba(0,0,0,.2)}
/* ── Toolbar icon buttons ── */
.mf-subbar .sb-icon-btn{width:28px;height:28px;border:1px solid var(--rule,var(--bdr));border-radius:50%;background:none;color:var(--ink3,var(--tm));cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;transition:all .12s;position:relative}
.mf-subbar .sb-icon-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--al)}
.mf-subbar .sb-icon-btn.active{border-color:var(--accent);color:var(--accent);background:var(--al)}
.mf-subbar .sb-icon-btn .sb-badge{position:absolute;top:-3px;right:-3px;min-width:14px;height:14px;padding:0 3px;border-radius:7px;background:var(--accent);color:var(--bg,#070A12);font-size:8px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1}
/* ── Search — refined ── */
.mf-subbar .sb-search-wrap{position:relative}
.mf-subbar .sb-search{padding:5px 10px 5px 28px;border:1px solid var(--rule,var(--bdr));border-radius:20px;background:var(--bg2);color:var(--ink,var(--text));font-size:11px;width:150px;font-family:inherit;transition:all .2s}
.mf-subbar .sb-search:focus{width:220px;border-color:var(--accent);outline:none;box-shadow:0 0 0 2px var(--al)}
.mf-subbar .sb-search-ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-size:11px;opacity:.35;pointer-events:none}
/* ── Scratchpad popup ── */
.sb-scratchpad-pop{position:absolute;top:calc(100% + 6px);right:0;width:300px;background:var(--bg2,rgba(10,14,26,.97));border:1px solid var(--rule,var(--bdr));border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.35);z-index:400;overflow:hidden;display:flex;flex-direction:column}
.sb-scratchpad-pop .sp-hd{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 8px;border-bottom:1px solid var(--rule,var(--bdr))}
.sb-scratchpad-pop .sp-hd h4{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--accent);margin:0}
.sb-scratchpad-pop textarea{width:100%;height:180px;padding:12px 14px;border:none;background:transparent;color:var(--ink,var(--text));font-family:'JetBrains Mono','DM Mono',monospace;font-size:11px;line-height:1.6;resize:none;outline:none}
.sb-scratchpad-pop textarea::placeholder{color:var(--tm);opacity:.5}
.sb-scratchpad-pop .sp-ft{padding:6px 14px;border-top:1px solid var(--rule,var(--bdr));font-size:9px;color:var(--tm);text-align:right}
/* Hide old chrome elements — keep IDs for backwards compat */
.ib,.tb,.tabs{display:none!important}
/* Mobile: rail collapses to bottom bar */
@media(max-width:768px){
  .mf-nav-toggle{display:none}
  .mf-rail{width:100%;height:42px;flex-direction:row;border-right:none;border-top:1px solid var(--rule,var(--bdr));border-bottom:none;padding:0 8px;gap:4px;justify-content:center;order:2;align-items:center}
  .mf-rail.collapsed,.mf-rail.expanded,.mf-rail{width:100%}
  .mf-rail-item,.mf-rail.collapsed .mf-rail-item{width:auto;padding:0 10px;justify-content:center}
  .mf-rail-item .ri-label,.mf-rail.collapsed .mf-rail-item .ri-label{opacity:0;width:0;overflow:hidden}
  .mf-rail-bottom{display:none}
  .mf-body{flex-direction:column}  .mf-content-col{order:1}
  .mf-masthead{height:auto;flex-wrap:wrap;padding:6px 12px;gap:4px}
  .mf-mh-brand{font-size:14px}
  .mf-mh-ticker{display:none}
}
/* ── v49 Header — single band with all controls ── */
.hd{display:none!important}
/* Legacy header styles kept for reference */
.hd-legacy{background:var(--hbg);border-bottom:1px solid var(--bdr);color:var(--ht);padding:0 16px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:100;height:48px;flex-shrink:0;backdrop-filter:blur(20px)}
.hd-b{display:flex;align-items:center;gap:8px;flex-shrink:0}
.hd-l{width:28px;height:28px;background:var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.hd-titles{display:flex;flex-direction:column;gap:0;padding-right:12px;border-right:1px solid var(--bdr);margin-right:4px}
.hd h1{font-size:9px;font-weight:500;opacity:.4;letter-spacing:.6px;text-transform:uppercase;line-height:1}
.hd-dept{font-size:15px;font-weight:700;letter-spacing:-.2px;line-height:1.2;color:var(--ht)}
.hd-s{display:none}
.hd-a{display:flex;gap:5px;align-items:center;margin-left:auto}
/* Month nav lives in header band */
.mnav{display:flex;align-items:center;gap:4px}
.mnav button{width:22px;height:22px;border:1px solid var(--rule,var(--bdr));border-radius:4px;background:transparent;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;color:var(--ink3,var(--ht));transition:all .1s}
.mnav button:hover{background:var(--al);border-color:var(--accent);color:var(--accent)}
.mnav .mlbl{font-family:'Playfair Display',Georgia,serif;font-size:13px;font-weight:700;min-width:90px;text-align:center;letter-spacing:-.2px;color:var(--ink,var(--ht))}
/* ── Toolbar — compact secondary band: leader filter only ── */
.tb{display:flex;align-items:center;gap:6px;padding:0 16px;background:var(--bg);border-bottom:1px solid var(--bdr);flex-wrap:wrap;min-height:36px;position:relative;z-index:50}
.tg{display:flex;align-items:center;gap:4px}
.tsp{width:1px;height:14px;background:var(--bdr);margin:0 4px;opacity:.5}
.tb label{font-size:10px;color:var(--tm);font-weight:600;letter-spacing:.4px;text-transform:uppercase}
/* ── Dropdown visibility fix — works across all 4 themes ── */
.tb select,.tb input[type=text]{
  padding:4px 8px;border:1px solid var(--bdr);border-radius:5px;
  font-family:inherit;font-size:12px;
  background:var(--card);color:var(--ht);
  cursor:pointer;transition:border-color .1s
}
.tb select:hover,.tb select:focus,.tb input:focus{border-color:var(--accent);outline:none}
/* Global select/input fix — the main dropdown visibility problem */
select,input[type=number],input[type=date],input[type=time]{
  background:var(--card);color:var(--ht);border-color:var(--bdr);
  font-family:inherit
}
option{background:var(--hbg);color:var(--ht)}
/* Light themes need white backgrounds for inputs */
body.th-press select,body.th-press input,body.th-press textarea,body.th-press option,
body.th-newsprint select,body.th-newsprint input,body.th-newsprint textarea,body.th-newsprint option{
  background:var(--bg2)!important;color:var(--ink)!important;border-color:var(--rule)!important
}
/* ── Tabs — cleaner, uppercase, less padding ── */
.tabs{display:flex;background:var(--hbg);border-bottom:1px solid var(--bdr);padding:0 16px;overflow-x:auto}
.tab{padding:9px 12px;font-size:11px;font-weight:600;color:var(--tm);cursor:pointer;border:none;background:none;font-family:inherit;border-bottom:2px solid transparent;transition:all .12s;white-space:nowrap;letter-spacing:.4px;text-transform:uppercase}
.tab:hover{color:var(--ht)}
.tab.a{color:var(--accent);border-bottom-color:var(--accent)}
/* ── Info bar — tighter, inline with filters ── */
.ib{display:flex;align-items:center;gap:5px;padding:0 16px;background:var(--bg);font-size:11px;border-bottom:1px solid var(--bdr);height:30px;flex-wrap:nowrap;flex-shrink:0;overflow:hidden}
.ib .l{font-weight:700;color:var(--accent);font-size:13px}
.ib .ib-sep{color:var(--bdr);opacity:.5}
.ib .ib-stat{color:var(--ht);font-weight:600}
.ib .ib-muted{color:var(--tm);font-size:10px}
/* ── Continuity bar ── */
.cont-msg{font-size:10px;color:var(--tm);padding:3px 16px;background:var(--al);border-bottom:1px solid var(--bdr);display:flex;align-items:center;gap:4px}
.cont-msg .cm-icon{opacity:.4;font-size:11px}
/* ── Light theme chrome overrides ── */
body.th-press .hd,body.th-newsprint .hd{display:none!important}
body.th-press .mf-masthead{background:var(--bg2);border-bottom:2px solid var(--ink)}
body.th-newsprint .mf-masthead{background:var(--bg2);border-bottom:2px solid var(--ink)}
body.th-press .mf-rail{background:var(--bg3)}body.th-newsprint .mf-rail{background:var(--bg3)}
body.th-press .mf-subbar{background:var(--bg3);border-color:var(--rule)}
body.th-newsprint .mf-subbar{background:var(--bg3);border-color:var(--rule)}
body.th-press .mnav .mlbl,body.th-newsprint .mnav .mlbl{color:var(--ink)}
/* ── Content area ── */
.ct{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px}.hid{display:none!important}
/* Desktop uses the browser's native document scroll. This keeps local files and
   embedded browser shells consistent with normal web pages and Ops Hub. */
@media(min-width:769px){
  html,body{height:auto;min-height:100%;overflow-y:auto;overscroll-behavior-y:auto}
  .app,#mv{height:auto;min-height:100dvh}
  .mf-body{flex:1 0 auto;overflow:visible}
  .mf-content-col{overflow:visible}
  .ct,.ct.dashboard-fixed{flex:1 0 auto;min-height:calc(100dvh - 112px);overflow:visible}
}
/* ── Table filters – distinct bg ── */
.tbl-filters{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:10px 14px;background:rgba(255,255,255,.025);border-radius:10px 10px 0 0;border:1px solid var(--card-border);border-bottom:1px solid var(--bdr)}
.tbl-filters label{font-size:10px;color:var(--tm);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.tbl-filters select{padding:4px 8px;border:1px solid var(--bdr);border-radius:6px;background:var(--bg);color:var(--text);font-family:inherit;font-size:11px;cursor:pointer}
.tbl-filters .tf-count{font-size:11px;color:var(--tm);margin-left:auto;font-family:'JetBrains Mono',monospace}
.tbl-filters input[type=number]{padding:4px 6px;border:1px solid var(--bdr);border-radius:6px;background:var(--bg);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:11px;width:52px;-moz-appearance:textfield}
.tbl-filters input[type=date]{padding:4px 6px;border:1px solid var(--bdr);border-radius:6px;background:var(--bg);color:var(--text);font-family:'JetBrains Mono',monospace;font-size:11px;cursor:pointer}
.tbl-filters input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.7);cursor:pointer}
.tbl-filters input[type=number]::-webkit-outer-spin-button,.tbl-filters input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
/* Wk label in table/cards — badge style */
.wk-lbl{font-size:10px;color:var(--accent);opacity:.6;font-family:'JetBrains Mono',monospace;font-weight:600}
/* Card collapse icon */
.ech .collapse-icon{font-size:13px;opacity:.45;transition:transform .2s;margin-left:6px}
.ech.collapsed .collapse-icon{transform:rotate(-90deg)}
.uz{flex:1;display:flex;align-items:center;justify-content:center;padding:16px;min-height:100vh;min-height:100dvh;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--bg)}
.uz-inner{width:100%;max-width:580px;display:flex;flex-direction:column;align-items:center;gap:0}
/* Drop overlay */
.uz.dov-active::after{content:"Drop to load";position:fixed;inset:0;background:rgba(122,180,255,.08);border:2px dashed var(--accent);border-radius:0;z-index:200;display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:600;color:var(--accent);pointer-events:none}
/* Global scrollbar polish */
*{scrollbar-width:thin;scrollbar-color:var(--bdr) transparent}
*::-webkit-scrollbar{width:5px;height:5px}
*::-webkit-scrollbar-track{background:transparent}
*::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:4px}
*::-webkit-scrollbar-thumb:hover{background:var(--ink3)}
*::-webkit-scrollbar-corner{background:transparent}
/* Landing card theme tokens */
/* ── v60: Landing card --lc-* tokens — Surge / Tide / Press / Newsprint ── */
/* Landing text tokens: --lc-faint carries real copy (stat captions, file types, the Google button,
   the privacy line), so it holds ~4.5:1 against --lc-bg and --lc-very-faint ~3:1. The dark themes
   had both near 1.3:1, which read as blank on a phone. */
:root{
  /* Surge — violet dark / bioluminescent deep space */
  --lc-nature-bg:radial-gradient(ellipse 70% 50% at 88% 2%,rgba(140,167,244,.13) 0%,transparent 55%),radial-gradient(ellipse 60% 65% at 6% 96%,rgba(195,73,238,.18) 0%,transparent 52%),linear-gradient(155deg,#0e0a14 0%,#17102a 55%,#1e1535 100%);
  --lc-bg:#0e0a14;--lc-right-bg:rgba(14,10,20,.82);
  --lc-border:rgba(195,73,238,.18);--lc-rule:rgba(195,73,238,.32);--lc-grid:rgba(195,73,238,.028);
  --lc-glow1:rgba(195,73,238,.12);--lc-glow2:rgba(140,167,244,.08);
  --lc-accent:#c349ee;--lc-accent-faint:rgba(195,73,238,.12);--lc-accent-dashed:rgba(195,73,238,.3);
  --lc-title:#ecdeff;--lc-title-sub:#9b7dbf;--lc-feat-head:#d0b8f0;--lc-feat-body:#5a3d80;
  --lc-desc:#7a5a9a;--lc-label:#9a84c4;--lc-muted:#8f78b8;--lc-faint:#8a74b0;--lc-very-faint:#6f5a96;
  --lc-stat-bg:rgba(14,10,20,.96);--lc-stat-sep:rgba(195,73,238,.14);
  --lc-dz-bg:rgba(16,11,24,.65);--lc-new-bg:rgba(20,14,32,.55);--lc-new-border:rgba(195,73,238,.2);
  --lc-sep-faint:rgba(195,73,238,.12);--lc-kbd-border:rgba(195,73,238,.16);
  --lc-or:#3d2868;--lc-diamond:#4a3070;
}
body.th-tide{
  /* Tide — dark teal-graphite / deep ocean coast */
  --lc-nature-bg:radial-gradient(ellipse 80% 40% at 50% 108%,rgba(77,184,200,.15) 0%,transparent 55%),radial-gradient(ellipse 35% 45% at 88% 16%,rgba(77,184,200,.08) 0%,transparent 50%),linear-gradient(165deg,#141818 0%,#1a2020 55%,#1e2828 100%);
  --lc-bg:#141818;--lc-right-bg:rgba(10,14,14,.78);
  --lc-border:rgba(77,184,200,.18);--lc-rule:rgba(77,184,200,.32);--lc-grid:rgba(77,184,200,.03);
  --lc-glow1:rgba(77,184,200,.12);--lc-glow2:rgba(40,100,110,.07);
  --lc-accent:#4db8c8;--lc-accent-faint:rgba(77,184,200,.12);--lc-accent-dashed:rgba(77,184,200,.3);
  --lc-title:#d8f0f4;--lc-title-sub:#4db8c8;--lc-feat-head:#b8dce0;--lc-feat-body:#4a6868;
  --lc-desc:#5a7878;--lc-label:#80a4aa;--lc-muted:#7c9a9e;--lc-faint:#7a979b;--lc-very-faint:#5f7d81;
  --lc-stat-bg:rgba(18,22,22,.95);--lc-stat-sep:rgba(77,184,200,.12);
  --lc-dz-bg:rgba(20,26,26,.62);--lc-new-bg:rgba(22,28,28,.52);--lc-new-border:rgba(77,184,200,.2);

}

/* Card */
.lc-root{width:100%;max-width:min(1080px,96vw);display:grid;grid-template-columns:1fr 320px;height:min(650px,calc(100vh - 32px));border:1px solid var(--lc-border);border-radius:14px;overflow:hidden;background:var(--lc-nature-bg);position:relative}
.lc-grid{position:absolute;inset:0;background-image:linear-gradient(var(--lc-grid) 1px,transparent 1px),linear-gradient(90deg,var(--lc-grid) 1px,transparent 1px);background-size:52px 52px;pointer-events:none}
.lc-glow{position:absolute;inset:0;background:radial-gradient(ellipse at 20% 80%,var(--lc-glow1) 0%,transparent 50%),radial-gradient(ellipse at 80% 15%,var(--lc-glow2) 0%,transparent 40%);pointer-events:none}
.lc-left{padding:clamp(12px,1.7vh,24px) clamp(18px,2.8vw,42px) 0;position:relative;z-index:1;border-right:1px solid var(--lc-border);display:flex;flex-direction:column;overflow:hidden}
.lc-eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:clamp(7px,1vh,12px);flex-shrink:0}
.lc-rule{flex:1;height:1px;background:linear-gradient(to right,var(--lc-rule),transparent)}
.lc-rule-r{background:linear-gradient(to left,var(--lc-rule),transparent);flex:0 0 22px}
.lc-eyebrow-text{font-family:'DM Mono',monospace;font-size:clamp(9px,0.9vw,11px);letter-spacing:.22em;text-transform:uppercase;color:var(--lc-label);white-space:nowrap}
.lc-title-block{margin-bottom:clamp(8px,1.4vh,22px);flex-shrink:0}
.lc-brand-lockup{display:flex;align-items:center;gap:10px;margin-bottom:clamp(10px,1.4vh,18px);align-self:flex-start;width:max-content;max-width:100%}
.lc-sigil{width:clamp(34px,3.4vw,44px);aspect-ratio:1;border:1px solid var(--lc-rule);position:relative;display:grid;place-items:center;background:linear-gradient(135deg,rgba(255,255,255,.03),transparent);flex-shrink:0}
.lc-sigil::before,.lc-sigil::after{content:"";position:absolute;inset:6px;border:1px solid color-mix(in srgb,var(--lc-accent) 24%,transparent);border-radius:50%}
.lc-sigil::after{inset:12px;border-style:dotted;opacity:.65}
.lc-sigil svg{width:82%;height:82%;display:block}
.lc-sigil-mark{fill:var(--lc-title)}
.lc-sigil-line{stroke:var(--lc-rule);stroke-width:1;fill:none}
.lc-brand-copy{min-width:0}
.lc-system-badge{display:inline-flex;align-items:center;gap:6px;font-family:'DM Mono',monospace;font-size:clamp(8px,.7vw,10px);letter-spacing:.16em;text-transform:uppercase;color:var(--lc-accent);border-top:1px solid var(--lc-rule);padding:2px 0 0;margin-top:4px}
.lc-kicker{font-family:'DM Mono',monospace;font-size:clamp(8px,0.7vw,10px);letter-spacing:.24em;text-transform:uppercase;color:var(--lc-faint);margin-bottom:2px}
.lc-title{font-family:'Cinzel',serif;font-size:clamp(16px,1.8vw,26px);font-weight:800;line-height:1;letter-spacing:.08em;color:var(--lc-title);margin-bottom:2px}
.lc-title-sub{font-family:'DM Mono',monospace;font-size:clamp(9px,.8vw,11px);font-weight:400;letter-spacing:.18em;color:var(--lc-title-sub);text-transform:uppercase;margin-bottom:0}
.lc-desc{font-family:'Cormorant Garamond',serif;font-size:clamp(12px,1.2vw,15px);font-style:italic;color:var(--lc-desc);line-height:1.55;max-width:340px}
.lc-features{flex:1;min-height:0;overflow:hidden}
.lc-feature{display:flex;align-items:flex-start;gap:12px;padding:clamp(6px,.9vh,11px) 0;border-bottom:.5px solid var(--lc-accent-faint)}
.lc-feat-num{font-family:'Cinzel',serif;font-size:clamp(10px,0.9vw,12px);font-weight:700;color:var(--lc-accent);min-width:14px;padding-top:2px;opacity:.8;flex-shrink:0}
.lc-feat-head{font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(12px,1.1vw,14px);color:var(--lc-feat-head);margin-bottom:2px}
.lc-feat-body{font-family:'Cormorant Garamond',serif;font-size:clamp(11px,1vw,13px);color:var(--lc-feat-body);line-height:1.4}
.lc-projects{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.lc-projects-label{font-family:'DM Mono',monospace;font-size:clamp(9px,0.8vw,10px);letter-spacing:.18em;text-transform:uppercase;color:var(--lc-label);margin-bottom:2px}
.lc-project-row-wrap{display:flex;align-items:stretch;gap:6px}
.lc-project-row{flex:1;min-width:0;display:flex;align-items:center;gap:10px;padding:clamp(8px,1.1vh,12px) clamp(8px,1vw,12px);border:1px solid var(--lc-accent-faint);border-radius:8px;cursor:pointer;transition:border-color .15s,background .15s;background:transparent;text-align:left;font:inherit;color:inherit}
.lc-project-row:hover,.lc-project-row:focus-visible{border-color:var(--lc-accent);background:var(--lc-dz-bg)}
.lc-project-row:focus-visible{outline:2px solid var(--lc-accent);outline-offset:1px}
.lc-project-row-main{display:flex;flex-direction:column;min-width:0}
.lc-project-name{font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(12px,1.1vw,14px);color:var(--lc-feat-head)}
.lc-project-meta{font-family:'DM Mono',monospace;font-size:clamp(9px,0.8vw,10px);color:var(--lc-faint);margin-top:2px;letter-spacing:.04em}
.lc-project-arrow{margin-left:auto;color:var(--lc-accent);font-size:14px;flex-shrink:0}
.lc-project-action{flex-shrink:0;width:26px;height:26px;border-radius:50%;border:1px solid transparent;background:transparent;color:var(--lc-faint);font-size:12px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:.5;transition:opacity .12s,color .12s,border-color .12s,background .12s;align-self:center}
.lc-project-row-wrap:hover .lc-project-action,.lc-project-action:focus-visible{opacity:1}
.lc-project-action:hover,.lc-project-action:focus-visible{color:var(--lc-accent);border-color:var(--lc-accent);opacity:1}
.lc-project-delete:hover,.lc-project-delete:focus-visible{color:#e5484d;border-color:#e5484d;background:rgba(229,72,77,.08);opacity:1}
.lc-project-more{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(11px,1vw,12px);color:var(--lc-muted);text-align:center;padding-top:4px}
.lc-project-more-btn{width:100%;background:none;border:1px dashed var(--lc-accent-dashed);border-radius:8px;padding:8px 10px;font-family:'DM Mono',monospace;font-size:clamp(9px,0.8vw,10px);letter-spacing:.06em;text-transform:uppercase;color:var(--lc-muted);cursor:pointer;transition:border-color .15s,color .15s}
.lc-project-more-btn:hover,.lc-project-more-btn:focus-visible{border-color:var(--lc-accent);color:var(--lc-accent)}
.lc-project-search{width:100%;box-sizing:border-box;padding:7px 10px;border-radius:7px;border:1px solid var(--lc-accent-faint);background:transparent;color:inherit;font:inherit;font-size:clamp(11px,1vw,12px);margin-bottom:4px}
.lc-project-search:focus-visible{outline:2px solid var(--lc-accent);outline-offset:1px;border-color:var(--lc-accent)}
.lc-new-source-toggle{display:flex;align-items:center;gap:6px;width:100%;justify-content:center;padding:clamp(8px,1.1vh,11px) 10px;border:1px dashed var(--lc-accent-dashed);border-radius:8px;background:transparent;cursor:pointer;font-family:'DM Mono',monospace;font-size:clamp(10px,0.9vw,11px);letter-spacing:.08em;text-transform:uppercase;color:var(--lc-muted);transition:border-color .15s,color .15s}
.lc-new-source-toggle:hover{border-color:var(--lc-accent);color:var(--lc-accent)}
.lc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--lc-stat-sep);flex-shrink:0;margin-top:auto}
.lc-stat{background:var(--lc-stat-bg);padding:clamp(7px,1.1vh,13px) 8px;text-align:center}
.lc-stat-n{font-family:'Cinzel',serif;font-size:clamp(14px,1.55vw,20px);font-weight:700;color:var(--lc-accent);margin-bottom:2px}
.lc-stat-l{font-family:'DM Mono',monospace;font-size:clamp(9px,0.75vw,10px);letter-spacing:.14em;text-transform:uppercase;color:var(--lc-faint)}
.lc-right{background:var(--lc-right-bg);padding:clamp(14px,2.2vh,26px) clamp(12px,1.6vw,20px);position:relative;z-index:1;display:flex;flex-direction:column;overflow:hidden}
.lc-right-label{font-family:'DM Mono',monospace;font-size:clamp(9px,0.85vw,11px);letter-spacing:.22em;text-transform:uppercase;color:var(--lc-label);margin-bottom:clamp(8px,1.3vh,14px);display:flex;align-items:center;gap:8px;flex-shrink:0}
.lc-right-rule{flex:1;height:.5px;background:var(--lc-sep-faint)}
.lc-dz{border:1px dashed var(--lc-accent-dashed);padding:clamp(12px,1.7vh,22px) 10px;text-align:center;margin-bottom:clamp(5px,.7vh,9px);cursor:pointer;background:var(--lc-dz-bg);flex-shrink:0;transition:border-color .2s}
.lc-dz:hover,.lc-dz.dov{border-color:var(--lc-accent)}
.lc-dz-arrow{font-size:clamp(13px,1.6vw,19px);opacity:.45;margin-bottom:clamp(4px,.6vh,8px);color:var(--lc-accent)}
.lc-dz-head{font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(12px,1.2vw,15px);color:var(--lc-feat-head);margin-bottom:3px}
.lc-dz-sub{font-family:'Cormorant Garamond',serif;font-size:clamp(11px,1vw,12px);font-style:italic;color:var(--lc-muted)}
.lc-dz-types{display:flex;gap:4px;justify-content:center;margin-top:clamp(5px,.65vh,9px)}

.lc-paste-label{font-family:'DM Mono',monospace;font-size:clamp(9px,0.85vw,11px);letter-spacing:.15em;text-transform:uppercase;color:var(--lc-muted)}
.lc-paste-kbd{font-family:'DM Mono',monospace;font-size:clamp(9px,0.85vw,11px);color:var(--lc-faint);border:.5px solid var(--lc-kbd-border);padding:2px 5px}
.lc-or{display:flex;align-items:center;gap:8px;margin-bottom:clamp(4px,.65vh,9px);font-family:'Cormorant Garamond',serif;font-style:italic;font-size:clamp(11px,1vw,13px);color:var(--lc-or);flex-shrink:0}
.lc-or-rule{flex:1;height:.5px;background:var(--lc-sep-faint)}
.lc-new-btn{width:100%;border:1px solid var(--lc-new-border);background:var(--lc-new-bg);padding:clamp(8px,1.2vh,12px) 10px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:9px;margin-bottom:clamp(4px,.6vh,7px);font-family:inherit;transition:border-color .15s;flex-shrink:0}
.lc-new-btn:hover{border-color:var(--lc-accent)}
.lc-new-icon{font-family:'DM Mono',monospace;font-size:clamp(12px,1.4vw,16px);color:var(--lc-accent);opacity:.6;flex-shrink:0;line-height:1}
.lc-new-head{font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(12px,1.1vw,14px);color:var(--lc-feat-head);margin-bottom:2px}
.lc-new-sub{font-family:'Cormorant Garamond',serif;font-size:clamp(10px,.95vw,12px);font-style:italic;color:var(--lc-muted)}
.lc-roster-btn{width:100%;border:.5px solid var(--lc-accent-faint);background:transparent;padding:clamp(5px,.72vh,7px) 10px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:7px;font-family:inherit;transition:border-color .15s;flex-shrink:0;margin-bottom:clamp(4px,.6vh,7px)}
.lc-roster-btn:hover{border-color:var(--lc-accent)}
.lc-roster-label{font-family:'DM Mono',monospace;font-size:clamp(9px,0.8vw,10px);letter-spacing:.12em;text-transform:uppercase;color:var(--lc-faint)}
/* ── LC cloud sync widget ── */
.lc-sync-widget{width:100%;display:flex;flex-direction:column;gap:5px;flex-shrink:0}

/* Projects panel (a qol modal) */
#syncProjectsPanel .qol-modal-panel{width:min(620px,96vw)}
.spp{display:flex;flex-direction:column;gap:12px}
.spp-sec{border:1px solid var(--bdr);border-radius:10px;padding:12px 13px;display:flex;flex-direction:column;gap:9px;background:color-mix(in srgb,var(--bg) 70%,transparent);min-width:0}

.spp-list{display:flex;flex-direction:column;gap:6px;max-height:min(46vh,420px);overflow-y:auto}

.spp-row:hover,.spp-row:focus-visible{border-color:var(--accent);background:var(--al)}

.spp-row-main{display:flex;flex-direction:column;min-width:0;flex:1}
.spp-row-name{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spp-row-meta{font-size:11px;color:var(--tm);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.spp-open-tag{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:2px 7px;flex-shrink:0}
.spp-icon-btn{width:30px;height:30px;border-radius:50%;border:1px solid transparent;background:transparent;color:var(--tm);cursor:pointer;flex-shrink:0;font-size:12px;font-family:inherit}

.spp-del:hover,.spp-del:focus-visible{border-color:#e5484d;color:#e5484d}

.spp-google svg{flex-shrink:0}
.lc-sync-caption{font-family:'DM Mono',monospace;font-size:clamp(9px,0.75vw,10px);letter-spacing:.1em;text-transform:uppercase;color:var(--lc-very-faint)}
.lc-sync-btn{width:100%;border:.5px solid var(--lc-accent-faint);background:transparent;padding:clamp(5px,.72vh,7px) 10px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:7px;font-family:inherit;font-size:clamp(9px,0.85vw,11px);color:var(--lc-faint);transition:border-color .15s}
