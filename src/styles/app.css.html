.hrs-bar.sel-day{outline:2px solid #fff;outline-offset:1px;opacity:1!important}
.hrs-axis{display:flex;gap:2px;margin-top:4px}
.hrs-axis-lbl{flex:1;text-align:center;font-size:8px;color:var(--tm);line-height:1}
/* Day analytics panel */
.da-wrap{display:flex;flex-direction:column;gap:0}
.da-kpi-row{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--bdr);border-bottom:1px solid var(--bdr)}
.da-kpi{background:var(--card);padding:10px 12px;text-align:center}
.da-kpi .dak-n{font-size:20px;font-weight:700;color:var(--accent);line-height:1}
.da-kpi .dak-l{font-size:9px;color:var(--tm);text-transform:uppercase;letter-spacing:.3px;margin-top:2px}
/* Mini shift timeline */
.da-timeline{padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.da-tl-hd{display:flex;justify-content:space-between;font-size:9px;color:var(--tm);font-weight:600;text-transform:uppercase;letter-spacing:.3px;margin-bottom:4px}
.da-tl-row{display:flex;align-items:center;gap:6px;margin-bottom:2px}
.da-tl-name{font-size:11px;font-weight:500;width:90px;flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.da-tl-name:hover{color:var(--accent)}
.da-tl-bar-wrap{flex:1;height:14px;background:rgba(255,255,255,.04);border-radius:3px;position:relative;overflow:hidden}
.da-tl-bar{position:absolute;top:0;height:100%;border-radius:3px;opacity:.85}
.da-tl-hrs{font-size:10px;color:var(--tm);font-family:'JetBrains Mono',monospace;width:26px;flex-shrink:0;text-align:right}
.da-off-row{padding:6px 14px 10px;font-size:10px;color:var(--tm);border-top:1px solid var(--bdr)}
/* Mode toggle for day panel */
.da-mode-toggle{display:flex;gap:2px;background:rgba(255,255,255,.06);border-radius:6px;padding:2px}
.da-mode-btn{padding:3px 8px;border-radius:4px;font-size:10px;font-weight:600;cursor:pointer;border:none;font-family:inherit;color:var(--tm);background:transparent;transition:all .12s}
.da-mode-btn.active{background:var(--accent);color:#fff}
/* Analytics day view */
.da-an-row{display:flex;justify-content:space-between;align-items:center;padding:5px 14px;font-size:11px;border-bottom:1px solid var(--bdr)}
.da-an-row:last-child{border-bottom:none}
.da-an-row .dar-l{color:var(--tm)}.da-an-row .dar-v{font-weight:600;font-family:'JetBrains Mono',monospace;font-size:11px}
.da-note-body{padding:10px 14px;font-size:12px;color:var(--tm);font-style:italic;line-height:1.5;border-top:1px solid var(--bdr)}
/* HC default badge on calendar inputs */
.hc-inp.has-default{border-color:rgba(122,180,255,.3)}
/* Day drill */
.day-drill{padding:12px 16px}
.day-drill .dd-hd{font-size:14px;font-weight:700;margin-bottom:2px}
.day-drill .dd-sub{font-size:10px;color:var(--tm);margin-bottom:10px}
.day-drill-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--bdr);font-size:12px}
.day-drill-row:last-child{border-bottom:none}
.day-drill .dd-pills{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}
.day-drill .dd-pill{font-size:10px;padding:4px 8px;border:1px solid var(--bdr);border-radius:999px;background:rgba(255,255,255,.04)}
.day-drill .dd-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.day-drill .dd-note{margin-top:8px;padding:8px 10px;border:1px solid var(--bdr);border-radius:8px;background:rgba(255,255,255,.03);font-size:11px;color:var(--text);line-height:1.45}
.dd-mini-btn{font-size:10px;padding:3px 7px;border:1px solid var(--bdr);background:rgba(255,255,255,.04);color:var(--text);border-radius:6px;cursor:pointer}
.ft th.sortable{cursor:pointer;user-select:none}
.ft th.sortable .sort-ind{font-size:9px;color:var(--tm);margin-left:4px}
.raw-note-strong{padding:8px 12px;font-size:11px;color:#d97706;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.22);border-radius:6px;margin-bottom:6px}
/* Leaderboard */
.lb-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--bdr);font-size:12px}
.lb-row:last-child{border-bottom:none}
.lb-rank{font-size:11px;font-weight:700;color:var(--tm);width:16px;flex-shrink:0;text-align:center}
.lb-name{flex:1;font-weight:500;cursor:pointer}.lb-name:hover{color:var(--accent)}
.lb-val{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600}
.lb-bar{height:3px;border-radius:2px;background:var(--accent);opacity:.5;margin-top:2px}
/* Shift type tiles */
.stype-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:14px 16px}
.stype-tile{border-radius:8px;padding:10px 6px;text-align:center;background:rgba(255,255,255,.04);border:1px solid var(--bdr)}
.stype-tile .stn{font-size:24px;font-weight:700}.stype-tile .stl{font-size:9px;color:var(--tm);text-transform:uppercase;letter-spacing:.3px;margin-top:2px}
/* Analytics heatmap in bento */
.an-section{background:var(--card);border:1px solid var(--card-border);border-radius:14px;box-shadow:var(--sh);overflow:hidden;backdrop-filter:blur(12px)}
.an-hd{padding:14px 18px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between}
.an-hd h3{font-size:15px;font-weight:700}.an-hd-sub{font-size:11px;color:var(--tm)}
.hm-grid-wrap{overflow-x:auto;padding:0 0 8px}
.hm-grid{display:grid;font-size:10px;min-width:fit-content}
.hm-corner{background:var(--hbg);padding:4px 8px;font-weight:600;color:var(--tm);position:sticky;left:0;z-index:3;font-size:10px}
.hm-col-hd{padding:4px 2px;text-align:center;font-weight:600;color:var(--tm);font-size:9px;border-bottom:1px solid var(--bdr);min-width:32px}
.hm-col-hd.wknd{color:var(--wknd)}
.hm-row-hd{padding:3px 8px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--tm);background:var(--card);position:sticky;left:0;z-index:2;border-right:1px solid var(--bdr);white-space:nowrap}
.hm-cell{min-width:32px;min-height:22px;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;cursor:pointer;transition:transform .1s;border:1px solid rgba(0,0,0,.05)}
.hm-cell:hover{transform:scale(1.15);z-index:5;box-shadow:0 2px 8px rgba(0,0,0,.3);border-radius:3px}
.hm-0{background:rgba(255,255,255,.03);color:rgba(255,255,255,.15)}
.hm-1{background:rgba(220,38,38,.6);color:#fff}
.hm-2{background:rgba(245,158,11,.5);color:#fff}
.hm-3{background:rgba(234,179,8,.4);color:#fff}
.hm-4{background:rgba(34,197,94,.4);color:#fff}
.hm-5{background:rgba(34,197,94,.6);color:#fff}
.hm-6{background:rgba(16,185,129,.7);color:#fff}
.hm-cell-tip{position:fixed;background:var(--hbg);color:var(--ht);border:1px solid var(--bdr);border-radius:8px;padding:8px 10px;font-size:11px;box-shadow:var(--sl);z-index:1000;pointer-events:none;max-width:200px;backdrop-filter:blur(16px)}
.hm-cell-tip .tip-time{font-family:'JetBrains Mono',monospace;font-weight:600;margin-bottom:4px}
.hm-cell-tip .tip-names{color:var(--tm);line-height:1.4}
/* Overtime control desk keeps its planning signal usable below desktop width. */
@media(max-width:980px){
  .ot-command-metrics{grid-template-columns:repeat(3,minmax(110px,1fr))!important}
  .ot-command-metrics>div:nth-child(3){border-right:0!important}
}
@media(max-width:620px){
  .ot-command-metrics{grid-template-columns:repeat(2,minmax(110px,1fr))!important}
  .ot-command-metrics>div{border-right:0!important;border-bottom:1px solid var(--bdr)}
  .ot-command-panel [style*="margin-left:auto"]{margin-left:0!important}
}

/* Fairness bars */
.fair-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;padding:14px 18px}
.fair-card{display:flex;flex-direction:column;gap:6px}
.fair-name{font-size:13px;font-weight:600}
.fair-bar-wrap{display:flex;height:16px;border-radius:4px;overflow:hidden;background:rgba(255,255,255,.05)}
.fair-seg{height:100%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:#fff;min-width:1px}
.fair-legend{display:flex;gap:10px;padding:0 18px 12px;font-size:10px;color:var(--tm)}
.fair-legend span{display:flex;align-items:center;gap:3px}
.fair-legend i{width:8px;height:8px;border-radius:2px;display:inline-block}
.fair-stats{display:flex;gap:12px;font-size:11px;color:var(--tm)}
/* Attendance */
.att-check{width:16px;height:16px;border-radius:4px;border:2px solid var(--bdr);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;transition:all .12s}
.att-check:hover{border-color:var(--accent)}
.att-check.present{background:var(--early);border-color:var(--early);color:#fff}
.att-check.absent{background:#dc2626;border-color:#dc2626;color:#fff}
.att-check.late{background:var(--wknd);border-color:var(--wknd);color:#fff}
.att-bar{display:flex;height:3px;border-radius:2px;overflow:hidden;margin-top:2px;width:100%}
.att-bar .ab-p{background:var(--early)}.att-bar .ab-a{background:#dc2626}.att-bar .ab-u{background:rgba(255,255,255,.1)}
.att-legend{display:inline-flex;gap:8px;font-size:10px;color:var(--tm);margin-left:auto}
.att-legend span{display:flex;align-items:center;gap:3px}
.att-legend i{width:6px;height:6px;border-radius:50%;display:inline-block}
/* Headcount widget — inline per roster row */
.hc-widget{display:flex;align-items:center;gap:3px;flex-shrink:0;position:relative}
.hc-inp{width:32px;padding:2px 4px;border:1px solid var(--bdr);border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;background:var(--bg);color:var(--accent);text-align:center;-moz-appearance:textfield}
.hc-inp::-webkit-outer-spin-button,.hc-inp::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.hc-inp:focus{outline:none;border-color:var(--accent)}
.hc-sep{font-size:11px;color:var(--tm)}
/* Headcount summary bar in right panel */
.hc-bar{display:flex;height:4px;border-radius:2px;overflow:hidden;margin-top:3px;width:100%;background:rgba(255,255,255,.07)}
.hc-bar .hb-p{background:var(--early)}.hc-bar .hb-a{background:rgba(255,255,255,.1)}
.var-card{padding:14px;border-radius:10px;text-align:center;flex:1;min-width:100px}
.var-card .vc-n{font-size:31px;font-weight:700}.var-card .vc-l{font-size:10px;color:var(--tm);margin-top:2px}
.var-positive{background:rgba(34,197,94,.1)}.var-positive .vc-n{color:var(--early)}
.var-negative{background:rgba(220,38,38,.1)}.var-negative .vc-n{color:#dc2626}
.var-neutral{background:var(--al)}.var-neutral .vc-n{color:var(--accent)}
/* Planner */
.pl-wrap{display:flex;flex-direction:column;gap:10px}
.pl-section{background:var(--card);border:1px solid var(--card-border);border-radius:14px;box-shadow:var(--sh);overflow:hidden;backdrop-filter:blur(12px)}
.pl-hd{padding:14px 18px;border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
.pl-hd h3{font-size:15px;font-weight:700}.pl-hd-sub{font-size:11px;color:var(--tm)}
.pl-controls{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pl-controls select,.pl-controls input{padding:4px 8px;border:1px solid var(--bdr);border-radius:6px;font-family:inherit;font-size:12px;background:var(--bg);color:var(--text)}
.pl-btn{padding:4px 10px;border:1px solid var(--bdr);border-radius:6px;background:transparent;color:var(--accent);font-family:inherit;font-size:11px;font-weight:500;cursor:pointer;transition:all .12s}
.zip-pick-list{max-height:300px;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.pl-btn:hover{background:var(--al)}
.pl-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.pl-btn.danger{color:#dc2626;border-color:rgba(220,38,38,.3)}.pl-btn.danger:hover{background:rgba(220,38,38,.1)}
.pl-btn.danger.active{background:#dc2626;color:#fff}
@media(max-width:900px){.leader-planner-layout{grid-template-columns:1fr!important}}
/* Rotation map */
/* .rot-grid card layout removed — class is used exclusively for the 7-col blueprint grid (defined below) */
.rot-card{border:1px solid var(--bdr);border-radius:10px;padding:10px 12px;background:rgba(255,255,255,.03)}
.rot-card h4{font-size:13px;font-weight:600;margin-bottom:6px}
.rot-week{display:flex;gap:2px;margin-bottom:3px;align-items:center}
.rot-week .rw-label{font-size:10px;color:var(--tm);width:28px;flex-shrink:0;font-family:'JetBrains Mono',monospace}
.rot-day{width:24px;height:18px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700}
.rot-day.rw{background:var(--al);color:var(--accent)}.rot-day.ro{background:rgba(255,255,255,.04);color:var(--tm)}
.rot-day.rw-e{background:rgba(52,211,153,.15);color:var(--early)}.rot-day.rw-l{background:rgba(244,114,182,.15);color:var(--late)}
.rot-day.rw-wk{background:rgba(251,191,36,.15);color:var(--wknd)}
.rot-pos{font-size:10px;color:var(--accent);margin-top:4px;font-weight:500}
/* Projection grid */
.proj-grid-wrap{overflow-x:auto;padding:0 0 8px}
.proj-grid{display:grid;font-size:10px;min-width:fit-content}
.proj-row-hd{padding:4px 10px;font-size:12px;font-weight:500;position:sticky;left:0;z-index:2;background:var(--card);border-right:1px solid var(--bdr);white-space:nowrap;cursor:pointer}
.proj-row-hd:hover{color:var(--accent)}
.proj-row-hd.removed{text-decoration:line-through;opacity:.4}
.proj-cell{min-width:28px;min-height:24px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:600;border:1px solid rgba(0,0,0,.05)}
.proj-cell.pc-w{background:rgba(122,180,255,.15);color:var(--accent)}
.proj-cell.pc-o{background:rgba(255,255,255,.02);color:rgba(255,255,255,.2)}
.proj-cell.pc-gap{background:rgba(220,38,38,.25);color:#fff}
.proj-col-hd{padding:3px 2px;text-align:center;font-weight:600;color:var(--tm);font-size:9px;border-bottom:1px solid var(--bdr);min-width:28px}
.proj-col-hd.wknd{color:var(--wknd)}
/* What-if panel */
.wif-panel{padding:14px 18px;display:flex;flex-direction:column;gap:8px}
.wif-row{display:flex;align-items:center;gap:8px;padding:6px 10px;background:rgba(220,38,38,.06);border-radius:6px;font-size:12px}
.wif-impact{display:flex;gap:12px;flex-wrap:wrap;padding:14px 18px}
/* Leave entries */
.leave-row{display:flex;align-items:center;gap:8px;padding:6px 10px;background:rgba(245,158,11,.08);border-radius:6px;font-size:12px}
.leave-row .lr-dates{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--wknd)}
/* Add forms */
.pl-form{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:10px 18px;border-top:1px solid var(--bdr)}
.pl-form label{font-size:11px;color:var(--tm);font-weight:500}
.pl-form input,.pl-form select{padding:4px 8px;border:1px solid var(--bdr);border-radius:6px;font-family:inherit;font-size:12px;background:var(--bg);color:var(--text)}
.pl-form input[type=date]{width:130px}
/* Edit cell modal */
.cell-edit{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--card);border:1px solid var(--card-border);border-radius:14px;padding:18px;box-shadow:var(--sl);backdrop-filter:blur(20px);z-index:500;min-width:260px}
.cell-edit h4{font-size:14px;font-weight:600;margin-bottom:10px}
.cell-edit-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:499}
.cell-edit .ce-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13px}
.cell-edit .ce-row label{width:70px;font-size:11px;color:var(--tm)}
.cell-edit input[type=text]{padding:6px 10px;border:1px solid var(--bdr);border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:13px;background:var(--bg);color:var(--text);width:120px}
.cell-edit .ce-actions{display:flex;gap:6px;margin-top:12px}
/* Clickable projection cell */
.proj-cell.editable{cursor:pointer}.proj-cell.editable:hover{outline:2px solid var(--accent);outline-offset:-1px;z-index:5}
.proj-cell.overridden{outline:2px solid var(--wknd);outline-offset:-1px}
/* New hire badge */
.hire-badge{background:rgba(34,197,94,.12);color:var(--early);font-size:9px;padding:1px 5px;border-radius:4px;font-weight:600;margin-left:4px}
/* ═══ COLOUR-BLIND MODE ═══ */
body.cb-mode .hm-early::after{content:"▪";position:absolute;font-size:6px;color:rgba(0,0,0,.5);top:-1px;left:50%;transform:translateX(-50%)}
body.cb-mode .hm-mid::after{content:"●";position:absolute;font-size:5px;color:rgba(0,0,0,.5);top:0;left:50%;transform:translateX(-50%)}
body.cb-mode .hm-late::after{content:"▲";position:absolute;font-size:5px;color:rgba(0,0,0,.5);top:0;left:50%;transform:translateX(-50%)}
body.cb-mode .hm-wknd::after{content:"◆";position:absolute;font-size:5px;color:rgba(0,0,0,.5);top:0;left:50%;transform:translateX(-50%)}
body.cb-mode .hm-d{position:relative}
body.cb-mode .ct-early{border:2px solid var(--early);border-style:solid}
body.cb-mode .ct-mid{border:2px dashed var(--mid)}
body.cb-mode .ct-late{border:2px dotted var(--late)}
body.cb-mode .ct-wknd{border:2px double var(--wknd)}
body.cb-mode .ct-off{border:2px solid var(--tm);border-style:none none solid none}
body.cb-mode .pw-early::before{content:"▪ "}
body.cb-mode .pw-mid::before{content:"● "}
body.cb-mode .pw-late::before{content:"▲ "}
body.cb-mode .pw-wknd::before{content:"◆ "}
/* ═══ DENSITY MODES ═══ */
body.density-compact .ec{border-radius:8px}
body.density-compact .ech-meta{gap:4px;font-size:10px}
body.density-compact .cs-type-grid{gap:3px}
body.density-compact .cs-type{padding:4px 6px}
body.density-compact .ct-n{font-size:16px}
body.density-compact .ct-l{font-size:8px}
body.density-compact .cs-stats{font-size:9px;gap:6px}
body.density-compact .ft th{padding:4px 6px;font-size:9px}
body.density-compact .ft td{padding:3px 6px;font-size:11px}
body.density-compact .card-summary{padding:6px 10px}
body.density-compact .hrs-badge{font-size:12px}
body.density-compact .cg{gap:8px}

body.density-compact .mf-masthead{height:30px}
body.density-compact .mf-subbar{height:30px}
body.density-compact .mf-rail-item{height:26px;font-size:10px}

body.density-spacious .ech-meta{gap:10px;font-size:14px}
body.density-spacious .cs-type-grid{gap:8px}
body.density-spacious .cs-type{padding:10px 14px}
body.density-spacious .ct-n{font-size:28px}
body.density-spacious .ct-l{font-size:11px}
body.density-spacious .cs-stats{font-size:13px;gap:14px}
body.density-spacious .ft th{padding:10px 14px;font-size:12px}
body.density-spacious .ft td{padding:8px 14px;font-size:14px}
body.density-spacious .card-summary{padding:14px 18px}
body.density-spacious .hrs-badge{font-size:20px}
body.density-spacious .cg{gap:16px}
/* Spacious — universal chrome */
body.density-spacious .mf-masthead{height:44px}
body.density-spacious .mf-subbar{height:44px}
body.density-spacious .mf-rail-item{height:36px;font-size:12px}
body.density-spacious .mf-mh-brand{font-size:18px}
body.density-spacious .mf-nav-toggle{height:36px;width:142px}
body.density-spacious .mf-rail.collapsed .mf-nav-toggle{width:30px}
body.density-spacious .mf-rail{padding:12px 0;gap:4px}
body.density-spacious .mf-rail-bottom{padding:10px 0 14px;gap:4px}

}
/* ── Rotation Key Panel ── */
.rot-panel{background:var(--card);border:1px solid var(--card-border);border-radius:var(--r);box-shadow:var(--sh),inset 0 1px 0 var(--card-top);backdrop-filter:blur(12px);margin-bottom:14px;overflow:hidden}
.rot-panel-hd{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;cursor:pointer;user-select:none}
.rot-panel-hd:hover{background:rgba(255,255,255,.03)}
.rot-panel-hd h4{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.rot-panel-hd .rp-badge{font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px;background:var(--al);color:var(--accent)}
.rot-panel-hd .rp-src{font-size:10px;color:var(--tm);font-style:italic}
.rot-panel-hd .rp-arrow{font-size:11px;color:var(--tm);transition:transform .15s}
.rot-panel-hd .rp-arrow.open{transform:rotate(180deg)}
.rot-panel-body{padding:0 14px 12px;display:none}
.rot-panel-body.open{display:block}
.rot-grid{display:grid;grid-template-columns:auto repeat(7,1fr);gap:1px;font-size:11px;margin-top:8px}
.rot-grid .rg-hd{font-size:9px;font-weight:600;color:var(--tm);text-transform:uppercase;letter-spacing:.3px;padding:4px 6px;text-align:center}
.rot-grid .rg-wk{font-weight:600;color:var(--accent);padding:4px 6px;font-size:11px;font-family:'JetBrains Mono',monospace;white-space:nowrap}
.rot-grid .rg-cell{padding:3px 5px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:10px;border-radius:3px;white-space:nowrap}
.rot-grid .rg-cell.off{color:var(--tm);opacity:.5}
.rot-grid .rg-cell.s-early{color:var(--early);background:rgba(52,211,153,.08)}
.rot-grid .rg-cell.s-mid{color:var(--mid);background:rgba(122,180,255,.08)}
.rot-grid .rg-cell.s-late{color:var(--late);background:rgba(244,114,182,.08)}
.rot-grid .rg-cell.s-wknd{color:var(--wknd);background:rgba(251,191,36,.08)}
/* Person week indicators */
.rot-person-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;padding-top:8px;border-top:1px solid var(--bdr)}
.rot-person-chip{display:flex;align-items:center;gap:4px;padding:3px 8px;background:var(--al);border-radius:6px;font-size:11px}
.rot-person-chip .rpc-name{font-weight:500;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rot-person-chip .rpc-wk{font-family:'JetBrains Mono',monospace;font-weight:600;color:var(--accent);font-size:10px}
/* Anomaly bar */
/* ib-anom removed — replaced by Flags pill indicator */
/* Off-type sub-categories */
.off-leave{color:var(--accent);opacity:.7}
.off-sick{color:#F472B6;opacity:.8}
.off-ph{color:var(--wknd);opacity:.8}
.off-training{color:#2DD4BF;opacity:.7}
.off-wfh{color:var(--early);opacity:.7}
/* Anomaly banner */
/* anomaly banner removed — data issues live in Flags panel */
/* Month nav dots */
.month-dots{display:flex;gap:3px;justify-content:center;margin-top:3px}
.month-dots .md{width:5px;height:5px;border-radius:50%;background:var(--bdr)}
.month-dots .md.full{background:var(--accent)}
.month-dots .md.partial{background:var(--accent);opacity:.4}
.month-dots .md.active{outline:1.5px solid var(--accent);outline-offset:1px}
/* Continuity badge */
/* ── Parse popup ── */
.off-label{font-size:10px;font-weight:600;padding:1px 5px;border-radius:3px;letter-spacing:.3px}
.off-label.ol-leave{background:rgba(122,180,255,.1);color:var(--accent)}
.off-label.ol-sick{background:rgba(244,114,182,.1);color:#F472B6}
.off-label.ol-ph{background:rgba(251,191,36,.1);color:var(--wknd)}
.off-label.ol-training{background:rgba(45,212,191,.1);color:#2DD4BF}
.off-label.ol-wfh{background:rgba(52,211,153,.1);color:var(--early)}
/* Confidence legend */
.conf-legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;padding:8px 0;border-top:1px solid var(--bdr);font-size:10px}
.conf-legend .cl-item{display:flex;align-items:center;gap:4px}
.conf-legend .cl-dot{width:7px;height:7px;border-radius:50%}
/* Parse info popover */
.parse-pop{position:relative;display:inline-flex}
.parse-pop .pp-body{display:none;position:absolute;top:100%;left:0;margin-top:4px;background:var(--bg);border:1px solid var(--bdr);border-radius:8px;padding:8px 10px;font-size:11px;z-index:200;min-width:280px;max-width:400px;box-shadow:var(--sl);backdrop-filter:blur(16px)}
.parse-pop:hover .pp-body{display:block}
.pp-row{display:flex;align-items:center;gap:6px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.04)}.pp-row:last-child{border:none}
.pp-sheet{font-weight:600;color:var(--accent);min-width:60px}
.pp-conf{font-size:10px;padding:1px 5px;border-radius:3px;font-weight:600}
.pp-conf.high{background:rgba(52,211,153,.12);color:var(--early)}.pp-conf.medium{background:rgba(122,180,255,.12);color:var(--accent)}.pp-conf.low{background:rgba(251,191,36,.12);color:#d97706}
/* Week label in calendar */
.ws-wk{font-size:8px;color:var(--accent);font-weight:600;font-family:'JetBrains Mono',monospace;opacity:.7}
.cal-wk-badge{position:absolute;bottom:0;right:0;font-size:7px;color:var(--accent);font-weight:700;font-family:'JetBrains Mono',monospace;opacity:.6;line-height:1}
/* Upload zone features */
/* uz-features removed — features surfaced in-app */
/* Mobile toolbar overlay */
.mob-overlay{display:none}
@media(max-width:768px){.tb.tb-open{position:fixed;top:45px;left:0;right:0;bottom:0;z-index:90;background:var(--bg);overflow-y:auto;padding:12px;flex-direction:column;align-items:stretch;gap:8px;backdrop-filter:blur(20px)}.tb.tb-open .tg{width:100%}.tb.tb-open select,.tb.tb-open input[type=text]{width:100%;max-width:none}.mob-overlay{position:fixed;inset:0;z-index:89;background:rgba(0,0,0,.4);backdrop-filter:blur(2px)}}
.rot-confidence{font-size:10px;color:var(--tm);margin-top:6px;font-style:italic}
.wm-print{display:none;position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:9px;color:#999;letter-spacing:.3px}
/* All-months layout */
.person-block{margin-bottom:28px}
.person-block-hd{font-size:14px;font-weight:700;color:var(--text);margin-bottom:10px;padding:0 2px;display:flex;align-items:center;gap:8px}
.person-block-hd .pb-team{font-size:11px;color:var(--tm);font-weight:400}
.month-row{display:flex;gap:14px;overflow-x:auto;padding-bottom:6px}
.month-row::-webkit-scrollbar{height:4px}.month-row::-webkit-scrollbar-track{background:transparent}.month-row::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px}
.mc{background:var(--card);border:1px solid var(--card-border);border-radius:12px;box-shadow:var(--sh),inset 0 1px 0 var(--card-top);backdrop-filter:blur(12px);min-width:220px;max-width:220px;overflow:hidden;flex-shrink:0}
.mc.mc-full{min-width:320px;max-width:380px}
.mc-table{font-size:12px;width:100%;border-collapse:collapse}
.mc-table th{padding:5px 10px;text-align:left;font-size:10px;font-weight:600;color:var(--tm);text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--bdr)}
.mc-table td{padding:4px 10px;border-bottom:1px solid rgba(255,255,255,.04)}
.mc-table tr:hover td{background:var(--al)}
.mc-table tr.today-row{background:var(--al);outline:2px solid var(--accent);outline-offset:-1px}
.mc-table tr.or td{color:var(--tm)}
.mc-table .dc{color:var(--wknd)}
.mc-tbody-wrap{max-height:500px;overflow-y:auto}
.person-block .mc-tbody-wrap{max-height:none;overflow:visible}
.mc-tbody-wrap::-webkit-scrollbar{width:3px}.mc-tbody-wrap::-webkit-scrollbar-track{background:transparent}.mc-tbody-wrap::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px}
.mc-hd{padding:10px 14px 8px;border-bottom:1px solid var(--bdr)}
.mc-month{font-size:13px;font-weight:700;color:var(--text);margin-bottom:2px}
.mc-stats{display:flex;gap:8px;font-size:11px;color:var(--tm)}
.mc-stats strong{color:var(--accent)}
.mc-heatmap{display:flex;gap:2px;flex-wrap:wrap;padding:8px 14px 6px}
.mc-types{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:0 10px 8px}
.mc-type{background:var(--al);border-radius:5px;padding:5px 3px;text-align:center}
.mc-type .mt-n{font-size:17px;font-weight:700}.mc-type .mt-l{font-size:9px;color:var(--tm);text-transform:uppercase;letter-spacing:.3px}
.mc-type.ct-early .mt-n{color:var(--early)}.mc-type.ct-mid .mt-n{color:var(--mid)}.mc-type.ct-late .mt-n{color:var(--late)}.mc-type.ct-wknd .mt-n{color:var(--wknd)}.mc-type.ct-off .mt-n{color:var(--tm)}
.mc-footer{padding:4px 14px 10px;font-size:10px;color:var(--tm);font-style:italic}
/* ═══ v48.2 — Quick Actions bar ═══ */
#quickActions:empty{display:none}
#quickActions{display:flex;align-items:center;gap:6px;padding:4px 18px;background:rgba(122,180,255,.04);border-bottom:1px solid var(--bdr);flex-wrap:wrap;min-height:0}
.qa-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text);padding:3px 0}
.qa-icon{font-size:13px;flex-shrink:0}
.qa-text{color:var(--tm);font-size:11px}
.qa-btn{padding:2px 10px;border:1px solid rgba(122,180,255,.25);border-radius:5px;background:rgba(122,180,255,.08);color:var(--accent);font-family:inherit;font-size:10px;font-weight:600;cursor:pointer;transition:all .12s;white-space:nowrap}
.qa-btn:hover{background:rgba(122,180,255,.18);border-color:rgba(122,180,255,.4)}
.qa-dismiss{background:none;border:none;color:var(--tm);font-size:11px;cursor:pointer;padding:0 2px;opacity:.5;transition:opacity .1s}
.qa-dismiss:hover{opacity:1}
.qa-sep{width:1px;height:16px;background:var(--bdr);opacity:.4}

/* ═══ v48.2 — UI size scaling overrides ═══ */
body{font-size:14px;line-height:1.5}
.tb{min-height:40px}
.tab{font-size:13px;padding:8px 16px}
.ib{min-height:32px;font-size:12px}
.ib .l{font-size:14px}
.ech h3{font-size:15px}
.meta-pill{font-size:11px}
.ft th{font-size:12px;padding:8px 10px}
.ft td{font-size:12px;padding:6px 10px}
.mc-day{font-size:12px}
.btn,.bi,.ei{min-height:28px;font-size:12px}
.srch-inp{font-size:13px}
.dept-tab{font-size:13px;height:36px}
.help-section p,.help-section li{font-size:13px}

/* ═══ v48.2 — Tab transition animation ═══ */
.ct{transition:opacity 80ms ease}

/* ═══ v48.2 — Card hover lift ═══ */
.ec{transition:box-shadow .12s ease,transform .12s ease}
.ec:hover{box-shadow:0 4px 20px rgba(0,0,0,.3);transform:translateY(-1px)}

/* ═══ v48.2 — Focus rings for accessibility ═══ */
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ═══ PHASE A v50 — People Ops Surface ═══ */
.agent-drawer-overlay{position:fixed;inset:0;z-index:850;display:flex;align-items:flex-start;justify-content:flex-end;pointer-events:none}
.agent-drawer-overlay.open{pointer-events:all}

.agent-drawer{position:relative;z-index:1;width:min(400px,100vw);height:100vh;background:var(--hbg);border-left:1px solid var(--bdr);overflow-y:auto;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s cubic-bezier(.4,0,.2,1);backdrop-filter:blur(20px)}
.agent-drawer-overlay.open .agent-drawer{transform:translateX(0)}
.agent-drawer::-webkit-scrollbar{width:4px}.agent-drawer::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:2px}
.agent-drawer-hd{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--bdr);position:sticky;top:0;background:var(--hbg);z-index:2;gap:10px}
.agent-avatar-lg{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#b98bff);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#fff;flex-shrink:0}

.agent-drawer-close:hover{background:var(--al);color:var(--accent)}
.agent-drawer-section{padding:12px 18px;border-bottom:1px solid rgba(255,255,255,.05)}
.ads-hd{font-size:10px;font-weight:700;color:var(--tm);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between}
.agent-status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:6px}
.agent-status-btn{padding:7px 4px;border:1px solid var(--bdr);border-radius:7px;background:none;color:var(--tm);font-family:inherit;font-size:11px;cursor:pointer;text-align:center;transition:all .12s;line-height:1.3}

.agent-status-btn.asb-awol{border-color:#ec4899;background:rgba(236,72,153,.1);color:#ec4899}

.agent-event-item{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.04);font-size:12px}

.quick-event-form{background:var(--card);border:1px solid var(--card-border);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.qef-type-btn{padding:5px 10px;border:1px solid var(--bdr);border-radius:20px;background:none;color:var(--tm);font-family:inherit;font-size:11px;cursor:pointer;transition:all .1s}
.qef-type-btn:hover{border-color:var(--accent);color:var(--accent)}
.qef-type-btn.sel{background:var(--accent);color:#000;border-color:var(--accent)}
/* Event ledger */
.event-ledger-row{display:flex;align-items:flex-start;gap:10px;padding:9px 14px;border-bottom:1px solid rgba(255,255,255,.04);transition:background .1s}
.event-ledger-row:hover{background:rgba(255,255,255,.025)}
.elr-time{font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--tm);min-width:52px;flex-shrink:0;margin-top:1px}
.elr-icon{font-size:13px;flex-shrink:0}
.elr-body{flex:1;min-width:0}
.elr-who{font-size:12px;font-weight:600}
.elr-detail{font-size:11px;color:var(--tm);margin-top:1px}
.elr-note{font-size:11px;color:var(--tm);font-style:italic;margin-top:2px}
.elr-impact{font-size:10px;padding:1px 6px;border-radius:8px;font-weight:600;flex-shrink:0;align-self:flex-start;margin-top:2px}
.elr-high{background:rgba(220,38,38,.12);color:#dc2626}
.elr-medium{background:rgba(251,191,36,.1);color:var(--wknd)}
.elr-low{background:rgba(255,255,255,.06);color:var(--tm)}
/* ═══ v48.2 — Coaching What's Next card ═══ */
.wn-card{background:linear-gradient(135deg,rgba(122,180,255,.08),rgba(122,180,255,.02));border:1px solid rgba(122,180,255,.2);border-radius:10px;padding:16px 18px;margin:10px 14px 6px}
.wn-title{font-size:14px;font-weight:700;color:var(--accent);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.wn-person{font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px}
.wn-detail{font-size:11px;color:var(--tm);line-height:1.6}
.wn-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.wn-actions .btn{font-size:11px;padding:5px 14px}
.wn-empty{text-align:center;padding:18px;font-size:12px;color:var(--tm)}
.wn-done{text-align:center;padding:18px}
.wn-done .wn-grade{font-size:28px;font-weight:700;color:var(--accent)}
.wn-done .wn-msg{font-size:13px;color:var(--text);margin-top:4px}

/* ═══ v48.2 — Export menu grouped sections ═══ */
.em-section{font-size:10px;color:var(--tm);padding:8px 12px 3px;letter-spacing:.5px;text-transform:uppercase;font-weight:600}
.em-section:not(:first-child){border-top:1px solid var(--bdr)}

/* ═══ v52 — OT Planner ═══ */
.ot-wrap{max-width:1200px}
.ot-agent-row:hover{background:var(--al)!important}
.ot-panels{min-height:320px}
.ot-wishlist-panel label span{display:block;font-size:10px;font-weight:800;color:var(--tm);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
.ot-wishlist-panel input,.ot-wishlist-panel select{width:100%;padding:6px 7px;border:1px solid var(--bdr);border-radius:6px;background:var(--card);color:var(--text);font-family:inherit;font-size:12px}
.ot-wish-grid-scroll{overflow:auto;max-height:420px}
.ot-wish-grid{border-collapse:collapse;min-width:980px;width:max-content;font-size:10px}
.ot-wish-grid th,.ot-wish-grid td{border:1px solid var(--bdr);padding:0;text-align:center;min-width:42px;height:28px}
.ot-wish-grid th:first-child,.ot-wish-grid td:first-child{position:sticky;left:0;z-index:2;background:var(--bg);min-width:210px;text-align:left;padding:4px 8px;font-weight:700;color:var(--text)}
.ot-wish-team td{font-weight:800}
.ot-wish-cell{width:100%;height:27px;border:0;background:transparent;color:var(--text);font-family:inherit;font-size:10px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
.ot-wish-cell.block{background:#FEE2E2;color:#991B1B;font-weight:800}
.ot-wish-cell.filled{background:#DCFCE7;color:#166534;font-weight:800}
.ot-wish-cell.training{background:#FFF7ED;color:#C2410C;font-weight:800}
.ot-wish-cell.unavailable{background:#F3E8FF;color:#581C87;font-weight:800}
.ot-wish-cell.flag-excluded{background:#FEE2E2;color:#991B1B;font-weight:800}
.ot-wish-cell.flag-warn{background:#FEF3C7;color:#92400E;font-weight:800}
.ot-wish-cell.approved{outline:2px solid #166534;outline-offset:-2px}
.ot-wish-cell.decision-confirmed{box-shadow:inset 0 0 0 2px #0369A1}
.ot-wish-cell.decision-exported{box-shadow:inset 0 0 0 2px #0F766E}
.ot-wish-cell.decision-declined{background:#FEE2E2;color:#991B1B;text-decoration:line-through}
.ot-range-table{width:100%;border-collapse:collapse;font-size:11px}
.ot-range-table th,.ot-range-table td{border-bottom:1px solid var(--bdr);padding:7px 9px;text-align:left;color:var(--text)}
.ot-range-table th{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--tm);background:var(--card)}
.ot-range-table tr.active td{background:var(--al)}
@media(max-width:900px){.ot-wish-config-grid,.ot-wish-form-grid{grid-template-columns:1fr!important}}
@media(max-width:768px){.ot-panels,.ot-month-layout,.ot-daily-shell{grid-template-columns:1fr!important;gap:10px}}

/* ═══ v52 — Tactile button feedback ═══ */
button,
.ei,
.an-mode-btn,
.pst-btn,
.pl-btn,
.agent-status-btn,
.qef-type-btn{transition:transform .08s ease,box-shadow .08s ease,opacity .08s ease}
button:active,
.ei:active,
.an-mode-btn:active,
.pst-btn:active,
.pl-btn:active,
.agent-status-btn:active,
.qef-type-btn:active{transform:scale(.96)!important;opacity:.85!important}
/* ═══════════════════════════════════════════════════════════════
   WFM VIEW — v59 integration (prefixed .wv- to avoid collisions)
   ═══════════════════════════════════════════════════════════════ */
#wfmv{display:none;flex:1;flex-direction:column;min-height:0}
.wv-mh{display:flex;align-items:center;gap:8px;padding:0 16px;height:44px;border-bottom:1px solid var(--rule);background:var(--bg2);flex-shrink:0}
.wv-brand{font-family:'Cinzel',serif;font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--ink2);text-transform:uppercase;white-space:nowrap}
.wv-brand span{color:var(--accent)}
.wv-sep{width:1px;height:14px;background:var(--rule);flex-shrink:0}
.wv-meta{font-family:'DM Mono',monospace;font-size:9px;color:var(--tm);letter-spacing:.07em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.wv-mh-r{display:flex;align-items:center;gap:6px;margin-left:auto;flex-shrink:0}
.wv-btn{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border:1px solid var(--bdr);background:transparent;color:var(--ink3);cursor:pointer;border-radius:3px;transition:all .12s;white-space:nowrap}
.wv-btn:hover{border-color:var(--accent);color:var(--accent)}
.wv-btn.wv-sync{border-color:var(--accent);background:var(--al);color:var(--accent)}
.wv-btn.wv-merge{border-color:var(--ok);color:var(--ok)}
.wv-btn.wv-merge:hover{background:var(--ok-bg)}
.wv-tb{display:flex;align-items:center;gap:8px;padding:7px 16px;border-bottom:1px solid var(--rule2);background:var(--bg2);flex-shrink:0;flex-wrap:wrap}
.wv-tabs{display:flex;gap:2px;background:var(--bg3);border-radius:4px;padding:2px}
.wv-tab{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:.1em;text-transform:uppercase;padding:3px 10px;border:none;background:transparent;color:var(--tm);cursor:pointer;border-radius:3px;transition:all .12s}
.wv-tab.on{background:var(--bg2);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.wv-srch{font-family:'DM Mono',monospace;font-size:9px;padding:4px 8px;border:1px solid var(--bdr);background:transparent;color:var(--text);border-radius:3px;width:148px;outline:none;letter-spacing:.05em;transition:border-color .15s}
.wv-srch:focus{border-color:var(--accent)}
.wv-srch::placeholder{color:var(--tm);font-size:8px}
.wv-sel{font-family:'DM Mono',monospace;font-size:8px;padding:4px 7px;border:1px solid var(--bdr);background:var(--bg2);color:var(--ink2);border-radius:3px;cursor:pointer;outline:none;letter-spacing:.05em}
.wv-lbl{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink4)}
.wv-sp{flex:1}
.wv-wnav{display:flex;align-items:center;gap:4px}
.wv-wb{font-family:'DM Mono',monospace;font-size:9px;padding:3px 8px;border:1px solid var(--bdr);background:transparent;color:var(--tm);cursor:pointer;border-radius:3px;transition:all .12s}
.wv-wb:hover{border-color:var(--accent);color:var(--accent)}
.wv-wb:disabled{opacity:.3;cursor:default;pointer-events:none}
.wv-wlbl{font-family:'DM Mono',monospace;font-size:8px;color:var(--ink2);letter-spacing:.07em;min-width:90px;text-align:center}
.wv-body{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.wv-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:7px}
.wv-sc{background:var(--card);border:1px solid var(--card-border);border-radius:var(--r);padding:9px 11px;text-align:center;transition:border-color .12s}
.wv-sc:hover{border-color:var(--accent)}
.wv-sn{font-family:'Cinzel',serif;font-size:17px;font-weight:700;color:var(--accent);margin-bottom:1px}
.wv-sl{font-family:'DM Mono',monospace;font-size:7px;letter-spacing:.15em;text-transform:uppercase;color:var(--tm)}
.wv-team{background:var(--card);border:1px solid var(--card-border);border-radius:var(--r);overflow:hidden}
.wv-thdr{display:flex;align-items:center;gap:8px;padding:8px 13px;background:var(--bg3);border-bottom:1px solid var(--rule);cursor:pointer;user-select:none;transition:background .12s}
.wv-thdr:hover{background:var(--al)}
.wv-tl-lbl{font-family:'DM Mono',monospace;font-size:7px;letter-spacing:.12em;text-transform:uppercase;color:var(--tm);flex-shrink:0}
.wv-tname{font-family:'Playfair Display',serif;font-weight:700;font-size:13px;color:var(--text)}
.wv-tct{font-family:'DM Mono',monospace;font-size:8px;color:var(--tm);letter-spacing:.07em}
.wv-tbadges{display:flex;gap:3px;margin-left:6px}
.wv-tbadge{font-family:'DM Mono',monospace;font-size:7px;letter-spacing:.06em;padding:1px 5px;border-radius:2px;text-transform:uppercase}
.wv-tchev{margin-left:auto;color:var(--tm);font-size:9px;transition:transform .18s}
.wv-thdr.wv-open .wv-tchev{transform:rotate(180deg)}
.wv-tbody{display:none;overflow-x:auto}
.wv-tbody.wv-open{display:block}
.wv-grid{width:100%;border-collapse:collapse;font-size:11px}
.wv-grid th{font-family:'DM Mono',monospace;font-size:7px;letter-spacing:.1em;text-transform:uppercase;color:var(--tm);padding:5px 9px;text-align:left;border-bottom:1px solid var(--rule);background:var(--bg2);white-space:nowrap}
.wv-grid th.wv-dc{text-align:center;min-width:94px}
.wv-grid td{padding:4px 9px;border-bottom:.5px solid var(--rule2);vertical-align:middle}
.wv-grid tr:last-child td{border-bottom:none}
.wv-grid tr:hover td{background:var(--al)}
.wv-aname{font-family:'Playfair Display',serif;font-size:12px;font-weight:700;color:var(--text);cursor:pointer;white-space:nowrap;transition:color .12s}
.wv-aname:hover{color:var(--accent)}
.wv-aid{font-family:'DM Mono',monospace;font-size:7px;color:var(--tm);letter-spacing:.04em;margin-top:1px}
.wv-chip{display:inline-block;font-family:'DM Mono',monospace;font-size:9px;font-weight:500;padding:2px 7px;border-radius:3px;letter-spacing:.03em;white-space:nowrap}
.wv-time{background:var(--al);color:var(--accent);border:1px solid var(--card-border)}
.wv-holiday{background:var(--ok-bg);color:var(--ok);border:1px solid rgba(96,168,120,.3)}
.wv-sick{background:rgba(180,150,60,.10);color:var(--wknd);border:1px solid rgba(180,150,60,.3)}
.wv-awol{background:var(--flag-bg);color:var(--flag);border:1px solid rgba(192,112,112,.3)}
.wv-leave{background:rgba(148,103,189,.10);color:#9467bd;border:1px solid rgba(148,103,189,.3)}
.wv-other{background:var(--flag-bg);color:var(--flag);border:1px solid rgba(192,112,112,.3)}
.wv-blank{color:var(--tm);font-size:8px;opacity:.4}
.wv-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:8px}
.wv-cards>div[style*="grid-column"]{grid-column:1/-1}
.wv-card{background:var(--card);border:1px solid var(--card-border);border-radius:var(--r);overflow:hidden;cursor:pointer;transition:border-color .15s,box-shadow .15s}
.wv-card:hover{border-color:var(--accent);box-shadow:0 2px 12px rgba(90,138,176,.10)}
.wv-dl-card-wrap:hover .wv-card-dl-btn{opacity:.85!important}
.wv-card-dl-btn:hover{background:var(--accent)!important;color:#fff!important;border-color:var(--accent)!important;opacity:1!important}
.wv-card-hdr{padding:9px 11px 7px;border-bottom:1px solid var(--rule);background:var(--card-top);display:flex;align-items:flex-start;justify-content:space-between;gap:7px}
.wv-card-name{font-family:'Playfair Display',serif;font-weight:700;font-size:13px;color:var(--text);line-height:1.2}
.wv-card-id{font-family:'DM Mono',monospace;font-size:7px;color:var(--tm);letter-spacing:.05em;margin-top:1px}
.wv-card-tl{font-family:'DM Mono',monospace;font-size:7px;letter-spacing:.06em;text-transform:uppercase;padding:2px 5px;border-radius:2px;background:var(--al);color:var(--accent)}
.wv-card-days{padding:7px 11px;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.wv-card-day{text-align:center}
.wv-card-dn{font-family:'DM Mono',monospace;font-size:7px;letter-spacing:.06em;text-transform:uppercase;color:var(--tm);margin-bottom:2px}
.wv-card-ds{font-family:'DM Mono',monospace;font-size:7px;padding:2px 2px;border-radius:2px;text-align:center;min-height:16px;display:flex;align-items:center;justify-content:center}
.wv-card-ft{padding:5px 11px;border-top:1px solid var(--rule2);display:flex;align-items:center;justify-content:space-between;background:var(--card-top)}
.wv-card-hrs{font-family:'Cinzel',serif;font-size:11px;font-weight:700}
.wv-card-hl{font-family:'DM Mono',monospace;font-size:7px;letter-spacing:.1em;text-transform:uppercase;color:var(--tm)}
.wv-card-exc{font-family:'DM Mono',monospace;font-size:8px;color:var(--flag)}
.wv-heatmap-wrap{overflow-x:auto}
.wv-heatmap{width:100%;border-collapse:collapse}
.wv-heatmap th{font-family:'DM Mono',monospace;font-size:7px;letter-spacing:.1em;text-transform:uppercase;color:var(--tm);padding:5px 9px;text-align:center;border-bottom:1px solid var(--rule);background:var(--bg2)}
.wv-heatmap th:first-child{text-align:left}
.wv-heatmap td{padding:4px 6px;border-bottom:.5px solid var(--rule2);text-align:center}
.wv-heatmap tr:hover td{background:var(--al)}
.wv-hm-cell{display:inline-flex;align-items:center;justify-content:center;padding:2px 6px;border-radius:3px;font-family:'Cinzel',serif;font-size:11px;font-weight:700;min-width:36px}
.wv-day-bar{height:10px;border-radius:2px;background:var(--al);overflow:hidden;margin:3px 0}
.wv-day-seg{height:100%;float:left}
.wv-exc-wrap{background:var(--card);border:1px solid var(--card-border);border-radius:var(--r);overflow:hidden}
.wv-exc-frow{display:flex;align-items:center;gap:7px;padding:7px 12px;background:var(--bg3);border-bottom:1px solid var(--rule);flex-wrap:wrap}
.wv-exc-ct{font-family:'Cinzel',serif;font-size:18px;font-weight:700;color:var(--flag)}
.wv-exc-type{font-family:'DM Mono',monospace;font-size:7px;letter-spacing:.1em;text-transform:uppercase;padding:3px 7px;border-radius:3px;border:1px solid var(--bdr);background:transparent;color:var(--tm);cursor:pointer;transition:all .12s}
.wv-exc-type.on{background:var(--flag-bg);border-color:rgba(192,112,112,.3);color:var(--flag)}
.wv-exc-type.on.wv-et-hol{background:var(--ok-bg);border-color:rgba(96,168,120,.3);color:var(--ok)}
.wv-exc-type.on.wv-et-sck{background:rgba(180,150,60,.10);border-color:rgba(180,150,60,.3);color:var(--wknd)}
.wv-exc-type.on.wv-et-lv{background:rgba(148,103,189,.10);border-color:rgba(148,103,189,.3);color:#9467bd}
.wv-exc-tbl{width:100%;border-collapse:collapse}
.wv-exc-tbl th{font-family:'DM Mono',monospace;font-size:7px;letter-spacing:.12em;text-transform:uppercase;color:var(--tm);padding:5px 10px;text-align:left;border-bottom:1px solid var(--rule);background:var(--bg2)}
.wv-exc-tbl td{padding:5px 10px;border-bottom:.5px solid var(--rule2)}
.wv-exc-tbl tr:hover td{background:var(--al)}
.wv-modal-bg{position:fixed;inset:0;z-index:8500;background:rgba(0,0,0,.6);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:20px}
.wv-modal{background:var(--bg2);border:1px solid var(--card-border);border-radius:14px;padding:20px;max-width:500px;width:100%;box-shadow:var(--sl);max-height:90vh;overflow-y:auto;position:relative}
.wv-modal-x{position:absolute;top:11px;right:13px;font-family:'DM Mono',monospace;font-size:8px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--bdr);background:transparent;color:var(--tm);cursor:pointer;padding:3px 7px;border-radius:3px;transition:all .12s}
.wv-modal-x:hover{border-color:var(--flag);color:var(--flag)}
.wv-modal-name{font-family:'Playfair Display',serif;font-weight:700;font-size:19px;color:var(--text);margin-bottom:2px}
.wv-modal-sub{font-family:'DM Mono',monospace;font-size:9px;color:var(--tm);letter-spacing:.07em;margin-bottom:13px}
.wv-modal-week{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:13px}
.wv-modal-day{background:var(--card);border:1px solid var(--card-border);border-radius:5px;padding:7px 5px;text-align:center}
.wv-modal-dn{font-family:'DM Mono',monospace;font-size:7px;letter-spacing:.09em;text-transform:uppercase;color:var(--tm);margin-bottom:3px}
.wv-modal-dd{font-family:'DM Mono',monospace;font-size:7px;color:var(--tm);margin-bottom:3px}
.wv-modal-dh{font-family:'Cinzel',serif;font-size:10px;font-weight:700;color:var(--accent);margin-top:2px}
.wv-modal-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.wv-modal-stat{background:var(--card);border:1px solid var(--card-border);border-radius:5px;padding:9px;text-align:center}
.wv-modal-sn{font-family:'Cinzel',serif;font-size:17px;font-weight:700;color:var(--accent)}
.wv-modal-sl{font-family:'DM Mono',monospace;font-size:7px;letter-spacing:.1em;text-transform:uppercase;color:var(--tm)}
.wv-nodata{text-align:center;padding:32px 16px;color:var(--tm);font-family:'Cormorant Garamond',serif;font-style:italic;font-size:14px}

/* ── Day overview grid ── */
.wv-ov-tbl{width:100%;border-collapse:collapse;font-size:11px}
.wv-ov-th{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--tm);padding:6px 8px;text-align:center;border-bottom:1px solid var(--rule);
  background:var(--bg2);white-space:nowrap;position:sticky;top:0;z-index:2}
.wv-ov-team-col{text-align:left;min-width:120px;position:sticky;left:0;z-index:3;background:var(--bg2)}
.wv-ov-day-col{min-width:120px}
.wv-ov-today{background:color-mix(in srgb,var(--accent) 8%,var(--bg2))}
.wv-ov-row{transition:background .1s}
.wv-ov-row:hover .wv-ov-cell{background:color-mix(in srgb,var(--accent) 4%,transparent)}
.wv-ov-team-cell{padding:8px 10px;border-bottom:.5px solid var(--rule2);vertical-align:top;
  min-width:120px;position:sticky;left:0;background:var(--bg2);z-index:1;border-right:1px solid var(--rule)}
.wv-ov-cell{padding:6px 8px;border-bottom:.5px solid var(--rule2);border-right:.5px solid var(--rule2);
  vertical-align:top;min-width:120px;transition:background .1s}
.wv-ov-total-row .wv-ov-team-cell{background:var(--bg3)}
.wv-ov-chip{display:flex;align-items:center;gap:4px;padding:2px 5px;border-radius:3px;
  cursor:pointer;transition:background .1s;font-size:0}
.wv-ov-chip:hover{background:var(--al)}
.wv-ov-chip-shift{background:var(--al)}
.wv-ov-chip-exc{background:var(--flag-bg)}
.wv-ov-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}

/* v65 visual harmonisation: Universal Design Bible default finish */
:root{
  --bg:#0d1014;--bg2:#141820;--bg3:#1c2028;
  --ink:#c8d4e0;--ink2:#7890a0;--ink3:#485f70;--ink4:#2e3f50;
  --rule:#243040;--rule2:#1e2a38;
  --accent:#5a8ab0;--al:rgba(90,138,176,.15);--ah:#4a7aa0;
  --text:#c8d4e0;--tm:#485f70;--bdr:rgba(200,212,224,.12);--hbg:#141820;--ht:#c8d4e0;
  --card:rgba(20,28,42,.82);--card-border:rgba(90,138,176,.14);--card-top:rgba(90,138,176,.08);
  --flag:#c07070;--flag-bg:rgba(180,80,80,.14);--ok:#60a878;--ok-bg:rgba(80,150,96,.12);
  --early:#60a878;--mid:#5a8ab0;--late:#c07070;--wknd:#c4952a;
  --glow1:rgba(90,138,176,.15);--glow2:rgba(160,112,144,.10);--dot:rgba(200,212,224,.08);
  --am-col:#5a8ab0;--am-bg:rgba(90,138,176,.12);--am-border:#365f80;
  --pm-col:#a07090;--pm-bg:rgba(160,112,144,.12);--pm-border:#704a66;
  --mid-col:#60a878;--mid-bg:rgba(96,168,120,.12);--mid-border:#3f7654;
  --late-col:#c07070;--late-bg:rgba(192,112,112,.12);--late-border:#824646;
  --r:8px;--r-pill:999px;--sh:0 4px 20px rgba(8,16,30,.5);--sl:0 12px 40px rgba(8,16,30,.6);
  --display:'Playfair Display',serif;--sans:'DM Sans',sans-serif;--mono:'DM Mono','JetBrains Mono',monospace;
  --t:var(--text);--m:var(--tm);--c:var(--card);--b:var(--bdr);
  --lc-nature-bg:radial-gradient(ellipse 70% 50% at 88% 2%,rgba(90,138,176,.13) 0%,transparent 55%),radial-gradient(ellipse 58% 62% at 6% 96%,rgba(160,112,144,.10) 0%,transparent 52%),linear-gradient(155deg,#0d1014 0%,#141820 56%,#1c2028 100%);
  --lc-bg:#0d1014;--lc-right-bg:rgba(13,16,20,.82);--lc-border:rgba(90,138,176,.18);--lc-rule:rgba(90,138,176,.32);--lc-grid:rgba(200,212,224,.028);
  --lc-glow1:rgba(90,138,176,.12);--lc-glow2:rgba(160,112,144,.08);--lc-accent:#5a8ab0;--lc-accent-faint:rgba(90,138,176,.12);--lc-accent-dashed:rgba(90,138,176,.3);
  --lc-title:#c8d4e0;--lc-title-sub:#7890a0;--lc-feat-head:#c8d4e0;--lc-feat-body:#7890a0;
  --lc-desc:#7890a0;--lc-label:#7c90a2;--lc-muted:#7c90a2;--lc-faint:#7a8ea0;--lc-very-faint:#5e7284;
  --lc-stat-bg:rgba(13,16,20,.96);--lc-stat-sep:rgba(90,138,176,.14);--lc-dz-bg:rgba(20,28,42,.65);--lc-new-bg:rgba(20,28,42,.55);--lc-new-border:rgba(90,138,176,.2);
  --lc-sep-faint:rgba(90,138,176,.12);--lc-kbd-border:rgba(90,138,176,.16);--lc-or:#2e3f50;--lc-diamond:#485f70;
}
body{font-family:var(--sans);background:var(--bg);color:var(--text)}
.app{background:radial-gradient(ellipse at top right,var(--glow1),transparent 34%),radial-gradient(ellipse at bottom left,var(--glow2),transparent 38%),var(--bg)}
.uz{position:relative;isolation:isolate;background:var(--lc-bg);overflow:auto;-webkit-overflow-scrolling:touch}
.uz::before,.uz::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none}
.uz::before{
  background:
    repeating-radial-gradient(ellipse at 9% 28%,transparent 0 74px,color-mix(in srgb,var(--lc-accent) 22%,transparent) 75px 76px,transparent 77px 138px),
    repeating-radial-gradient(ellipse at 88% 64%,transparent 0 96px,color-mix(in srgb,var(--lc-accent) 18%,transparent) 97px 98px,transparent 99px 170px),
    linear-gradient(132deg,transparent 0 43%,color-mix(in srgb,var(--lc-accent) 12%,transparent) 43.1% 43.25%,transparent 43.5% 100%);
  mask:radial-gradient(circle at 10% 30%,#000 0 24%,transparent 36%),radial-gradient(circle at 88% 62%,#000 0 18%,transparent 32%),linear-gradient(90deg,#000,transparent 36%,transparent 64%,#000);
  opacity:.55;
}
.uz::after{
  background:
    linear-gradient(120deg,color-mix(in srgb,var(--lc-accent) 7%,transparent) 1px,transparent 1px),
    linear-gradient(30deg,color-mix(in srgb,var(--lc-rule) 10%,transparent) 1px,transparent 1px),
    radial-gradient(circle at 22% 18%,var(--lc-glow1),transparent 24%),
    radial-gradient(circle at 78% 82%,var(--lc-glow2),transparent 24%);
  background-size:88px 88px,132px 132px,100% 100%,100% 100%;
  opacity:.42;
}
.lc-root{z-index:1;box-shadow:0 24px 80px rgba(0,0,0,.18)}
.mf-masthead{height:38px;background:linear-gradient(180deg,rgba(255,255,255,.025),transparent),var(--bg2);border-bottom:1px solid var(--rule);box-shadow:0 1px 0 rgba(200,212,224,.04);font-family:var(--sans)}
.mf-mh-brand{font-family:var(--display);font-weight:700;letter-spacing:.01em;color:var(--ink)}
.mf-mh-dept,.mf-mh-stat,.mf-mh-ticker{font-family:var(--mono)}
.mf-mh-sep{background:var(--rule)}
.mf-body,.mf-content-col{background:transparent}
.mf-content-col{background-image:radial-gradient(circle at 1px 1px,var(--dot) 1px,transparent 0);background-size:28px 28px}
.mf-rail{background:linear-gradient(180deg,rgba(255,255,255,.018),transparent),var(--bg3);border-right:1px solid var(--rule);padding-top:10px}

.mf-nav-toggle,.mf-rail-item{border-radius:var(--r)}

.mf-rail-item.active{background:var(--al);color:var(--accent);box-shadow:inset 2px 0 0 var(--accent)}

.mf-subbar{height:40px;background:color-mix(in srgb,var(--bg) 92%,transparent);border-bottom:1px solid var(--rule)}
.ct{padding:18px}
.people-subtab-nav{background:transparent;border-bottom:1px solid var(--rule);padding:0 18px}
.pst-btn{padding:10px 14px;color:var(--ink2);border-radius:0}

:is(.cal-left,.cal-mid,.cal-right,.ftw,.ec,.mc,.phq-card,.plg-card,.pw-block,.an-card,.wv-card2){
  background:linear-gradient(180deg,var(--card-top),transparent 56%),var(--card);
  border:1px solid var(--card-border);
  border-radius:var(--r);
  box-shadow:var(--sh);
}
:is(.ec,.mc,.phq-card,.plg-card,.pw-block,.an-card,.wv-card2):hover{border-color:color-mix(in srgb,var(--accent) 34%,var(--card-border))}
:is(input,select,textarea){
  border-color:var(--bdr);
  border-radius:var(--r);
  background:color-mix(in srgb,var(--bg2) 82%,transparent);
  color:var(--text);
}
:is(input,select,textarea):focus{outline:1px solid color-mix(in srgb,var(--accent) 72%,transparent);box-shadow:0 0 0 3px var(--al)}
button,.btn,.bi,.bp,.ei,.an-mode-btn,.pl-btn,.agent-status-btn,.qef-type-btn,.ot-wish-cell{border-radius:var(--r)}
.bp,.pl-btn.active,.an-mode-btn.active,.agent-status-btn.active{background:var(--al);border-color:var(--accent);color:var(--accent)}
.badge,.pill,.mh-theme-btn{border-radius:var(--r-pill)}
.ot-wrap{max-width:1240px}
.ot-wishlist-panel>div[style*="border:1px solid var(--bdr)"],.ot-wishlist-panel details,.ot-wish-grid-scroll{
  background:linear-gradient(180deg,var(--card-top),transparent 56%),var(--card)!important;

}

.mf-subbar .sb-spacer{flex:1}

/* Mobile experience: touch-first shell, readable controls, safe scrolling */
@media(max-width:768px){
  html,body{width:100%;height:100%;overscroll-behavior:none;-webkit-text-size-adjust:100%}
  body{overflow:hidden}
  .app{width:100%;height:100dvh;min-height:100svh}

  /* Landing */
  /* Fills what .app leaves below the notch and the project tab strip, rather than a fixed 100dvh that
     pushed its bottom off-screen whenever the strip showed. */
  .uz{flex:1 1 auto;height:auto;min-height:0;padding:0;align-items:flex-start;overflow-y:auto;overscroll-behavior-y:contain}
  .lc-root{width:100%;max-width:none;min-height:calc(100dvh - var(--sat));height:auto;display:flex;flex-direction:column;border:0;border-radius:0;overflow:visible}
  .lc-grid{background-size:40px 40px}
  .lc-left{padding:24px 18px 0;border-right:0;border-bottom:1px solid var(--lc-border);overflow:visible}
  .lc-eyebrow{margin-bottom:18px}
  .lc-eyebrow-text{font-size:9px;letter-spacing:.08em}
  .lc-title-block{margin-bottom:0}
  .lc-brand-lockup{gap:10px;margin-bottom:14px}
  .lc-sigil{width:40px}
  .lc-kicker,.lc-system-badge{display:none}
  .lc-title{font-size:clamp(18px,6vw,24px);line-height:1}
  .lc-title-sub{font-size:10px;margin-bottom:0}
  .lc-desc{font-size:16px;line-height:1.45;max-width:30rem}
  .lc-features{display:none}
  .lc-stats{width:calc(100% + 36px);margin:22px -18px 0}
  .lc-stat{padding:12px 6px}
  .lc-stat-n{font-size:17px}
  .lc-stat-l{font-size:9px;letter-spacing:.04em}
  .lc-right{padding:18px 16px calc(20px + env(safe-area-inset-bottom));overflow:visible}
  .lc-right-label{font-size:10px;margin-bottom:12px}
  .lc-mode-toggle{margin-bottom:12px}
  .lc-mode-btn{min-height:48px;font-size:10px}
  .lc-mode-btn .lc-mbtn-icon{font-size:14px;margin-bottom:3px}
  .lc-dz{min-height:118px;padding:20px 12px;margin-bottom:10px;display:flex;flex-direction:column;justify-content:center}
  .lc-dz-arrow{font-size:20px}
  .lc-dz-head{font-size:16px}
  .lc-dz-sub{font-size:13px}
  .lc-type{font-size:10px;padding:3px 7px}
  .lc-paste-btn,.lc-new-btn,.lc-roster-btn{min-height:48px;padding:10px 12px;margin-bottom:8px}
  .lc-paste-label,.lc-roster-label{font-size:10px}
  .lc-paste-kbd{display:none}
  .lc-new-head{font-size:14px}
  .lc-new-sub{font-size:12px}
  .lc-roster-btn{margin-bottom:0}
  .lc-footer{padding-top:16px}
  .lc-privacy span,.lc-clear{font-size:9px}
  .lc-sync-caption{font-size:10px;letter-spacing:.06em;line-height:1.5}
  .lc-th-dot{width:15px;height:15px}

  /* App shell */
  .dept-strip.single{display:none}
  #mv{height:calc(100dvh - var(--sat));min-height:0}
  .mf-masthead{height:48px;min-height:48px;padding:0 12px;flex-wrap:nowrap;gap:6px;position:relative}
  .mf-mh-left{min-width:0;gap:6px}
  .mf-mh-brand{font-size:18px}
  .mf-mh-dept{max-width:45vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mf-mh-sep,.mf-mh-center,.mf-mh-right{display:none!important}
  .mf-mh-stat{font-size:10px;white-space:nowrap}
  .mf-body{height:calc(100dvh - 48px - var(--sat));min-height:0;flex-direction:column}
  .mf-content-col{order:1;width:100%;min-height:0}

  /* Mobile toolbar */
  .mf-subbar{height:auto;min-height:96px;padding:8px 10px;align-content:center;align-items:center;flex-wrap:wrap;gap:8px;background:color-mix(in srgb,var(--bg) 96%,transparent)}
  .mf-subbar .sb-leader{order:1;flex:1 1 112px;max-width:none;min-width:0;height:38px;font-size:12px}
  .mf-subbar .sb-month-nav{order:1;flex:0 0 auto}

  .mf-subbar .sb-month-select{height:38px;min-width:116px;max-width:132px;font-size:12px}

  .srch-dd,.mf-subbar .srch-dd{left:0!important;right:auto!important;width:min(330px,calc(100vw - 20px))!important;max-height:min(420px,55dvh)!important}
  .sb-scratchpad-pop{position:fixed;left:10px;right:10px;top:104px;width:auto;max-height:calc(100dvh - 184px)}
  .sb-scratchpad-pop textarea{height:min(220px,32dvh);font-size:13px}

  /* Labeled bottom navigation */
  .mf-rail,.mf-rail.collapsed,.mf-rail.expanded{order:2;position:relative;bottom:0;width:100%;height:calc(62px + env(safe-area-inset-bottom));min-height:calc(62px + env(safe-area-inset-bottom));padding:4px 8px env(safe-area-inset-bottom);border:0;border-top:1px solid var(--rule,var(--bdr));overflow:visible;align-items:stretch;background:color-mix(in srgb,var(--bg3) 96%,transparent);backdrop-filter:blur(18px)}

  .mf-rail-group.open .mf-rail-children{position:fixed;left:8px;right:8px;bottom:calc(70px + env(safe-area-inset-bottom));z-index:150;display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;padding:8px;border:1px solid var(--rule,var(--bdr));border-radius:9px;background:var(--hbg);box-shadow:var(--sl);max-height:calc(100dvh - 190px);overflow-y:auto}
