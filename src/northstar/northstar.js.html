<script>
(function(){
"use strict";

const NS_STORAGE_KEY="sc_northstar_canonical_v1";
const NS_DB_NAME="sync-northstar";
const NS_DB_STORE="workspace";
const NS_DB_KEY="canonical";
const NS_PERFORMANCE_BUDGETS={
  schedulehub:{prepare_ms:8000,commit_ms:6000,total_ms:14000,min_rows:8500},
  default:{prepare_ms:5000,commit_ms:3500,total_ms:8500,min_rows:0}
};
const NS_SCHEMA="sync.northstar.canonical";
const NS_VERSION=1;
const NS=window.NorthStar={pendingNative:null,pendingShared:null,persistWarningShown:false,persistence:"localStorage",dbWriteTimer:null,importWorker:null,templateWorker:null,templateExport:null,templateAdapter:"",performanceBudgets:NS_PERFORMANCE_BUDGETS,deferPersist:false,persistPending:false,hydrating:false,hydrated:false,trackLocalChanges:false,eventLoopLag:0};

const nsEsc=value=>typeof X==="function"?X(String(value??"")):String(value??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]));
const nsJs=value=>typeof XJS==="function"?XJS(String(value??"")):String(value??"").replace(/\\/g,"\\\\").replace(/'/g,"\\'").replace(/[\r\n]+/g," ");
const nsNow=()=>new Date().toISOString();
const nsHash=value=>{
  let h=2166136261,s=String(value??"");
  for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}
  return (h>>>0).toString(16).padStart(8,"0").toUpperCase();
};
const nsClean=value=>String(value??"").trim().replace(/\s+/g," ");
const nsNameKey=value=>nsClean(value).toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
const nsBool=value=>value===true||value===1||/^(true|yes|y|1)$/i.test(nsClean(value));
const nsArray=value=>Array.isArray(value)?value:[];
const nsId=(prefix,seed)=>prefix+"-"+nsHash(seed||Math.random()+"|"+Date.now());

const NS_IDENTITY_FIELDS=new Set([
  "agent","agent id","agent name","agent_id","authority","authority rank","authority_rank","date","day","department","dept","employee id","employee_id","end","from","full name","full_name","home team","home_team","id","leader","leader id","leader name","leader_person_id","manager","month","name","note","notes","person","person id","person name","person_id","person_name","role","schedule","shift","source","source id","source_id","start","status","team","team leader","team name","team_name","to","week","wishes"
]);
function nsNormalizeIdentityDisplay(value){
  const text=nsClean(value);
  if(/^[A-Za-z][A-Za-z' -]{1,44}\s+\d{1,2}$/.test(text))return text.replace(/\s+\d{1,2}$/,'');
  return text;
}
function nsClassifyIdentityLabel(value){
  const raw=nsClean(value),display=nsNormalizeIdentityDisplay(raw),key=display.toLowerCase();
  const reject=reason=>({valid:false,display,raw,reason});
  if(!display)return reject("blank");
  if(display.length<2||display.length>64)return reject("length");
  if(NS_IDENTITY_FIELDS.has(key))return reject("field label");
  if(/^(?:p\d{4,}|sch[-_ ]?\d+|mf[-_ ]?src[-_ ]?[a-z0-9-]+|[a-z]{1,6}[-_]\d{4,})$/i.test(display))return reject("machine identifier");
  if(/^(?:\d{1,2}\s*)?(?:mo|mon|monday|tu|tue|tues|tuesday|we|wed|wednesday|th|thu|thur|thurs|thursday|fr|fri|friday|sa|sat|saturday|su|sun|sunday)$/i.test(display))return reject("day marker");
  if(/^(?:w|wk|week)\s*\d{1,2}$/i.test(display)||/^\d{1,2}[\/-]\d{1,2}(?:[\/-]\d{2,4})?$/.test(display))return reject("date marker");
  if(/^(?:off|leave|annual leave|sick|training|overtime|ot|n\/a|null|undefined|total|subtotal)$/i.test(display))return reject("schedule value");
  if(/^(?:note\s*:|use\s+planner\b|confirmed[_ ]rotation[_ ]week\b|rotation[_ ]week\b|anchor[_ ]monday\b|shift[_ ]reference\b)/i.test(display))return reject("instructional text");
  if(/^(?:from|to)\s+(?:department|people|schedule|agent|teamlead|otplus)?hub\b/i.test(display))return reject("source linkage");
  if(/\b(?:verify and adjust|the rotation week|this person was|schedule data|source diagnostics)\b/i.test(display))return reject("instructional text");
  if(/^(?:outsurance|customer service|claims|departmenthub|peoplehub|schedulehub|save\+|ot\+)$/i.test(display))return reject("organisation label");
  if(/[=_]|(?:->|→)/.test(display))return reject("structural text");
  if(/\d/.test(display))return reject("numeric token");
  if(display.split(/\s+/).length>7)return reject("sentence");
  if(!/[A-Za-z]/.test(display)||!/^[A-Za-z][A-Za-z'.,& -]*$/.test(display))return reject("non-name token");
  return{valid:true,display,raw,reason:"person-like label"};
}
NS.classifyIdentity=nsClassifyIdentityLabel;

function nsEmptyCanonical(){
  return{
    schema:NS_SCHEMA,version:NS_VERSION,updated_at:nsNow(),
    people:[],roles:[],acting:[],reportingLines:[],orgChanges:[],teams:[],orgUnits:[],aliases:[],
    schedule:[],otWishes:[],otDecisions:[],leave:[],fairness:[],sourceLinks:[],
    sources:[],syncLog:[],imports:[],sharedScheduleGroups:[],
    publishQueue:[],conflicts:[],conflictRules:[],ruleLibraryRevisions:[],alertActions:[],exportPresets:[],performanceRuns:[]
  };
}

function nsNormalizeCanonical(value){
  const out=Object.assign(nsEmptyCanonical(),value&&typeof value==="object"?value:{});
  ["people","roles","acting","reportingLines","orgChanges","teams","orgUnits","aliases","schedule","otWishes","otDecisions","leave","fairness","sourceLinks","sources","syncLog","imports","sharedScheduleGroups","publishQueue","conflicts","conflictRules","ruleLibraryRevisions","alertActions","exportPresets","performanceRuns"].forEach(key=>{
    if(!Array.isArray(out[key]))out[key]=[];
  });
  out.schema=NS_SCHEMA;out.version=NS_VERSION;
  return out;
}

function nsCanonical(){
  if(S.nsCanonical)return S.nsCanonical;
  try{
    const raw=localStorage.getItem(NS_STORAGE_KEY);
    S.nsCanonical=nsNormalizeCanonical(raw?JSON.parse(raw):null);
  }catch(err){S.nsCanonical=nsEmptyCanonical();}
  return S.nsCanonical;
}

const NS_DEPARTMENT_TABLES=new Set(["people","roles","acting","reportingLines","orgChanges","teams","orgUnits","aliases","schedule","otWishes","otDecisions","leave","fairness","sourceLinks","sources","syncLog","imports","sharedScheduleGroups","publishQueue","conflicts","alertActions","performanceRuns"]);
function nsDepartmentKey(value){return nsNameKey(nsClean(value||""))||"default";}
function nsActiveDepartmentKey(){return nsDepartmentKey(S.activeDept||"default");}
function nsDirectDepartmentKey(record){
  if(!record||typeof record!=="object")return"";
  const value=record.department_key||record.workspace_key||record.scope_department||record.home_department||record.department||record.department_name;
  return value?nsDepartmentKey(value):"";
}
function nsSourceDepartmentMap(model){
  const map=new Map();
  (model.sources||[]).forEach(source=>{const key=nsDirectDepartmentKey(source);if(key)map.set(source.source_id,key);});
  ["people","schedule","teams","roles","acting","leave","otWishes","otDecisions"].forEach(table=>(model[table]||[]).forEach(record=>{
    const key=nsDirectDepartmentKey(record);if(key&&record.source_id&&!map.has(record.source_id))map.set(record.source_id,key);
  }));
  return map;
}
function nsRecordDepartmentKey(record,model,sourceMap){
  const direct=nsDirectDepartmentKey(record);if(direct)return direct;
  if(record&&record.source_id)return(sourceMap||nsSourceDepartmentMap(model||nsCanonical())).get(record.source_id)||"";
  return"";
}
function nsStampDepartment(records,department){
  const name=nsClean(department||S.activeDept||"Workspace")||"Workspace",key=nsDepartmentKey(name);
  return(records||[]).map(record=>{if(!record||typeof record!=="object")return record;if(!record.department_key)record.department_key=key;if(!record.department_name)record.department_name=name;return record;});
}
function nsScopedRows(table){
  const model=nsCanonical(),rows=model[table]||[],active=nsActiveDepartmentKey(),sourceMap=nsSourceDepartmentMap(model);
  if((typeof isUniversalWorkspace==="function"&&isUniversalWorkspace())||S._universalWorkspace===true)return rows.slice();
  return rows.filter(record=>{
    const key=nsRecordDepartmentKey(record,model,sourceMap);if(key)return key===active;
    if(table==="people")return nsArray(S.entries).some(entry=>nsNameKey(entry.name)===nsNameKey(record.full_name));
    if(table==="schedule")return false;
    if(table==="sources")return !!(S.fn&&record.source_name===S.fn);
    return false;
  });
}

function nsPersist(){
  if(NS.cleanReload||NS.sessionOnly)return;
  if(NS.deferPersist){NS.persistPending=true;return;}
  const model=nsCanonical();model.updated_at=nsNow();
  NS.persistPending=false;
  nsQueueDatabaseWrite(model);
  try{
    const raw=JSON.stringify(Object.assign({},model,{schedule:[],syncLog:model.syncLog.slice(0,1000),persistence_backend:"indexeddb"}));
    if(typeof _persistSet==="function")_persistSet(NS_STORAGE_KEY,raw,{critical:true});
    else localStorage.setItem(NS_STORAGE_KEY,raw);
    model.persistence_limited=false;
  }catch(err){
    model.persistence_limited=true;
    try{
      const lean=Object.assign({},model,{schedule:[],syncLog:model.syncLog.slice(0,250),persistence_limited:true,persistence_backend:"indexeddb"});
      localStorage.setItem(NS_STORAGE_KEY,JSON.stringify(lean));
    }catch(ignore){}
    if(!NS.persistWarningShown){NS.persistWarningShown=true;toast("NorthStar is active, but the browser storage limit prevented full schedule persistence.","warn",5200);}
  }
  // Local persistence is immediate; cloud writes are an explicit user decision.
  if(NS.trackLocalChanges&&!NS.applyingRemote&&typeof window._syncMarkLocalChange==="function")window._syncMarkLocalChange("canonical");
}
// A file can be opened for a one-off session without becoming a browser project. This remains
// entirely local: enabling persistence never sends anything to the cloud.
function nsSetLocalPersistenceEnabled(enabled){
  NS.sessionOnly=!enabled;
  if(NS.sessionOnly&&NS.dbWriteTimer){clearTimeout(NS.dbWriteTimer);NS.dbWriteTimer=null;}
}
window.nsSetLocalPersistenceEnabled=nsSetLocalPersistenceEnabled;
window.nsPersist=nsPersist;
window.nsFlushLocalPersistence=nsFlushDatabaseWrite;

// Clear the canonical cache as well as the application's smaller settings keys. This is kept
// separate so the landing-page Clear data action cannot leave an IndexedDB workspace behind to
// reappear after the next refresh.
function nsClearLocalWorkspaceCache(){
  clearTimeout(NS.dbWriteTimer);NS.dbWriteTimer=null;NS.sessionOnly=false;
  S.nsCanonical=nsEmptyCanonical();
  try{if(typeof _persistRemove==="function")_persistRemove(NS_STORAGE_KEY,{critical:true});else localStorage.removeItem(NS_STORAGE_KEY);}catch(err){}
  try{localStorage.removeItem("sync_last_opened");localStorage.removeItem("sc_view_state");localStorage.removeItem("sc_snapshots");}catch(err){}
  if(!window.indexedDB)return;
  try{const request=indexedDB.deleteDatabase(NS_DB_NAME);request.onerror=()=>{};}catch(err){}
}
window.nsClearLocalWorkspaceCache=nsClearLocalWorkspaceCache;

/* ═══════════════════════════════════════════════════════════════
   CLOUD SYNC (Supabase) — personal workspace push/pull
   `sb` (the Supabase client) and `S` are declared earlier in the
   inline <script> of 7os-sync-northstar.html; this file loads via
   <script src> AFTER that script runs, so both are already globals
   by the time any of this executes.
   ═══════════════════════════════════════════════════════════════ */
const SYNC_LOCAL_KEYS=["sc_settings","sc_planner","sc_blueprints","sc_positions","sc_exceptions","sc_leaverequests","sc_dayclosed","sc_coaching","sc_qol_state","sc_att","sc_hc","sc_notes","sc_people","sc_rosterfile","sc_otplan","sc_leaderplanner","sc_shiftlib","sc_coveragereq","sc_forecast","sc_coachquality","sc_agentstatuses","sc_agentnotes","sc_name_remaps","sc_people_view","sc_people_home","sc_people_logbook","sc_view_state","sc_swin_sent","sc_scope"];

function _syncCollectLocalKeys(){
  const out={};
  SYNC_LOCAL_KEYS.forEach(key=>{
    try{
      const raw=localStorage.getItem(key);
      if(raw===null||raw===undefined)return;
      try{out[key]=JSON.parse(raw);}catch(parseErr){out[key]=raw;}
    }catch(err){}
  });
  return out;
}

// opts.replace: the payload is the whole workspace (a cloud load), so a key it does not carry was
// emptied on the device that saved it — the stores delete their key when empty. Leaving this
// device's copy in place brought deleted logbook entries, notes and exceptions back.
function _syncWriteLocalKeys(data,opts){
  if(!data||typeof data!=="object")return;
  const replace=!!(opts&&opts.replace);
  SYNC_LOCAL_KEYS.forEach(key=>{
    if(!Object.prototype.hasOwnProperty.call(data,key)){
      if(!replace)return;
      try{
        if(typeof _persistRemove==="function")_persistRemove(key,{critical:true});
        else localStorage.removeItem(key);
      }catch(err){}
      return;
    }
    try{
      const value=data[key];
      const raw=typeof value==="string"?value:JSON.stringify(value);
      if(typeof _persistSet==="function")_persistSet(key,raw,{critical:true});
      else localStorage.setItem(key,raw);
    }catch(err){}
  });
}

async function _syncGetUserId(){
  if(typeof sb==="undefined"||!sb)return null;
  try{
    const {data:sessionData}=await sb.auth.getSession();
    if(!sessionData||!sessionData.session)return null;
    const {data:userData}=await sb.auth.getUser();
    return(userData&&userData.user&&userData.user.id)||null;
  }catch(err){return null;}
}

// Personal (non-team) saves always use this fixed key, NOT nsActiveDepartmentKey(). nsCanonical()
// is one unified store holding every department's people/schedule/OT/etc together (each record is
// individually tagged with its own department_key internally — see NS_DEPARTMENT_TABLES) — it is
// NOT split per department. Keying the row by whichever department tab happened to be active at
// save time used to (a) silently duplicate the entire multi-department dataset into a separate row
// every time the user switched tabs and saved again, and (b) made syncPullWorkspace() fetch a
// potentially stale row on a new device that boots into "default" while the most recent save
// actually landed under a different department's key. One fixed key means one row, always current,
// regardless of which department tab is active. `department_key` stays meaningful for the
// still-unbuilt team-shared-workspace path (see TODO(teams)), where distinct team departments are
// a real, separate concept.
const SYNC_PERSONAL_WORKSPACE_KEY="__personal__";

// Numeric comparison, not string: timestamps arrive as JS toISOString() ("...376Z") and as
// round-tripped Postgres values ("...376+00:00") — equal values that do NOT compare reliably as
// plain strings. Used by local hydration only; cloud sync compares server versions instead (see
// CROSS-DEVICE SYNC STATE below), because two devices' clocks never agree.
function nsIsNewerTimestamp(a,b){
  const ta=Date.parse(a||""),tb=Date.parse(b||"");
  if(isNaN(ta))return false;
  if(isNaN(tb))return true;
  return ta>tb;
}

// Consecutive push failures — a single failed save fades from view (the dot) in 2.5s, easy to miss
// entirely. On the 2nd consecutive failure this escalates to a persistent, dismiss-requiring banner
// via the HTML-side _syncOnPersistentFailure/_syncClearPersistentFailure hooks (defined near the
// save-dot code in 7os-sync-northstar.html) so a real outage can't go unnoticed the way the missing
// workspaces constraint did.
let _syncConsecutiveFailures=0;
function _syncReportPushOutcome(state){
  if(state==="saved"){
    const hadFailures=_syncConsecutiveFailures>0;
    _syncConsecutiveFailures=0;
    if(hadFailures&&typeof _syncClearPersistentFailure==="function")_syncClearPersistentFailure();
  }else if(state==="error"){
    _syncConsecutiveFailures++;
    if(_syncConsecutiveFailures>=2&&typeof _syncOnPersistentFailure==="function")_syncOnPersistentFailure(_syncConsecutiveFailures);
  }else if(state==="conflict"){
    if(typeof _syncOnSyncConflict==="function")_syncOnSyncConflict();
  }
}

/* ───────────────────────────────────────────────────────────────
   CROSS-DEVICE SYNC STATE

   Every save bumps a server-owned `version` on the workspace row (a
   trigger in the database; clients never write it). Each device
   remembers, in localStorage, the version it last saved or loaded and
   whether it has changed anything since:

     unsaved here?  cloud moved on?   pull does       save does
     no             no                nothing         write
     no             yes               load the cloud  refused → compare
     yes            no                nothing         write
     yes            yes               compare         refused → compare

   This replaces comparing updated_at between devices, which failed in
   both directions: a fresh device stamps its empty model with "now" at
   boot, so every older cloud save looked stale and was never loaded;
   and two device clocks never agree exactly. A save is an UPDATE ...
   WHERE version = <what this device last saw>, so the check and the
   write are one statement and cannot interleave with another device.

   A device that has never synced for this account has no version. It
   may load the cloud copy only if it holds no projects of its own, and
   may only create the row, never replace one — so an empty or unrelated
   local model can never overwrite real cloud data without the user
   choosing that in the comparison.
   ─────────────────────────────────────────────────────────────── */
const SYNC_STATE_KEY="sc_cloud_sync";
function _syncReadState(){
  try{const value=JSON.parse(localStorage.getItem(SYNC_STATE_KEY)||"null");return value&&typeof value==="object"?value:{};}
  catch(err){return{};}
}
function _syncWriteState(patch){
  const next=Object.assign(_syncReadState(),patch);
  try{localStorage.setItem(SYNC_STATE_KEY,JSON.stringify(next));}catch(err){}
  return next;
}
// The cloud version this device last matched for this account: null when it never has, 0 when the
// cloud held no row at the time.
function _syncBaseVersion(userId){
  const state=_syncReadState();
  return state.uid===userId&&Number.isFinite(state.version)?state.version:null;
}
function _syncIsDirty(){return _syncReadState().dirty===true;}

// Bumped on every local change, so a save that was in flight while the user kept editing does not
// mark those later edits as saved.
let _syncChangeSeq=0;
// `changed` lists what moved since the last cloud save or load (storage keys, or "canonical" for
// project people/schedule data), so the save panel can say what a save will carry, not just that
// something will.
function _syncMarkDirty(key){
  _syncChangeSeq++;
  const state=_syncReadState(),changed=Array.isArray(state.changed)?state.changed:[];
  const what=key||"workspace";
  if(state.dirty===true&&changed.includes(what))return;
  _syncWriteState({dirty:true,changed:changed.includes(what)?changed:changed.concat(what)});
}
function _syncChangedKeys(){
  if(!_syncIsDirty())return[];
  const changed=_syncReadState().changed;
  return Array.isArray(changed)?changed.slice():[];
}
function _syncRecordSynced(userId,version,updatedAt,seqAtStart){
  const stillClean=seqAtStart===undefined||seqAtStart===_syncChangeSeq;
  _syncWriteState({uid:userId,version,updated_at:updatedAt||null,dirty:stillClean?false:_syncIsDirty(),changed:stillClean?[]:_syncChangedKeys()});
}

// NS.applyingRemote: writing the pulled copy into local storage must not count as a local edit.
// Per-device view context syncs with the payload but is not work worth a conflict prompt.
// sc_people_view is the same kind of record: which People sub-view and filters are showing.
const SYNC_DIRTY_KEYS=new Set(SYNC_LOCAL_KEYS.filter(key=>key!=="sc_view_state"&&key!=="sc_people_view"));
// Called by _persistSet/_persistRemove for every key they write.
function _syncNoteKeyWrite(key){
  if(!NS.trackLocalChanges||NS.applyingRemote||!SYNC_DIRTY_KEYS.has(key))return;
  if(typeof window._syncMarkLocalChange==="function")window._syncMarkLocalChange(key);
  else _syncMarkDirty(key);
}

// Resolves true once local hydration has finished: until then the in-memory model came from the
// lean localStorage copy, which deliberately holds no schedule rows. Saving that would upload a
// workspace with every shift missing; loading a cloud copy before it would let hydration replace
// the loaded copy a moment later.
function nsWhenBootSettled(timeoutMs){
  if(NS.bootSettled)return Promise.resolve(true);
  return new Promise(resolve=>{
    const timer=setTimeout(()=>resolve(false),timeoutMs||15000);
    window.addEventListener("ns:boot-settled",()=>{clearTimeout(timer);resolve(true);},{once:true});
  });
}

function _syncHasLocalProjects(){
  try{return nsListCanonicalProjects().length>0;}catch(err){return false;}
}
function _syncWorkspaceIsOpen(){
  return!!(S.activeDept||(S.entries&&S.entries.length)||S.wb);
}

async function _syncReportConflict(userId){
  // Best effort: the comparison can say when the other device saved, instead of only that it did.
  try{
    const{data}=await sb.from("workspaces").select("updated_at").eq("owner_user_id",userId).eq("department_key",SYNC_PERSONAL_WORKSPACE_KEY).maybeSingle();
    if(data&&typeof _syncConflictRemoteAt!=="undefined")_syncConflictRemoteAt=data.updated_at;
  }catch(err){}
  if(typeof _syncSetSaveDot==="function")_syncSetSaveDot("conflict");
  _syncReportPushOutcome("conflict");
}

async function _syncPushWorkspaceNow(opts){
  opts=opts||{};
  try{
    const userId=await _syncGetUserId();
    if(!userId)return false; // signed out — defensive no-op, should not happen behind the auth gate
    if(typeof _syncSetSaveDot==="function")_syncSetSaveDot("saving");
    if(!await nsWhenBootSettled())throw new Error("this device's workspace has not finished loading");
    // Edits still on a debounce timer are part of what the user just pressed Save for.
    if(typeof window._flushAllPendingPersist==="function")window._flushAllPendingPersist();
    const seq=_syncChangeSeq;
    const data=Object.assign({},nsCanonical(),_syncCollectLocalKeys());
    const mine={owner_user_id:userId,department_key:SYNC_PERSONAL_WORKSPACE_KEY};
    const base=_syncBaseVersion(userId);
    let result;
    if(opts.force){
      // Only from the comparison's explicit "overwrite the cloud with this device's version".
      result=await sb.from("workspaces").upsert(Object.assign({team_id:null,data},mine),{onConflict:"owner_user_id,department_key"}).select("version,updated_at").single();
    }else if(base){
      result=await sb.from("workspaces").update({data}).eq("owner_user_id",userId).eq("department_key",SYNC_PERSONAL_WORKSPACE_KEY).eq("version",base).select("version,updated_at").maybeSingle();
      if(!result.error&&!result.data){
        // No row matched: another device saved since this one last synced, or the row is gone.
        const{data:remote,error}=await sb.from("workspaces").select("version").eq("owner_user_id",userId).eq("department_key",SYNC_PERSONAL_WORKSPACE_KEY).maybeSingle();
        if(error)throw error;
        if(remote){await _syncReportConflict(userId);return false;}
        result=await sb.from("workspaces").insert(Object.assign({team_id:null,data},mine)).select("version,updated_at").single();
      }
    }else{
      // Never synced from here (or the cloud was empty when this device last looked): create the row.
      // If one exists after all, the unique key refuses the insert and the user gets the comparison.
      result=await sb.from("workspaces").insert(Object.assign({team_id:null,data},mine)).select("version,updated_at").single();
    }
    if(result.error){
      if(result.error.code==="23505"){await _syncReportConflict(userId);return false;}
      throw result.error;
    }
    _syncRecordSynced(userId,Number(result.data.version),result.data.updated_at,seq);
    if(typeof _syncSetSaveDot==="function")_syncSetSaveDot("saved");
    _syncReportPushOutcome("saved");
    return true;
  }catch(err){
    console.error("[sync] workspace push failed",err);
    if(typeof _syncSetSaveDot==="function")_syncSetSaveDot("error");
    _syncReportPushOutcome("error");
    return false;
  }
}

function _syncApplyRemote(remote){
  // A write still queued from before the load would land after it and put the old value back.
  if(typeof window._flushAllPendingPersist==="function")window._flushAllPendingPersist();
  NS.applyingRemote=true;
  try{
    S.nsCanonical=nsNormalizeCanonical(remote);
    _syncWriteLocalKeys(remote,{replace:true});
    // Same order as launch: the stores load from storage first, then the canonical people are
    // mapped onto them.
    if(typeof _syncReloadLocalStores==="function")_syncReloadLocalStores();
    if(typeof nsSanitizeCanonicalIdentities==="function")nsSanitizeCanonicalIdentities();
    if(typeof nsSyncPeopleToRuntime==="function")nsSyncPeopleToRuntime();
    // Written through to localStorage/IndexedDB, so a reload finds the loaded copy rather than
    // whatever this device held before it.
    nsSetLocalPersistenceEnabled(true);
    nsPersist();
  }finally{NS.applyingRemote=false;}
  // See nsHydrateDatabase's matching call: S.entries drives the calendar/dashboard directly and is
  // never itself pulled/persisted, so it needs rebuilding whenever the canonical model is replaced.
  nsRestoreEntriesFromCanonical();
}

// Reads the personal workspace row and applies it per the table above. Resolves to one of:
//   "applied"     the cloud copy replaced this device's copy
//   "current"     this device already matches the cloud
//   "empty"       there is no cloud copy yet
//   "conflict"    both sides changed; the comparison is showing
//   "held"        (auto only) a newer cloud copy exists but a workspace is open here, so it waits
//                 for the user to choose Sync from cloud
//   "signed-out" / "error"
// opts.auto: the automatic check after sign-in. opts.takeCloud: the user chose the cloud copy.
async function _syncPullOnce(opts){
  window._syncLastPullFailed=false;
  try{
    const userId=await _syncGetUserId();
    if(!userId)return"signed-out";
    if(!await nsWhenBootSettled())throw new Error("this device's workspace has not finished loading");
    // TODO(teams): team-shared rows (team_id + department_key) are not read here yet. They need
    // their own version per row once the team switcher exists.
    const{data:row,error}=await sb.from("workspaces").select("data,version,updated_at").eq("owner_user_id",userId).eq("department_key",SYNC_PERSONAL_WORKSPACE_KEY).maybeSingle();
    if(error)throw error;
    const base=_syncBaseVersion(userId);
    if(!row||!row.data){
      _syncWriteState({uid:userId,version:0,updated_at:null});
      return"empty";
    }
    const version=Number(row.version)||1;
    if(!opts.takeCloud){
      if(version===base)return"current";
      const unsaved=_syncIsDirty()||(base===null&&_syncHasLocalProjects());
      if(unsaved){
        if(typeof _syncConflictRemoteAt!=="undefined")_syncConflictRemoteAt=row.updated_at;
        if(typeof _syncSetSaveDot==="function")_syncSetSaveDot("conflict");
        _syncReportPushOutcome("conflict");
        return"conflict";
      }
      if(opts.auto&&_syncWorkspaceIsOpen())return"held";
    }
    _syncApplyRemote(row.data);
    _syncRecordSynced(userId,version,row.updated_at);
    if(typeof window._syncSetPulledFromCloud==="function")window._syncSetPulledFromCloud();
    return"applied";
  }catch(err){
    console.error("[sync] workspace pull failed",err);
    window._syncLastPullFailed=true;
    return"error";
  }
}
// One pull at a time: the automatic check after sign-in and a Sync from cloud click can overlap.
let _syncPullInFlight=null;
function syncPullWorkspace(opts){
  opts=opts||{};
  if(_syncPullInFlight){
    // A plain request shares the running pull; choosing the cloud copy must still run after it.
    return opts.takeCloud?_syncPullInFlight.then(()=>syncPullWorkspace(opts)):_syncPullInFlight;
  }
  // Announced so an open Projects & Ops panel can show the check in progress, then its outcome.
  _syncPullInFlight=_syncPullOnce(opts).finally(()=>{_syncPullInFlight=null;window.dispatchEvent(new Event("sync:pull-settled"));});
  window.dispatchEvent(new Event("sync:pull-started"));
  return _syncPullInFlight;
}
function _syncPullPending(){return!!_syncPullInFlight;}

// This entire file is wrapped in one top-level IIFE (see the opening `(function(){` at the very
// top and its matching `})();` near the end) — every function above is scoped to THIS closure and
// is NOT visible by bare name from the separate <script> block in 7os-sync-northstar.html, even
// though that script runs after this one and both share the same `window`. Confirmed live:
// `window.syncPullWorkspace` was `undefined` long after full page load, not just during a brief
// startup race — meaning every `typeof X==='function'` guard in the main script around these names
// (the manual save button, _syncOnSignedIn's own pull call, the project picker) was silently
// succeeding into a permanent no-op, not a temporary one. Explicitly exporting the handful the main
// script actually calls fixes that at the source, once, here, rather than patching each call site.
window.syncPullWorkspace=syncPullWorkspace;
window._syncPullPending=_syncPullPending;
window._syncPushWorkspaceNow=_syncPushWorkspaceNow;
window._syncMarkDirty=_syncMarkDirty;
window._syncIsDirty=_syncIsDirty;
window._syncChangedKeys=_syncChangedKeys;
window._syncNoteKeyWrite=_syncNoteKeyWrite;
window._syncGetUserId=_syncGetUserId;
window.nsRestoreEntriesFromCanonical=nsRestoreEntriesFromCanonical;
window.nsListCanonicalProjects=nsListCanonicalProjects;
// Same trap as the exports above, found the same way — by a test, not by reading the code. The main
// script guards every cross-file call with `typeof X==='function'`, so an unexported name does not
// throw: it silently skips. These five were each being skipped permanently, which meant the
// per-project view state never saved or restored (it keys off nsActiveDepartmentKey/nsDepartmentKey),
// "last opened" was never recorded, deleting the project you had open never cleared it from view,
// and the backup export wrote out an empty workspace.
window.nsCanonical=nsCanonical;
window.nsDepartmentKey=nsDepartmentKey;
window.nsActiveDepartmentKey=nsActiveDepartmentKey;
window.nsDownloadBlob=nsDownloadBlob;
window._syncCollectLocalKeys=_syncCollectLocalKeys;
// The Ops overview counts scoped OT wishes to decide whether to offer the OT+ workbench.
window.nsScopedRows=nsScopedRows;
// People-view edits write through to the canonical person; opening a project fills S.people.
window.nsApplyRuntimePersonEdit=nsApplyRuntimePersonEdit;
window.nsFillRuntimePeopleFromCanonical=nsFillRuntimePeopleFromCanonical;

function nsOpenDatabase(){
  if(!window.indexedDB)return Promise.reject(new Error("IndexedDB unavailable"));
  return new Promise((resolve,reject)=>{
    const request=indexedDB.open(NS_DB_NAME,1);
    request.onupgradeneeded=()=>{const db=request.result;if(!db.objectStoreNames.contains(NS_DB_STORE))db.createObjectStore(NS_DB_STORE);};
    request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error||new Error("Database open failed"));
  });
}

async function nsDatabaseWrite(model){
  const db=await nsOpenDatabase();
  try{await new Promise((resolve,reject)=>{const tx=db.transaction(NS_DB_STORE,"readwrite");tx.objectStore(NS_DB_STORE).put(model,NS_DB_KEY);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});NS.persistence="indexeddb";}
  finally{db.close();}
}

// Never let a write that lands before hydration erase a stored schedule. Boot seeds the model
// from localStorage, whose copy deliberately stores schedule:[], and persists it; unguarded, that
// write overwrote the IndexedDB record ~180ms into every reload, before hydration had read it
// back. A model that actually carries rows always writes.
function nsCanWriteSnapshot(snapshot){
  return NS.hydrated||!!(snapshot&&(snapshot.schedule||[]).length);
}
function nsSnapshotCanonical(){
  const current=nsCanonical();
  return typeof structuredClone==="function"?structuredClone(current):JSON.parse(JSON.stringify(current));
}
function nsQueueDatabaseWrite(model){
  clearTimeout(NS.dbWriteTimer);
  NS.dbWriteTimer=setTimeout(()=>{
    NS.dbWriteTimer=null;
    const snapshot=nsSnapshotCanonical();
    if(!nsCanWriteSnapshot(snapshot))return;
    nsDatabaseWrite(snapshot).catch(()=>{NS.persistence="localStorage fallback";});
  },180);
}
// The write is debounced, so a tab closed straight after an import would lose it. Flush on the
// way out.
function nsFlushDatabaseWrite(){
  if(!NS.dbWriteTimer)return;
  clearTimeout(NS.dbWriteTimer);NS.dbWriteTimer=null;
  try{
    const snapshot=nsSnapshotCanonical();
    if(!nsCanWriteSnapshot(snapshot))return;
    nsDatabaseWrite(snapshot).catch(()=>{});
  }catch(err){}
}
window.addEventListener("pagehide",nsFlushDatabaseWrite);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")nsFlushDatabaseWrite();});

// Bridges the canonical layer (people/schedule/etc, restored from IndexedDB or pulled from
// Supabase) into S.entries — the flat runtime rows the calendar/dashboard actually render, and
// the exact thing _restoreViewportFromState() checks to decide landing screen vs dashboard. Reuses
// nsRuntimeEntry(), the same mapper an import already uses for non-PeopleHub schedule sources — a
// hydrated/pulled canonical schedule row is shaped identically. Scoped to the active department via
// nsScopedRows(), consistent with how the rest of the app already filters by department.
function nsRestoreEntriesFromCanonical(){
  try{
    const scoped=(typeof nsScopedRows==="function")?nsScopedRows("schedule"):(nsCanonical().schedule||[]);
    S.entries=(scoped||[]).map(nsRuntimeEntry).filter(row=>row.date&&!isNaN(row.date));
    // Every indexed view (calendar, dashboard, analytics) caches by entriesVer. Without the bump a
    // project opened here rendered whatever index was built before it: empty, or the last project.
    S.entriesVer=(S.entriesVer||0)+1;
    if(typeof invalidateDerivedCache==="function")invalidateDerivedCache();
    // S.entries drives the calendar/dashboard directly, but S.months/S.month/S.mIdx are a SEPARATE
    // derived index that every local import path (proc/loadIntoWorkspace, etc.) computes for itself
    // at load time — this function is the one entry point that rebuilds S.entries WITHOUT going
    // through any of those, because it exists specifically for the cross-device/no-local-workbook
    // case (a fresh sign-in pulling cloud data, or reopening a project from the picker). Left
    // uncalled here, S.months stays [] (or holds whatever the previously open project left behind),
    // so the calendar has no month to show and every month-gated surface renders empty — the
    // schedule data is genuinely in S.entries, but nothing built the index used to navigate to it.
    // _refreshLoadedMonthsFromEntries lives in the main inline script, which runs BEFORE this file
    // loads (see the file-load-order note elsewhere in this file), so it is already a global by the
    // time this executes; the typeof guard matches this codebase's convention for that boundary.
    if(typeof _refreshLoadedMonthsFromEntries==="function")_refreshLoadedMonthsFromEntries();
  }catch(err){console.error("[sync] rebuilding runtime entries from canonical failed",err);}
}

// Enumerates the distinct projects/departments present in the canonical store (which, once synced,
// holds every department the user has ever worked on, from any device — not just whatever's locally
// open right now) so the signed-in landing screen can offer a "continue a project" picker instead of
// either guessing which one to auto-resume or dumping the user back at an empty drop-zone. Reuses
// the exact same department-key/source-map logic nsScopedRows() already uses, so counts here match
// what actually filters into each department once opened.
function nsListCanonicalProjects(){
  try{
    const model=nsCanonical(),sourceMap=nsSourceDepartmentMap(model),byKey=new Map();
    const ensure=(key,name)=>{
      if(!key)return null;
      if(!byKey.has(key))byKey.set(key,{key,name:nsClean(name)||key,peopleCount:0,scheduleCount:0,lastUpdated:""});
      const rec=byKey.get(key);
      const cleanName=nsClean(name);
      if(cleanName&&rec.name===rec.key)rec.name=cleanName;
      return rec;
    };
    (model.sources||[]).forEach(source=>{
      const key=nsDirectDepartmentKey(source);if(!key)return;
      const rec=ensure(key,source.department_name||source.source_name);
      if(rec&&source.loaded_at&&String(source.loaded_at)>String(rec.lastUpdated))rec.lastUpdated=source.loaded_at;
    });
    (model.people||[]).forEach(person=>{
      const key=nsRecordDepartmentKey(person,model,sourceMap);if(!key)return;
      const rec=ensure(key,person.home_department);
      if(rec)rec.peopleCount++;
    });
    (model.schedule||[]).forEach(row=>{
      const key=nsRecordDepartmentKey(row,model,sourceMap);if(!key)return;
      const rec=ensure(key,row.department);
      if(rec){rec.scheduleCount++;if(row.imported_at&&String(row.imported_at)>String(rec.lastUpdated))rec.lastUpdated=row.imported_at;}
    });
    return[...byKey.values()].filter(p=>p.peopleCount||p.scheduleCount).map(p=>{
      p.lastOpened=(typeof _syncGetLastOpened==="function")?_syncGetLastOpened(p.key):"";
      return p;
    }).sort((a,b)=>{
      const ra=a.lastOpened||a.lastUpdated||"",rb=b.lastOpened||b.lastUpdated||"";
      return String(rb).localeCompare(String(ra));
    });
  }catch(err){console.error("[sync] listing canonical projects failed",err);return[];}
}

// Permanently removes every trace of one project/department — the picker's own delete action
// (see _syncDeleteProject in the main script), built precisely because there was previously no
// user-facing way to do this at all: the only tool available was hand-editing the Supabase row's
// JSONB directly, which repeatedly proved non-durable — this device's local canonical store (the
// actual source nsListCanonicalProjects reads from, and what every auto-save re-pushes to the
// cloud) was never touched by those DB edits, so the same stale data kept reappearing no matter
// how many times the server copy was cleaned. This is the real fix: strip it from every place it
// can hide — every NS_DEPARTMENT_TABLES array, the S.people runtime dict, any open S.workspace
// tab snapshot, and the sc_positions/sc_blueprints localStorage blobs (both keyed by department
// name directly, a different shape NS_DEPARTMENT_TABLES doesn't cover) — then persists (which also
// triggers an immediate cloud push) so there's nothing left in memory to silently resurrect it.
function nsRemoveDepartmentEverywhere(targetKey){
  if(!targetKey)return{removed:0};
  try{
    const model=nsCanonical(),sourceMap=nsSourceDepartmentMap(model);
    let removed=0;
    NS_DEPARTMENT_TABLES.forEach(table=>{
      const arr=model[table];
      if(!Array.isArray(arr))return;
      const before=arr.length;
      model[table]=arr.filter(record=>{
        const key=nsRecordDepartmentKey(record,model,sourceMap);
        if(key===targetKey){removed++;return false;}
        return true;
      });
    });
    if(S.people&&typeof S.people==="object"){
      Object.keys(S.people).forEach(name=>{
        const rec=S.people[name];
        const dept=rec&&(rec.department||rec.homeDepartment||rec.team);
        if(dept&&nsDepartmentKey(dept)===targetKey)delete S.people[name];
      });
    }
    if(S.workspace&&typeof S.workspace==="object"){
      Object.keys(S.workspace).forEach(name=>{if(nsDepartmentKey(name)===targetKey)delete S.workspace[name];});
    }
    ["sc_positions","sc_blueprints"].forEach(storageKey=>{
      try{
        const raw=localStorage.getItem(storageKey);
        if(!raw)return;
        const obj=JSON.parse(raw);
        if(!obj||typeof obj!=="object")return;
        let changed=false;
        Object.keys(obj).forEach(name=>{if(nsDepartmentKey(name)===targetKey){delete obj[name];changed=true;}});
        if(changed){if(typeof _persistSet==="function")_persistSet(storageKey,JSON.stringify(obj),{critical:true});else localStorage.setItem(storageKey,JSON.stringify(obj));}
      }catch(err){}
    });
    nsPersist();
    return{removed};
  }catch(err){console.error("[sync] removing department failed",err);return{removed:0,error:err};}
}
window.nsRemoveDepartmentEverywhere=nsRemoveDepartmentEverywhere;

// Renames one project/department everywhere it is recorded — the counterpart to the removal above,
// and for the same reason: renameDept() only ever worked on a department already OPEN as a tab
// (it needs S.workspace[oldName]), so a project sitting in the sign-in picker, not yet opened on
// this device, had no way to be renamed at all. Walks the same tables by the same derived key, so
// records that inherit their department from a source (rather than carrying it directly) follow
// their source automatically. The source map is built once, BEFORE any mutation, so every record
// is still matched against its pre-rename key as the pass proceeds.
const NS_DEPARTMENT_NAME_FIELDS=["scope_department","home_department","department","department_name"];
const NS_DEPARTMENT_KEY_FIELDS=["department_key","workspace_key"];
function nsRenameDepartmentEverywhere(targetKey,newName){
  const clean=nsClean(newName);
  if(!targetKey||!clean)return{renamed:0};
  const nextKey=nsDepartmentKey(clean);
  try{
    const model=nsCanonical(),sourceMap=nsSourceDepartmentMap(model);
    let renamed=0;
    NS_DEPARTMENT_TABLES.forEach(table=>{
      const arr=model[table];
      if(!Array.isArray(arr))return;
      arr.forEach(record=>{
        if(!record||typeof record!=="object")return;
        if(nsRecordDepartmentKey(record,model,sourceMap)!==targetKey)return;
        let touched=false;
        NS_DEPARTMENT_NAME_FIELDS.forEach(field=>{
          if(nsClean(record[field]))  {record[field]=clean;touched=true;}
        });
        NS_DEPARTMENT_KEY_FIELDS.forEach(field=>{
          if(nsClean(record[field])){record[field]=nextKey;touched=true;}
        });
        if(touched)renamed++;
      });
    });
    if(S.people&&typeof S.people==="object"){
      Object.keys(S.people).forEach(name=>{
        const rec=S.people[name];if(!rec)return;
        ["department","homeDepartment","team"].forEach(field=>{
          if(nsClean(rec[field])&&nsDepartmentKey(rec[field])===targetKey)rec[field]=clean;
        });
      });
    }
    // Runtime tab snapshots and the two localStorage blobs keyed by department NAME rather than key.
    if(S.workspace&&typeof S.workspace==="object"){
      Object.keys(S.workspace).forEach(name=>{
        if(nsDepartmentKey(name)!==targetKey||name===clean)return;
        S.workspace[clean]=S.workspace[name];delete S.workspace[name];
      });
    }
    ["sc_positions","sc_blueprints"].forEach(storageKey=>{
      try{
        const raw=localStorage.getItem(storageKey);
        if(!raw)return;
        const obj=JSON.parse(raw);
        if(!obj||typeof obj!=="object")return;
        let changed=false;
        Object.keys(obj).forEach(name=>{
          if(nsDepartmentKey(name)!==targetKey||name===clean)return;
          obj[clean]=obj[name];delete obj[name];changed=true;
        });
        if(changed){if(typeof _persistSet==="function")_persistSet(storageKey,JSON.stringify(obj),{critical:true});else localStorage.setItem(storageKey,JSON.stringify(obj));}
      }catch(err){}
    });
    // The device-local maps keyed by department key, so a rename doesn't reset "last opened" or
    // throw away the saved view context for what is still the same project.
    [["sync_last_opened",false],["sc_view_state",true]].forEach(([storageKey,critical])=>{
      try{
        const raw=localStorage.getItem(storageKey);
        if(!raw)return;
        const obj=JSON.parse(raw);
        if(!obj||typeof obj!=="object"||!obj[targetKey]||nextKey===targetKey)return;
        obj[nextKey]=obj[targetKey];delete obj[targetKey];
        const out=JSON.stringify(obj);
        if(typeof _persistSet==="function")_persistSet(storageKey,out,{critical});else localStorage.setItem(storageKey,out);
      }catch(err){}
    });
    if(S.activeDept&&nsDepartmentKey(S.activeDept)===targetKey){
      S.activeDept=clean;
      if(typeof setDeptName==="function")setDeptName(clean);
    }
    nsPersist();
    return{renamed,key:nextKey,name:clean};
  }catch(err){console.error("[sync] renaming department failed",err);return{renamed:0,error:err};}
}
window.nsRenameDepartmentEverywhere=nsRenameDepartmentEverywhere;

/* ═══════════════════════════════════════════════════════════════
   SNAPSHOTS — local version history

   Every destructive path in this app (import over an existing
   project, delete, rename, "overwrite the cloud with my copy") was
   previously a one-way door: undo covers in-session edits, but not
   "that import mangled six months of roster" discovered a day later.
   A snapshot is a full copy of the canonical model plus the synced
   localStorage keys, written to the SAME IndexedDB store under its
   own key — no schema bump needed, since that store is keyed
   explicitly rather than auto-incrementing.

   Device-local by design. The index deliberately does NOT join
   SYNC_LOCAL_KEYS: the bodies live in this browser's IndexedDB, so
   syncing the list would show another device restore points it
   cannot restore.
   ═══════════════════════════════════════════════════════════════ */
const NS_SNAPSHOT_INDEX_KEY="sc_snapshots";
const NS_SNAPSHOT_PREFIX="snapshot:";
const NS_SNAPSHOT_MAX=12;

function nsReadSnapshotIndex(){
  try{
    const raw=localStorage.getItem(NS_SNAPSHOT_INDEX_KEY);
    const list=raw?JSON.parse(raw):null;
    return Array.isArray(list)?list:[];
  }catch(err){return[];}
}
function nsWriteSnapshotIndex(list){
  try{
    const raw=JSON.stringify(list);
    if(typeof _persistSet==="function")_persistSet(NS_SNAPSHOT_INDEX_KEY,raw,{critical:true});
    else localStorage.setItem(NS_SNAPSHOT_INDEX_KEY,raw);
  }catch(err){}
}
function nsListSnapshots(){
  return nsReadSnapshotIndex().slice().sort((a,b)=>String(b.at||"").localeCompare(String(a.at||"")));
}
async function nsSnapshotDbPut(id,record){
  const db=await nsOpenDatabase();
  try{
    await new Promise((resolve,reject)=>{
      const tx=db.transaction(NS_DB_STORE,"readwrite");
      tx.objectStore(NS_DB_STORE).put(record,NS_SNAPSHOT_PREFIX+id);
      tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
    });
  }finally{db.close();}
}
async function nsSnapshotDbGet(id){
  const db=await nsOpenDatabase();
  try{
    return await new Promise((resolve,reject)=>{
      const tx=db.transaction(NS_DB_STORE,"readonly"),request=tx.objectStore(NS_DB_STORE).get(NS_SNAPSHOT_PREFIX+id);
      request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error);
    });
  }finally{db.close();}
}
async function nsSnapshotDbDelete(id){
  const db=await nsOpenDatabase();
  try{
    await new Promise((resolve,reject)=>{
      const tx=db.transaction(NS_DB_STORE,"readwrite");
      tx.objectStore(NS_DB_STORE).delete(NS_SNAPSHOT_PREFIX+id);
      tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);
    });
  }finally{db.close();}
}
// `reason` distinguishes a deliberate "Save snapshot" from the automatic one taken just before a
// destructive action, so the restore list can say which is which — an automatic entry is the one a
// user actually looks for after something went wrong.
async function nsSaveSnapshot(label,opts){
  opts=opts||{};
  try{
    if(typeof window._flushAllPendingPersist==="function")window._flushAllPendingPersist();
    const model=nsCanonical();
    const clone=typeof structuredClone==="function"?structuredClone(model):JSON.parse(JSON.stringify(model));
    const id=nsHash(nsNow()+"|"+Math.random())+"-"+Date.now().toString(36);
    const at=nsNow();
    const projects=(typeof nsListCanonicalProjects==="function"?nsListCanonicalProjects():[]).map(p=>p.name);
    const record={
      id,at,
      label:nsClean(label)||"Snapshot",
      reason:opts.reason||"manual",
      model:clone,
      localKeys:typeof _syncCollectLocalKeys==="function"?_syncCollectLocalKeys():{}
    };
    await nsSnapshotDbPut(id,record);
    const entry={
      id,at,
      label:record.label,
      reason:record.reason,
      projects,
      people:(clone.people||[]).length,
      schedule:(clone.schedule||[]).length
    };
    const index=nsReadSnapshotIndex();
    index.push(entry);
    // Prune oldest first, but never drop a snapshot taken automatically before a destructive action
    // while a plain manual one is still available to discard instead.
    const sorted=index.slice().sort((a,b)=>String(a.at||"").localeCompare(String(b.at||"")));
    while(sorted.length>NS_SNAPSHOT_MAX){
      const victim=sorted.find(s=>s.reason==="manual")||sorted[0];
      sorted.splice(sorted.indexOf(victim),1);
      try{await nsSnapshotDbDelete(victim.id);}catch(err){}
    }
    nsWriteSnapshotIndex(sorted);
    return entry;
  }catch(err){
    console.error("[sync] saving snapshot failed",err);
    return null;
  }
}
async function nsDeleteSnapshot(id){
  if(!id)return false;
  try{
    await nsSnapshotDbDelete(id);
    nsWriteSnapshotIndex(nsReadSnapshotIndex().filter(s=>s.id!==id));
    return true;
  }catch(err){console.error("[sync] deleting snapshot failed",err);return false;}
}
// Restoring is itself destructive — it replaces the current workspace — so it takes its own
// snapshot first. That is what makes restore safe to try: picking the wrong restore point is
// recoverable by restoring the one this just created.
async function nsRestoreSnapshot(id){
  if(!id)return{ok:false,error:"No snapshot selected"};
  try{
    const record=await nsSnapshotDbGet(id);
    if(!record||!record.model)return{ok:false,error:"That snapshot could not be read from this device"};
    await nsSaveSnapshot("Before restoring "+(record.label||"a snapshot"),{reason:"auto-restore"});
    S.nsCanonical=nsNormalizeCanonical(record.model);
    // Same order as a cloud load: storage first, then memory reloaded from it (otherwise the next
    // background persist writes the pre-restore notes and logbook back), then people mapped on top.
    if(record.localKeys&&typeof _syncWriteLocalKeys==="function"){
      _syncWriteLocalKeys(record.localKeys,{replace:true});
      if(typeof _syncReloadLocalStores==="function")_syncReloadLocalStores();
    }
    if(typeof nsSanitizeCanonicalIdentities==="function")nsSanitizeCanonicalIdentities();
    if(typeof nsSyncPeopleToRuntime==="function")nsSyncPeopleToRuntime();
    nsRestoreEntriesFromCanonical();
    nsPersist();
    return{ok:true,label:record.label||"Snapshot",at:record.at};
  }catch(err){
    console.error("[sync] restoring snapshot failed",err);
    return{ok:false,error:(err&&err.message)||"Restore failed"};
  }
}
/* ═══════════════════════════════════════════════════════════════
   SAMPLE PROJECT

   Every way into this app previously required the user to already
   have a roster spreadsheet, correctly shaped, in hand — so the
   product could not be evaluated before real data was committed to
   it. This builds a small but genuinely representative project
   (teams, shifts, days off, a weekend) directly in the canonical
   store, using the same record shapes an import produces, so every
   downstream surface treats it as an ordinary project: it can be
   renamed, deleted, synced and exported like any other.

const NS_SAMPLE_PEOPLE=[
  {name:"Amara Okafor",team:"Early",role:"Team leader"},
  {name:"Ben Sorensen",team:"Early",role:"Advisor"},
  {name:"Chloe Duarte",team:"Early",role:"Advisor"},
  {name:"Dmitri Volkov",team:"Late",role:"Team leader"},
  {name:"Esi Mensah",team:"Late",role:"Advisor"},
  {name:"Farid Haddad",team:"Late",role:"Advisor"}
];
function nsCreateSampleProject(preferredName){
  try{
    const model=nsCanonical();
    let name=nsClean(preferredName)||"Sample Team";
    const taken=new Set((typeof nsListCanonicalProjects==="function"?nsListCanonicalProjects():[]).map(p=>nsDepartmentKey(p.name)));
    let n=2;
    while(taken.has(nsDepartmentKey(name)))name=(nsClean(preferredName)||"Sample Team")+" ("+n++ +")";
    const sourceId=nsId("src","sample|"+name+"|"+Date.now());
    const loadedAt=nsNow();
    model.sources.push({
      source_id:sourceId,
      source_name:"Sample roster",
      source_kind:"sample",
      department_name:name,
      loaded_at:loadedAt,
      sheets:1,
      source_rows:0
    });
    NS_SAMPLE_PEOPLE.forEach((person,index)=>{
      model.people.push({
        person_id:nsId("per",name+"|"+person.name),
        full_name:person.name,
        home_department:name,
        team_name:person.team,
        role:person.role,
        authority_rank:index===0||index===3?2:1,
        source_id:sourceId
      });
    });
    // Four weeks starting from the Monday of the current week, so the calendar, month views and
    // "today" highlighting all have something real to show the moment it opens.
    const start=new Date();
    start.setHours(0,0,0,0);
    start.setDate(start.getDate()-((start.getDay()+6)%7));
    const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    const DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    let rows=0;
    for(let day=0;day<28;day++){
      const date=new Date(start);
      date.setDate(start.getDate()+day);
      const weekday=date.getDay();
      NS_SAMPLE_PEOPLE.forEach((person,index)=>{
        // A rolling days-off pattern per person rather than a fixed weekend for everyone, so
        // coverage, fairness and the off-day surfaces have something non-trivial to read.
        const offset=(day+index*2)%7;
        const isOff=offset===5||offset===6;
        const early=person.team==="Early";
        model.schedule.push({
          schedule_id:nsId("sch",name+"|"+person.name+"|"+iso(date)),
          person_name:person.name,
          department:name,
          team_name:person.team,
          source_id:sourceId,
          date:iso(date),
          day_of_week:DAYS[weekday],
          is_off:isOff,
          off_type:isOff?"OFF":"",
          uk_start:isOff?"":(early?"07:00":"12:00"),
          uk_end:isOff?"":(early?"15:00":"20:00"),
          authority_rank:1,
          imported_at:loadedAt
        });
        rows++;
      });
    }
    const source=model.sources[model.sources.length-1];
    if(source)source.source_rows=rows;
    if(typeof nsSyncPeopleToRuntime==="function")nsSyncPeopleToRuntime();
    nsPersist();
    return{name,people:NS_SAMPLE_PEOPLE.length,schedule:rows};
  }catch(err){
    console.error("[sync] creating the sample project failed",err);
    return null;
  }
}

async function nsHydrateDatabase(){
  NS.hydrating=true;
  try{
    const db=await nsOpenDatabase(),stored=await new Promise((resolve,reject)=>{const tx=db.transaction(NS_DB_STORE,"readonly"),request=tx.objectStore(NS_DB_STORE).get(NS_DB_KEY);request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error);});db.close();
    // Adopt the stored copy when it is newer — or when it holds schedule rows the live model lacks.
    // The IndexedDB and localStorage copies are written by the same nsPersist call and carry the
    // same updated_at, so "strictly newer" alone never adopted the IndexedDB copy, and the
    // localStorage one never has rows: memory ended up with no schedule to restore.
    const current=nsCanonical();
    const storedNewer=stored&&nsIsNewerTimestamp(stored.updated_at,current.updated_at);
    const storedHasScheduleWeLack=stored&&(stored.schedule||[]).length&&!(current.schedule||[]).length;
    if(storedNewer||storedHasScheduleWeLack){S.nsCanonical=nsNormalizeCanonical(stored);nsSanitizeCanonicalIdentities();nsSyncPeopleToRuntime();}
    // Keep cached canonical data available to the project picker, but never turn it into an
    // active sheet during startup. Opening a project is an explicit user action only.
    NS.persistence="indexeddb";return true;
  }catch(err){NS.persistence="localStorage fallback";return false;}
  // Set even when hydration failed, so a broken IndexedDB cannot block writes forever.
  finally{NS.hydrating=false;NS.hydrated=true;}
}

function nsSheetName(wb,wanted){
  const target=String(wanted).toLowerCase();
  return (wb&&wb.SheetNames||[]).find(name=>String(name).toLowerCase()===target)||null;
}

function nsSheetRows(wb,wanted,required){
  const name=nsSheetName(wb,wanted);if(!name)return[];
  const ws=wb.Sheets[name];if(!ws)return[];
  const prepared=NS.activePrepared&&NS.activePrepared.aoaBySheet&&NS.activePrepared.aoaBySheet[name];
  const aoa=prepared||XLSX.utils.sheet_to_json(ws,{header:1,defval:"",raw:false});
  const wants=(required||[]).map(x=>String(x).toLowerCase());
  let header=-1,best=-1;
  for(let i=0;i<Math.min(aoa.length,24);i++){
    const cells=(aoa[i]||[]).map(x=>nsClean(x).toLowerCase());
    const score=wants.reduce((sum,key)=>sum+(cells.includes(key)?1:0),0);
    if(score>best){best=score;header=i;}
  }
  if(header<0||wants.length&&best<Math.min(1,wants.length))return[];
  if(prepared){const headers=(aoa[header]||[]).map((value,index)=>nsClean(value)||"Column_"+(index+1));return aoa.slice(header+1).map(values=>{const row={};headers.forEach((key,index)=>{let unique=key,suffix=2;while(Object.prototype.hasOwnProperty.call(row,unique))unique=key+"_"+suffix++;row[unique]=values&&values[index]!==undefined?values[index]:"";});return row;}).filter(row=>Object.values(row).some(v=>nsClean(v)!==""));}
  return XLSX.utils.sheet_to_json(ws,{range:header,defval:"",raw:false}).filter(row=>Object.values(row).some(v=>nsClean(v)!==""));
}

function nsValue(row){
  const names=[...arguments].slice(1);
  const keys=Object.keys(row||{});
  for(const wanted of names){
    if(Object.prototype.hasOwnProperty.call(row||{},wanted)&&row[wanted]!=="")return row[wanted];
    const found=keys.find(key=>key.toLowerCase()===String(wanted).toLowerCase());
    if(found&&row[found]!=="")return row[found];
  }
  return"";
}

function nsISODate(value){
  if(value instanceof Date&&!isNaN(value))return value.getFullYear()+"-"+String(value.getMonth()+1).padStart(2,"0")+"-"+String(value.getDate()).padStart(2,"0");
  if(typeof value==="number"&&isFinite(value)&&XLSX.SSF&&XLSX.SSF.parse_date_code){
    const parsed=XLSX.SSF.parse_date_code(value);if(parsed)return parsed.y+"-"+String(parsed.m).padStart(2,"0")+"-"+String(parsed.d).padStart(2,"0");
  }
  const text=nsClean(value);
  let match=text.match(/^(\d{4})[-\/]([01]?\d)[-\/]([0-3]?\d)/);
  if(match)return match[1]+"-"+String(Number(match[2])).padStart(2,"0")+"-"+String(Number(match[3])).padStart(2,"0");
  match=text.match(/^([0-3]?\d)[-\/]([01]?\d)[-\/](\d{4})$/);
  if(match)return match[3]+"-"+String(Number(match[2])).padStart(2,"0")+"-"+String(Number(match[1])).padStart(2,"0");
  const date=new Date(text);if(!isNaN(date))return date.getFullYear()+"-"+String(date.getMonth()+1).padStart(2,"0")+"-"+String(date.getDate()).padStart(2,"0");
  return"";
}

function nsImportWorkerSource(){return `
self.onmessage=function(event){
  var sheets=event.data.sheets||{},names=Object.keys(sheets),aoaBySheet={};
  function colNumber(value){var out=0;for(var i=0;i<value.length;i++)out=out*26+value.charCodeAt(i)-64;return out-1;}
  names.forEach(function(name,index){
    var ws=sheets[name]||{},rows=[],maxRow=0,maxCol=0;
    Object.keys(ws).forEach(function(address){if(address.charAt(0)==='!')return;var match=address.match(/^([A-Z]+)([0-9]+)$/);if(!match)return;var col=colNumber(match[1]),row=Number(match[2])-1,cell=ws[address]||{},value=cell.w!==undefined?cell.w:cell.v;if(!rows[row])rows[row]=[];rows[row][col]=value===undefined?'':value;if(row>maxRow)maxRow=row;if(col>maxCol)maxCol=col;});
    for(var row=0;row<=maxRow;row++){if(!rows[row])rows[row]=[];for(var col=0;col<=maxCol;col++)if(rows[row][col]===undefined)rows[row][col]='';}
    aoaBySheet[name]=rows;self.postMessage({type:'progress',done:index+1,total:names.length,sheet:name});
  });
  var rows=Object.keys(aoaBySheet).reduce(function(sum,key){return sum+(aoaBySheet[key]||[]).length;},0);
  self.postMessage({type:'complete',aoaBySheet:aoaBySheet,materialized_rows:rows});
};`}

function nsWorkerSheetPayload(wb,detection){
  const required={
    peoplehub:["People","Teams","Org Roles","Acting","Identity Aliases","Sources","Sync Log"],
    schedulehub:["Schedule_Data","Teams","Sources","Sync Log","Import Batches"],
    departmenthub:["Team Setup","Roster","Schedule Feed","OT Decisions","Leave Decisions","Sources","Sync Log"],
    saveplus:["Schedule_Data","People","Teams","Org Roles","Acting","Identity Aliases","OT Wishes","OT Decisions","Leave Requests","Sources","Sync Log"]
  };
  const wanted=required[detection.primary],names=wanted?wanted.map(name=>nsSheetName(wb,name)).filter(Boolean):(wb.SheetNames||[]),payload={};
  names.forEach(name=>{const source=wb.Sheets[name]||{},slim={};Object.keys(source).forEach(address=>{if(address.charAt(0)==="!")return;const cell=source[address];if(!cell)return;const value=cell.w!==undefined?cell.w:cell.v;if(value!==undefined)slim[address]={v:value};});payload[name]=slim;});

function nsConfirmNativeImport(){

  //

  // confirmParsePreview, which only handles general-roster workbooks. Every native SyncSheets

  // built around — commits through HERE and was left unprotected. Caught by the import tests.

  // between the user pressing Import and the import starting.

    pending.timing.commit_ms=Math.round(performance.now()-commitStarted);pending.timing.total_ms=pending.timing.prepare_ms+pending.timing.commit_ms;

    performanceResult.assertions.commit_ms=pending.timing.commit_ms<=performanceResult.budget.commit_ms;performanceResult.assertions.total_ms=pending.timing.total_ms<=performanceResult.budget.total_ms;performanceResult.status=Object.values(performanceResult.assertions).every(Boolean)?"PASS":"FAIL";
    const performanceLog=nsCanonical().syncLog.find(row=>row.action==="performance_assertion"&&row.source_id===result.source.source_id);if(performanceLog){performanceLog.result=performanceResult.status;performanceLog.notes=performanceResult.run_mode+" | prepare "+performanceResult.prepare_ms+"ms | commit "+performanceResult.commit_ms+"ms | total "+performanceResult.total_ms+"ms";}

function nsCleanIdentityEntries(entries){
  const kept=[],rejected=[],seen=new Set();
  nsArray(entries).forEach(entry=>{
    const identity=nsClassifyIdentityLabel(entry&&entry.name);
    if(!identity.valid){rejected.push({label:identity.raw,reason:identity.reason});return;}
    const cleanEntry=identity.display===entry.name?entry:Object.assign({},entry,{name:identity.display,identity_source_label:entry.name});
    const date=cleanEntry.date instanceof Date?cleanEntry.date.getTime():String(cleanEntry.date||"");
    const key=[identity.display,date,cleanEntry.isOff?"OFF":(cleanEntry.ukS||"")+"-"+(cleanEntry.ukE||""),cleanEntry.offL||""].join("|");
    if(!seen.has(key)){seen.add(key);kept.push(cleanEntry);}
  });
  return{entries:kept,rejected};
}

  if(Array.isArray(scan.missingExpectedNames))scan.missingExpectedNames=scan.missingExpectedNames.map(nsNormalizeIdentityDisplay).filter(name=>nsClassifyIdentityLabel(name).valid);

function nsSanitizeCanonicalIdentities(){
  const model=nsCanonical(),validIds=new Set(),people=[];let removedPeople=0,removedSchedule=0;
  model.people.forEach(person=>{
    const identity=nsClassifyIdentityLabel(person&&person.full_name);
    if(!identity.valid){removedPeople++;return;}
    const clean=identity.display===person.full_name?person:Object.assign({},person,{full_name:identity.display,identity_source_label:person.full_name});
    people.push(clean);if(clean.person_id)validIds.add(clean.person_id);

    if(identity.display!==record.person_name){record.identity_source_label=record.person_name;record.person_name=identity.display;}
    return true;

}

function nsSanitizeRuntimeIdentities(){

function nsRenderOrgTree(people){

  const ids=new Set(people.map(person=>person.person_id)),children=new Map();
  people.forEach(person=>{const parent=ids.has(person.reports_to_person_id)?person.reports_to_person_id:"__root__";if(!children.has(parent))children.set(parent,[]);children.get(parent).push(person);});
  children.forEach(list=>list.sort((a,b)=>a.full_name.localeCompare(b.full_name)));
  const seen=new Set(),rows=[];
  function walk(parent,depth){
    (children.get(parent)||[]).forEach(person=>{
      if(seen.has(person.person_id)||rows.length>220)return;seen.add(person.person_id);
      const labels=nsPersonLabels(person),ready=nsCoverReady(person);
      rows.push(`<div class="ns-tree-row" style="padding-left:${8+depth*14}px"><div><b>${nsEsc(person.full_name)}</b><small>${nsEsc(person.role_type||"Unassigned")} | ${nsEsc(person.home_team||person.home_department||"No unit")}</small></div><div class="ns-labels">${ready?'<span class="ns-label ready">cover ready</span>':""}${labels.slice(0,2).map(label=>`<span class="ns-label">${nsEsc(label)}</span>`).join("")}</div></div>`);
      walk(person.person_id,depth+1);

  walk("__root__",0);people.filter(person=>!seen.has(person.person_id)).forEach(person=>{children.set("__root__",[person]);walk("__root__",0);});

}

function nsAddDaysISO(iso,n){const d=new Date(iso+"T00:00:00");d.setDate(d.getDate()+n);return nsISODate(d);}

function nsOrgLines(){

function nsOrgChanges(){

}
// Runs steps against the model and returns the steps that reverse them, newest first.
function nsOrgRunOps(ops){
  const model=nsCanonical(),undo=[];

    if(op.op==="lineCreate"){const line=nsStampDepartment([Object.assign({},op.line)])[0];model.reportingLines.push(line);undo.unshift({op:"lineDelete",line_id:line.line_id});}
    else if(op.op==="lineDelete"){const i=model.reportingLines.findIndex(line=>line.line_id===op.line_id);if(i>=0){const line=model.reportingLines.splice(i,1)[0];undo.unshift({op:"lineCreate",line});}}
    else if(op.op==="lineSet"){const line=model.reportingLines.find(item=>item.line_id===op.line_id);if(line){undo.unshift({op:"lineSet",line_id:op.line_id,field:op.field,value:line[op.field]??""});line[op.field]=op.value;}}

    else if(op.op==="personCreate"){const person=nsStampDepartment([Object.assign({},op.person)])[0];model.people.push(person);undo.unshift({op:"personDelete",person_id:person.person_id});}
    else if(op.op==="personDelete"){const person=nsPersonById(op.person_id),i=person?model.people.indexOf(person):-1;if(i>=0){model.people.splice(i,1);if(S.people&&S.people[person.full_name])delete S.people[person.full_name];undo.unshift({op:"personCreate",person});}}

}
function nsOrgCommit(kind,summary,effective,items,ops,by){
  const model=nsCanonical(),undo=nsOrgRunOps(ops);

  model.orgChanges.push(entry);
  nsStageChange("PeopleHub","Org",entry.change_id,kind,{summary,effective_from:effective||"",items});
  nsSyncPeopleToRuntime();nsPersist();
  return entry.change_id;
}
function nsOrgUndo(changeId){

  nsOrgRunOps(entry.undo||[]);

function nsLeaderIdOn(person,iso,index){

// Adds the steps that make `person` report to `leader` (a person record or null) from `eff`.
function nsOrgMovePlan(person,leader,eff,ops,items){
  const index=nsLinesIndex(),beforeId=nsLeaderIdOn(person,eff,index),newId=leader?leader.person_id:"";
  if(beforeId===newId)return;
  const lines=index.get(person.person_id)||[],dayBefore=nsAddDaysISO(eff,-1),today=nsISODate(new Date()),seed=Math.random().toString(36).slice(2);
  // First dated move: keep the leader they had before, so history before `eff` does not change.
  if(!lines.length&&beforeId)ops.push({op:"lineCreate",line:{line_id:nsId("NS-RL",person.person_id+"|base|"+seed),person_id:person.person_id,reports_to_person_id:beforeId,effective_from:"",effective_to:dayBefore,status:"Active",source_id:"NS-BROWSER"}});
  lines.forEach(line=>{

function nsOrgMove(names,leaderName,effective,by){
  const eff=nsISODate(effective)||nsISODate(new Date()),leader=leaderName?nsPersonById(nsPersonIdByName(leaderName)):null;

  if(!items.length)return{error:"Nothing to change: they already report to "+(leader?leader.full_name:"nobody")+" on "+eff};

// rows: [{name, role, reportsTo}] from an organogram sheet. Creates missing people, then applies

function nsOrgImport(rows,effective,by){

async function nsHardRefresh(){

  NS.cleanReload=true;clearTimeout(NS.dbWriteTimer);try{NS.importWorker&&NS.importWorker.terminate();NS.templateWorker&&NS.templateWorker.terminate();}catch(err){}
  try{Object.keys(localStorage).filter(key=>/^(?:sc_|sync|7os|mfs)/i.test(key)).forEach(key=>localStorage.removeItem(key));}catch(err){}
  try{sessionStorage.clear();}catch(err){}
  try{await new Promise(resolve=>{const request=indexedDB.deleteDatabase(NS_DB_NAME);request.onsuccess=request.onerror=request.onblocked=()=>resolve();});}catch(err){}

function nsRenderCrossDepartment(el){
  const model=nsCanonical(),sourceMap=nsSourceDepartmentMap(model),departments=new Map(),identityGroups=new Map();
  (model.people||[]).forEach(person=>{const key=nsRecordDepartmentKey(person,model,sourceMap)||"unassigned",name=person.department_name||key;departments.set(key,{key,name,count:(departments.get(key)?.count||0)+1});const identity=nsNameKey(person.full_name);if(!identityGroups.has(identity))identityGroups.set(identity,[]);identityGroups.get(identity).push({person,department:key,departmentName:name});});
  const candidates=[...identityGroups.values()].filter(group=>new Set(group.map(item=>item.department)).size>1).sort((a,b)=>a[0].person.full_name.localeCompare(b[0].person.full_name));
  const deptCards=[...departments.values()].sort((a,b)=>a.name.localeCompare(b.name)).map(item=>`<div class="ns-kpi"><b>${item.count}</b><span>${nsEsc(item.name)}</span></div>`).join("");
  const rows=candidates.map(group=>`<tr><td><b>${nsEsc(group[0].person.full_name)}</b></td><td>${group.map(item=>`<span class="ns-label">${nsEsc(item.departmentName)}</span>`).join(" ")}</td><td>${group.length}</td><td><span class="ns-label ready">Kept separate</span></td><td><button class="ns-btn" onclick="toast('Identity linking stays opt-in. Choose a department source before creating a governed link.','info',4200)">Review link</button></td></tr>`).join("");
  const body=`<div class="ns-panel"><div class="ns-panel-hd"><h3>Intentional combined review</h3><span>Department workspaces stay isolated · this view never merges people automatically</span></div><div class="ns-kpis compact">${deptCards}</div></div><section class="ns-panel"><div class="ns-panel-hd"><h3>Cross-department identity candidates</h3><span>${candidates.length} same-name candidate${candidates.length===1?'':'s'}</span></div><div class="ns-table-wrap"><table class="ns-table"><thead><tr><th>Identity</th><th>Departments</th><th>Records</th><th>Default</th><th></th></tr></thead><tbody>${rows||'<tr><td colspan="5"><div class="ns-empty">No same-name identities were found across the loaded departments.</div></td></tr>'}</tbody></table></div></section>`;
  el.innerHTML=nsOpsShell("cross-department",body);
}

const nsBaseOpsSourceRows=_opsSourceRows;
_opsSourceRows=function(){
  const existing=nsBaseOpsSourceRows(),canonical=nsScopedRows("sources").map(source=>({name:source.source_name||source.source_id,rows:source.source_rows||0,type:source.source_label||source.source_kind||"source",source_id:source.source_id}));
  // Imported files are the sources. The sheet list describes the same file again, sheet by sheet,
  // so merging both counted every import twice and disagreed with Data control's count.
  if(canonical.length)return canonical;
  const seen=new Set();return existing.filter(row=>{const key=row.source_id||row.name;if(seen.has(key))return false;seen.add(key);return true;});
};

let nsLagExpected=performance.now()+1000;setInterval(()=>{const now=performance.now();NS.eventLoopLag=Math.max(0,now-nsLagExpected);nsLagExpected=now+1000;},1000);
(()=>{
  // Hydration reads the local cache so offline projects can be listed, but launch remains passive:
  // it neither fetches cloud data nor restores a prior sheet into the active workspace.
  const doHydrate=()=>nsHydrateDatabase().then(async localHydrated=>{
    // Launch is passive: use local cache only and let the user choose a project. Never pull
    // remote data or reopen a previous project as a side effect of visiting the app.
    // Hydration can land a second or more after load. Whatever the user opened, imported or is
    // previewing by then is theirs, not launch state, so it is never closed underneath them.
    const live=!!(S.activeDept||(S.entries&&S.entries.length)||S.wb);
    if(!live){if(typeof _syncShowProjectPicker==="function")_syncShowProjectPicker({clearActive:true});}
    else{
      // A project opened before hydration was built from the lean localStorage copy, which holds
      // no schedule rows. Rebuild it from the full copy that just loaded.
      if(S.activeDept&&!(S.entries&&S.entries.length))nsRestoreEntriesFromCanonical();
      if(typeof _syncRenderProjectPicker==="function")_syncRenderProjectPicker();
    }
    if(document.getElementById("ca"))try{ren();}catch(err){}
  }).finally(()=>{
    NS.trackLocalChanges=true;
    NS.bootSettled=true;
    window.dispatchEvent(new Event("ns:boot-settled"));
  });
  const hydrate=()=>doHydrate();
  if("requestIdleCallback" in window)requestIdleCallback(hydrate,{timeout:1200});else setTimeout(hydrate,80);
})();

  showSyncFileLoading(f.name);
  await nsWaitForVisualPaint();

};

function nsExpandedSyncFrame(frame,mode){
  const width=58,height=68,variants=[". :  ","+ -  ","x .  ","| .  "],motif=variants[mode%variants.length];
  const field=Array.from({length:height},(_,y)=>Array.from({length:width},(_,x)=>y%6===0?(x%8===0?"+":"-"):(x%12===0?"|":motif[(x*3+y*5)%motif.length])));
  const core=String(frame||"").replace(/^\n+|\n+$/g,"").split("\n"),coreWidth=Math.max(0,...core.map(line=>line.length));
  const top=Math.max(1,Math.floor((height-core.length)/2)),left=Math.max(1,Math.floor((width-coreWidth)/2));
  core.forEach((line,row)=>[...line].forEach((char,column)=>{if(top+row<height&&left+column<width)field[top+row][left+column]=char;}));
  return field.map(row=>row.join("")).join("\n");
}
window.syncAsciiMarkup=function(){

};
window.cycleSyncAsciiPattern=function(){
  const count=window.SyncSignalField?.modes?.length||SYNC_ASCII_PATTERNS.length;
  const current=S.syncAsciiMode==null?3:Math.abs(Number(S.syncAsciiMode)||0);
  S.syncAsciiMode=(current+1)%count;
  if(window._syncField)window._syncField.setMode(window.SyncSignalField.modes[S.syncAsciiMode]);
  schedulePersist?.(false);
};
window.ensureSyncAsciiTicker=function(){
  const host=document.getElementById("syncAsciiCanvas");
  if(!host||!window.SyncSignalField)return;
  window._syncField?.destroy();
  const asciiMode=S.syncAsciiMode==null?3:Math.abs(Number(S.syncAsciiMode)||0);
  window._syncField=SyncSignalField.mount(host,{mode:SyncSignalField.modes[asciiMode%SyncSignalField.modes.length],onLevel:(v)=>window.paintMeter?.(v)});
};
