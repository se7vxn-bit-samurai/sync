  const body=`<datalist id="nsOrgRoleList"><option>Agent</option><option>Team Leader</option><option>Supervisor</option><option>Manager</option><option>Senior Lead</option></datalist><div style="padding:9px;border:1px solid var(--bdr);border-radius:6px;margin-bottom:9px;color:var(--tm);font-size:10px;line-height:1.5"><b style="color:var(--text)">People & Organisation review</b><br>Rename people, add any job title, set the operational role, team and reporting line. IDs do not change. ${eCount?eCount+" source cells marked E were interpreted as off days; their raw marker is retained for audit.":"No inferred E off-day markers were found."}</div><div class="ns-table-wrap" style="max-height:58vh"><table class="ns-table"><thead><tr><th>Name</th><th>Job title</th><th>Operational role</th><th>Team</th><th>Reports to</th><th>Notes</th></tr></thead><tbody>${rows}</tbody></table></div>`;
  _qolModal("nsOrganisationReview","Review people and organisation",people.length+" imported people · required before the first full pack",body,`<button class="ns-btn" onclick="document.getElementById('nsOrganisationReview')?.remove()">Review later</button><button class="ns-btn primary" onclick="nsSaveOrganisationReview()">Apply organisation</button>`);
  people.forEach(person=>{const select=document.querySelector(`#nsOrganisationReview tr[data-person-id="${CSS.escape(person.person_id)}"] .ns-org-reports`);if(select)select.value=person.reports_to_person_id||"";});
}

function nsSaveOrganisationReview(){
  const model=B.model(),rows=[...document.querySelectorAll("#nsOrganisationReview tbody tr")],renames=new Map();rows.forEach(row=>{const id=row.dataset.personId,person=model.people.find(item=>item.person_id===id);if(!person)return;const old=person.full_name,name=clean(row.querySelector(".ns-org-name")?.value)||old,title=clean(row.querySelector(".ns-org-title")?.value),role=clean(row.querySelector(".ns-org-role")?.value)||"Agent",team=clean(row.querySelector(".ns-org-team")?.value),reports=row.querySelector(".ns-org-reports")?.value||"";if(old!==name)renames.set(old,name);Object.assign(person,{full_name:name,job_title:title,role_type:role,home_team:team,home_department:person.home_department||S.activeDept||"Workspace",reports_to_person_id:reports,manager_name:"",notes:clean(row.querySelector(".ns-org-notes")?.value),source_id:"NS-BROWSER",authority_rank:0,last_modified_utc:B.now(),sync_status:"Staged"});if(title){const titleRole={org_role_id:B.id("NS-ROLE",id+"|job-title"),person_id:id,person_name:name,role:"Job Title: "+title,scope_team_id:"",scope_department:person.home_department,status:"Active",notes:"Separate from operational role",source_id:"NS-BROWSER",authority_rank:0};B.upsert("roles",[titleRole],item=>item.org_role_id,0);}const teamRecord={team_id:B.id("NS-T",person.home_department+"|"+team),team_name:team,department:person.home_department,leader_person_id:/lead|supervisor|manager/i.test(role)?id:"",leader_name:/lead|supervisor|manager/i.test(role)?name:"",member_count:0,status:"Active",source_id:"NS-BROWSER",authority_rank:0};B.upsert("teams",[teamRecord],item=>item.team_id,0);B.stageChange("PeopleHub","People",id,"organisation_review",person);});
  const nameFields=[[model.schedule,"person_name"],[model.otWishes,"person_name"],[model.otDecisions,"person_name"],[model.leave,"person_name"],[model.roles,"person_name"]];nameFields.forEach(([records,field])=>records.forEach(record=>{if(renames.has(record[field]))record[field]=renames.get(record[field]);}));(S.entries||[]).forEach(entry=>{if(renames.has(entry.name))entry.name=renames.get(entry.name);});renames.forEach((next,old)=>{if(S.people&&S.people[old]){S.people[next]=Object.assign({},S.people[old],{name:next});delete S.people[old];}});
  const byId=new Map(model.people.map(person=>[person.person_id,person]));model.people.forEach(person=>person.manager_name=(byId.get(person.reports_to_person_id)||{}).full_name||"");model.teams.forEach(team=>team.member_count=model.people.filter(person=>clean(person.home_team)===clean(team.team_name)).length);B.ensureOrgUnits();B.syncPeople();B.persist();try{saveDeptSnap(S.activeDept);}catch(error){}document.getElementById("nsOrganisationReview")?.remove();ren();toast(rows.length+" people and organisation records applied","ok",5200);
}

Object.assign(window,{nsOpenV31PackBuilder,nsBuildV31Pack,nsOpenOrganisationReview,nsSaveOrganisationReview});
