<script>
/* ═══════════════════════════════════════════════════════════════
   SYNC SIGNAL FIELD — live ASCII engine (vanilla, drop-in)
   Replaces the static SYNC_ASCII_PATTERNS frames in 7os-sync.

   The mark is NOT invented here: every path below is sampled
   directly from the shipped .sync-mark SVG (frame / link /
   link-alt / spine + the three node tiers), and the Signal mode's
   resolve act follows the boot splash's own cue order
   (frame → link +.18 → link-alt +.34 → spine +.42 → node pop).

   SyncSignalField.mount(el, { mode, fps, onLevel }) -> handle
     handle.setMode(name) | .cycle() | .destroy() | .modes
   ═══════════════════════════════════════════════════════════════ */
(function (global) {
'use strict';

var SX = 1.95, TAU = Math.PI * 2;
var lerp = function (a, b, t) { return a + (b - a) * t; };
var clamp01 = function (v) { return v < 0 ? 0 : v > 1 ? 1 : v; };
var ease = function (t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
function hash(x, y) { var v = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return v - Math.floor(v); }
function rnd(i, s) { var v = Math.sin(i * 12.9898 + (s || 0) * 78.233) * 43758.5453; return v - Math.floor(v); }

/* ── grid buffer ───────────────────────────────────────────── */
function Buf(c, r) { this.c = c; this.r = r; this.ch = new Array(c * r); this.cl = new Uint8Array(c * r); }
Buf.prototype.clear = function () { this.ch.fill(' '); this.cl.fill(0); };
Buf.prototype.put = function (x, y, ch, cl, a) {
  var xi = Math.round(x), yi = Math.round(y);
  if (xi < 0 || yi < 0 || xi >= this.c || yi >= this.r) return;
  if (a !== undefined && a < 1 && hash(xi, yi) > a) return;
  var i = yi * this.c + xi; this.ch[i] = ch; this.cl[i] = cl || 0;
};
Buf.prototype.line = function (x0, y0, x1, y1, ch, cl, a) {
  var dx = x1 - x0, dy = y1 - y0, n = Math.max(Math.abs(dx), Math.abs(dy), 1), c = ch || slope(dx, dy);
  for (var i = 0; i <= n; i++) this.put(x0 + dx * i / n, y0 + dy * i / n, c, cl, a);
};
Buf.prototype.ring = function (cx, cy, r, ch, cl, a) {
  var n = Math.max(20, Math.round(r * SX * 3));
  for (var i = 0; i <= n; i++) { var g = i / n * TAU;
    this.put(cx + Math.cos(g) * r * SX, cy + Math.sin(g) * r, ch || slope(-Math.sin(g), Math.cos(g)), cl, a); }
};
function slope(dx, dy) {
  var a = Math.abs(Math.atan2(dy, dx / SX) * 180 / Math.PI) % 180;
  if (a < 22 || a > 158) return '─';
  if (a > 68 && a < 112) return '│';
  return (dy / (dx || 1e-6) > 0) ? '╲' : '╱';
}

/* ═══ THE SHIPPED SYNC MARK, transcribed from the app's SVG ═══
   viewBox 0 0 120 120. Each entry is a polyline in that space. */
var MARK = {
  frame: [                                             // open bracketed cage
    [[28,32],[60,14],[92,32]], [[28,88],[60,106],[92,88]],
    [[28,32],[28,50]], [[92,32],[92,50]], [[28,88],[28,70]], [[92,88],[92,70]]
  ],
  link: [                                              // --early routing
    [[30,49],[52,49],[72,38],[93,49]], [[31,72],[53,72],[71,83],[92,72]],
    [[52,49],[52,72]], [[72,38],[72,83]]
  ],
  linkAlt: [                                           // accent routing
    [[36,58],[62,58],[84,72]], [[84,49],[62,58],[52,72]],
    [[60,14],[60,38]], [[60,106],[60,83]]
  ],
  spine: [                                             // the angular S
    [[82,37],[54,37],[41,49],[82,73],[69,84],[39,84]]
  ],
  nodes: [
    [28,32,3],[92,32,3],[28,88,3],[92,88,3],[60,60,3],   // tier 3 = ink
    [52,49,2],[71,83,2],                                  // accent
    [72,38,1],[53,72,1]                                   // alt
  ]
};
function polyLen(p) { var L = 0; for (var i = 1; i < p.length; i++) L += Math.hypot(p[i][0]-p[i-1][0], p[i][1]-p[i-1][1]); return L; }
var MARK_LEN = {};
Object.keys(MARK).forEach(function (k) {
  if (k === 'nodes') return;
  MARK_LEN[k] = MARK[k].map(polyLen);
});

/* project 120-space → grid cells */
function px(cx, sc, x) { return cx + (x - 60) * sc * SX; }
function py(cy, sc, y) { return cy + (y - 60) * sc; }

/* draw one layer of the mark, progressively (frac 0..1) */
function drawLayer(b, cx, cy, sc, key, frac, cl, alpha, ch) {
  if (frac <= 0) return;
  var polys = MARK[key], lens = MARK_LEN[key];
  var total = lens.reduce(function (a, v) { return a + v; }, 0);
  var budget = total * clamp01(frac), used = 0;
  for (var p = 0; p < polys.length && budget > used; p++) {
    var pts = polys[p];
    for (var i = 1; i < pts.length; i++) {
      var segLen = Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]);
      var room = budget - used;
      if (room <= 0) return;
      var f = Math.min(1, room / segLen);
      var ax = px(cx, sc, pts[i-1][0]), ay = py(cy, sc, pts[i-1][1]);
      var bx = px(cx, sc, lerp(pts[i-1][0], pts[i][0], f)), by = py(cy, sc, lerp(pts[i-1][1], pts[i][1], f));
      b.line(ax, ay, bx, by, ch, cl, alpha);
      used += segLen * f;
    }
  }
}
function drawNodes(b, cx, cy, sc, frac, pop, alpha) {
  if (frac <= 0) return;
  MARK.nodes.forEach(function (n, i) {
    if (i / MARK.nodes.length > frac) return;
    var big = pop && (Math.sin(pop * 3 + i * 0.7) > 0.55);
    b.put(px(cx, sc, n[0]), py(cy, sc, n[1]), big ? '◉' : '◆', n[2], alpha);
    if (big) { b.put(px(cx, sc, n[0]) - 1, py(cy, sc, n[1]), '(', n[2], alpha);
               b.put(px(cx, sc, n[0]) + 1, py(cy, sc, n[1]), ')', n[2], alpha); }
  });
}
/* ── per-mode S variants. Every mode gets its own wholly unique
      spine; all share the shipped cage + node tiers. ─────────── */
var SPINES = {
  /* bold ribbon S — the shipped spine, drawn heavy like the logo */
  Signal: { polys: [[[84,36],[54,36],[39,50],[84,74],[68,86],[38,86]]], w: 3, ch: '█' },
  /* nested contour outlines of the S — own glyph, wide offsets, so it
     never blends with the slope-glyph field it sits on */
  Contour: { polys: [
      [[82,30],[52,30],[37,48],[86,74],[68,90],[36,90]],
      [[79,42],[58,42],[49,51],[77,66],[62,78],[42,78]],
      [[76,52],[63,52],[59,55],[70,61],[58,68],[47,68]]
    ], w: 2, ch: null },
  /* the S as falling streams — vertical ticks along the path */
  Rain: { polys: [[[84,36],[54,36],[39,50],[84,74],[68,86],[38,86]]], w: 2, ch: '┃' },
  /* orthogonal circuit routing — right angles only, board-trace S */
  Lattice: { polys: [[[82,34],[48,34],[48,52],[78,52],[78,72],[44,72],[44,86],[82,86]]], w: 2, ch: '█' },
  /* smooth double-bowl S, phase-locked curve */
  Phase: (function () {
    var p = [], D = Math.PI / 180, r = 13;
    for (var i = 0; i <= 26; i++) { var a = lerp(-20 * D, -270 * D, i / 26); p.push([60 + Math.cos(a) * r * 1.35, 47 + Math.sin(a) * r]); }
    for (var j = 0; j <= 26; j++) { var c = lerp(-90 * D, 180 * D, j / 26); p.push([60 + Math.cos(c) * r * 1.35, 73 + Math.sin(c) * r]); }
    return { polys: [p], w: 2, ch: '━' };
  })()
};
Object.keys(SPINES).forEach(function (k) { SPINES[k].len = SPINES[k].polys.map(polyLen); });

/* draw a spine variant progressively, with stroke weight */
function drawSpine(b, cx, cy, sc, variant, frac, cl, alpha) {
  var V = SPINES[variant] || SPINES.Signal;
  if (frac <= 0) return;
  var total = V.len.reduce(function (a, v) { return a + v; }, 0), budget = total * clamp01(frac), used = 0;
  var offs = V.w >= 3 ? [[0, 0], [1, 0], [-1, 0], [0, 0.55], [0, -0.55], [2, 0], [-2, 0]]
           : V.w === 2 ? [[0, 0], [1, 0], [-1, 0]] : [[0, 0]];
  for (var p = 0; p < V.polys.length && budget > used; p++) {
    var pts = V.polys[p];
    for (var i = 1; i < pts.length; i++) {
      var segLen = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
      var room = budget - used; if (room <= 0) return;
      var f = Math.min(1, room / segLen);
      var ax = px(cx, sc, pts[i - 1][0]), ay = py(cy, sc, pts[i - 1][1]);
      var bx = px(cx, sc, lerp(pts[i - 1][0], pts[i][0], f)), by = py(cy, sc, lerp(pts[i - 1][1], pts[i][1], f));
      for (var o = 0; o < offs.length; o++)
        b.line(ax + offs[o][0], ay + offs[o][1], bx + offs[o][0], by + offs[o][1], V.ch, cl, alpha);
      used += segLen * f;
    }
  }
}

/* full mark with the boot splash's staging: frame→link→linkAlt→spine */
function drawMark(b, cx, cy, sc, t, alpha, variant) {
  var f = clamp01(t / 1.05), l = clamp01((t - 0.18) / 1.05),
      la = clamp01((t - 0.34) / 1.05), sp = clamp01((t - 0.42) / 1.1);
  drawLayer(b, cx, cy, sc, 'frame', f, 3, alpha);
  drawLayer(b, cx, cy, sc, 'link', l, 1, alpha);
  drawLayer(b, cx, cy, sc, 'linkAlt', la, 2, alpha);
  drawSpine(b, cx, cy, sc, variant || 'Signal', sp, 3, alpha);
  drawNodes(b, cx, cy, sc, clamp01((t - 0.9) / 0.4), t, alpha);
}
/* mark node positions in grid space — used as convergence targets */
function markTargets(cx, cy, sc) {
  return MARK.nodes.map(function (n) { return [px(cx, sc, n[0]), py(cy, sc, n[1])]; });
}
function fitScale(st, k) { return Math.min(st.h * (k || 0.44), st.w / SX * (k || 0.44)) / 52; }

/* ── ambient field so a panel is never mostly empty ───────── */
function ambient(b, st, dens, cl) {
  var g = '·˙:‘,.';
  for (var y = 0; y < st.h; y++) for (var x = 0; x < st.w; x++) {
    var n = hash(x * 0.7 + Math.floor(st.t * 1.3) * 0.11, y * 0.9);
    if (n > 1 - dens) b.put(x, y, g[Math.floor(hash(x, y) * g.length)], cl === undefined ? 0 : cl);
  }
}

/* ═══════════════════ MODES ═══════════════════ */
var MODES = [];

/* 1 ── SIGNAL — scatter → converge → the real mark draws on.  */
MODES.push({
  name: 'Signal', hint: 'chaos resolving into the mark',
  level: function (st) { return clamp01((st.t % 9) / 9); },
  draw: function (b, st) {
    var L = st.t % 9, sc = fitScale(st, 0.46), cx = st.cx, cy = st.cy;
    var tgt = markTargets(cx, cy, sc), N = 40;
    ambient(b, st, 0.16, 0);

    if (L < 3.4) {                                          // chaos
      var s = ease(clamp01(L / 3.0)), pts = [];
      for (var i = 0; i < N; i++) {
        var T = tgt[i % tgt.length];
        var sx = cx + (rnd(i, 2) - 0.5) * st.w * 1.02, sy = cy + (rnd(i, 3) - 0.5) * st.h * 0.98;
        var jx = Math.sin(st.t * (1.1 + rnd(i) * 0.9) + i * 2.1) * st.w * 0.12 * (1 - s);
        var jy = Math.cos(st.t * (1.0 + rnd(i, 1) * 0.9) + i * 1.7) * st.h * 0.09 * (1 - s);
        pts.push([lerp(sx, T[0], s) + jx, lerp(sy, T[1], s) + jy]);
      }
      for (var j = 0; j < N; j++) {
        b.line(pts[j][0], pts[j][1], pts[(j + 5) % N][0], pts[(j + 5) % N][1], '·', 0, 0.30 + s * 0.45);
        b.line(pts[j][0], pts[j][1], pts[(j + 13) % N][0], pts[(j + 13) % N][1], '·', 1, 0.12 + s * 0.35);
      }
      drawLayer(b, cx, cy, sc, 'frame', s, 3, s * 0.95);
      drawLayer(b, cx, cy, sc, 'link', Math.max(0, s - 0.25) / 0.75, 1, s * 0.7);
      pts.forEach(function (p, i) { b.put(p[0], p[1], i % 4 ? '•' : '◆', i % 4 ? 1 : 2); });

    } else if (L < 5.4) {                                    // converge
      var p2 = clamp01((L - 3.4) / 2.0), bl = ease(p2);
      for (var r = 0; r < 5; r++) b.ring(cx, cy, (st.h * 0.5) * (1 - bl) + r * 4, '·', r ? 0 : 1, 0.5 - r * 0.07);
      tgt.forEach(function (T, i) {
        b.ring(T[0], T[1], lerp(0.8, st.h * 0.15, clamp01((p2 - i * 0.04) / 0.7)), '·', 1, (1 - p2) * 0.5);
        b.line(cx, cy, T[0], T[1], '·', 2, bl * 0.8);
      });
      drawMark(b, cx, cy, sc, lerp(0, 1.0, bl), 1, 'Signal');

    } else {                                                  // resolve
      var p3 = clamp01((L - 5.4) / 3.6);
      drawMark(b, cx, cy, sc, 1.0 + p3 * 1.6, 1, 'Signal');
      var pulse = 0.5 + 0.5 * Math.sin(st.t * 3);
      for (var q = 0; q < 3; q++) b.ring(cx, cy, st.h * 0.30 + q * 5 + pulse * 2, '·', 1, 0.28 - q * 0.07);
      tgt.forEach(function (T) { b.line(cx, cy, T[0], T[1], '·', 0, 0.35); });
    }
  }
});

/* 2 ── CONTOUR — topographic field breathing around the mark. */
MODES.push({
  name: 'Contour', hint: 'topography of the day',
  level: function (st) { return 0.5 + 0.5 * Math.sin(st.t * 0.4); },
  draw: function (b, st) {
    var cx = st.cx, cy = st.cy, ramp = ' ·:-=+*';
    var msc = fitScale(st, 0.38), RR = 52 * msc;
    for (var y = 0; y < st.h; y++) for (var x = 0; x < st.w; x++) {
      var dx = (x - cx) / SX, dy = y - cy, d = Math.sqrt(dx * dx + dy * dy);
      if (d < RR * 1.02) continue;                              // radial mask, not a box
      var mdx = st.mOn ? (x - st.mx) / SX : 0, mdy = st.mOn ? y - st.my : 0;
      var md = st.mOn ? Math.sqrt(mdx * mdx + mdy * mdy) : 999;
      var v = (Math.sin(d * 0.42 - st.t * 1.6) * 0.5 + 0.5) * 0.62;
      v *= 1 - clamp01(d / (st.h * 0.52));
      v *= clamp01((d - RR * 1.02) / (RR * 0.5));               // feather the mark's edge
      if (md < 14) v += (1 - md / 14) * 0.4 * (Math.sin(md * 0.8 - st.t * 5) * 0.5 + 0.5);
      for (var i = 0; i < st.ripples.length; i++) {
        var age = st.t - st.ripples[i].t; if (age > 2) continue;
        var dd = Math.abs(d - age * 26); if (dd < 3) v += (1 - dd / 3) * (1 - age / 2) * 0.7;
      }
      var idx = Math.round(clamp01(v) * (ramp.length - 1));
      if (idx > 0) b.put(x, y, ramp[idx], idx > 4 ? 2 : idx > 2 ? 1 : 0);
    }
    // cage + contour spine ONLY — link/linkAlt suppressed here so the
    // spine is the only structured layer in the middle
    drawLayer(b, cx, cy, msc, 'frame', 1, 3, 1);
    drawSpine(b, cx, cy, msc, 'Contour', 1, 3, 1);
    drawNodes(b, cx, cy, msc, 1, st.t, 1);
  }
});

/* 3 ── RAIN — falling columns that expose the mark as they pass. */
MODES.push({
  name: 'Rain', hint: 'incoming rosters',
  level: function (st) { return clamp01(0.35 + 0.3 * Math.sin(st.t * 0.7)); },
  draw: function (b, st) {
    var glyphs = '01·:+=*SYNC◆◉', sc = fitScale(st, 0.38), cx = st.cx, cy = st.cy;
    var RR = 52 * sc;
    for (var x = 0; x < st.w; x++) {
      var spd = 6 + rnd(x) * 16, len = 8 + Math.floor(rnd(x, 1) * 20);
      var head = ((st.t * spd + rnd(x, 2) * 200) % (st.h + len * 2)) - len;
      var push = st.mOn ? Math.max(0, 1 - Math.abs(x - st.mx) / 12) * 9 : 0;
      for (var k = 0; k < len; k++) {
        var y = Math.round(head - k + push); if (y < 0 || y >= st.h) continue;
        var dx = (x - cx) / SX, dy = y - cy, inMark = Math.sqrt(dx * dx + dy * dy) < RR;
        var g = glyphs[Math.floor(hash(x, y + Math.floor(st.t * 4)) * glyphs.length)];
        var f = 1 - k / len;
        b.put(x, y, g, inMark ? 3 : f > 0.85 ? 2 : f > 0.4 ? 1 : 0, f * 0.9 + 0.1);
      }
    }
    drawMark(b, cx, cy, sc, 3, 1, 'Rain');
  }
});

/* 4 ── LATTICE — dense node graph with packets routing the edges. */
MODES.push({
  name: 'Lattice', hint: 'shifts routing through the graph',
  level: function (st) { return clamp01(0.55 + 0.35 * Math.sin(st.t * 0.9)); },
  draw: function (b, st) {
    ambient(b, st, 0.10, 0);
    var gx = Math.max(4, Math.round(st.w / 13)), gy = Math.max(4, Math.round(st.h / 7));
    var cw = st.w / (gx + 1), chh = st.h / (gy + 1), nodes = [];
    for (var j = 1; j <= gy; j++) for (var i = 1; i <= gx; i++) {
      var id = j * 31 + i, nx = i * cw + Math.sin(st.t * 1.1 + id) * 0.9, ny = j * chh + Math.cos(st.t * 0.9 + id) * 0.5;
      if (st.mOn) {
        var dx = nx - st.mx, dy = ny - st.my, d = Math.sqrt(dx * dx / (SX * SX) + dy * dy);
        if (d < 14) { var f = (1 - d / 14) * 6; nx += dx / (d || 1) * f * SX; ny += dy / (d || 1) * f; }
      }
      nodes.push({ x: nx, y: ny, i: i, j: j, id: id });
    }
    var at = function (i, j) { return (j - 1) * gx + (i - 1); };
    nodes.forEach(function (n) {
      if (n.i < gx) { var e = nodes[at(n.i + 1, n.j)]; b.line(n.x, n.y, e.x, e.y, '─', 1, 0.85); }
      if (n.j < gy) { var s = nodes[at(n.i, n.j + 1)]; b.line(n.x, n.y, s.x, s.y, '│', 0, 0.6); }
      if (n.i < gx && n.j < gy && hash(n.i, n.j) > 0.55) {
        var d2 = nodes[at(n.i + 1, n.j + 1)]; b.line(n.x, n.y, d2.x, d2.y, '╲', 0, 0.35);
      }
    });
    for (var p = 0; p < 18; p++) {
      var row = 1 + Math.floor(rnd(p, 5) * gy), prog = (st.t * (0.22 + rnd(p) * 0.34) + rnd(p, 1)) % 1;
      var pxp = lerp(cw, gx * cw, prog), pyp = row * chh;
      b.put(pxp, pyp, '►', 3); b.put(pxp - 2, pyp, '━', 2); b.put(pxp - 4, pyp, '─', 1);
    }
    nodes.forEach(function (n) {
      var lit = hash(n.i, n.j + Math.floor(st.t * 1.5)) > 0.7;
      b.put(n.x, n.y, lit ? '◉' : '◆', lit ? 3 : 1);
    });
    for (var i2 = 0; i2 < st.ripples.length; i2++) {
      var age = st.t - st.ripples[i2].t; if (age > 1.6) continue;
      b.ring(st.ripples[i2].x, st.ripples[i2].y, age * 22, '·', 3, 1 - age / 1.6);
    }
    drawMark(b, st.cx, st.cy, fitScale(st, 0.30), 3, 0.85, 'Lattice');
  }
});

/* 5 ── PHASE — dense bands drifting out of, then into, phase.  */
MODES.push({
  name: 'Phase', hint: 'coverage locking to plan',
  level: function (st) { return ease(clamp01(((st.t % 12) / 12) * 1.25)); },
  draw: function (b, st) {
    var lock = ease(clamp01(((st.t % 12) / 12) * 1.25));
    var bands = Math.max(8, Math.floor(st.h / 3.2));
    for (var i = 0; i < bands; i++) {
      var y0 = (i + 0.6) * (st.h / (bands + 0.4));
      var ph = lerp(rnd(i, 4) * TAU, 0, lock);
      var amp = lerp(3.4, 1.1, lock) * (1 + (st.mOn ? Math.max(0, 1 - Math.abs(y0 - st.my) / 9) * 2.4 : 0));
      var freq = lerp(0.22 + rnd(i, 6) * 0.2, 0.26, lock);
      for (var x = 0; x < st.w; x++) {
        var y = y0 + Math.sin(x * freq + ph + st.t * 1.5) * amp;
        var d = Math.abs(y - Math.round(y));
        b.put(x, y, d < 0.25 ? '━' : '─', lock > 0.8 ? 3 : lock > 0.45 ? 2 : 1, 0.7 + lock * 0.3);
      }
      if (lock > 0.5) b.put(st.w * 0.5, y0, '◆', 3, (lock - 0.5) / 0.5);
    }
    if (lock > 0.82) drawMark(b, st.cx, st.cy, fitScale(st, 0.32), 3, (lock - 0.82) / 0.18, 'Phase');
  }
});

/* ═══════════════ RENDERER ═══════════════ */
var CLS = ['sf0', 'sf1', 'sf2', 'sf3'];
function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
function serialize(b) {
  var out = '', run = '', runCl = -1;
  for (var y = 0; y < b.r; y++) {
    for (var x = 0; x < b.c; x++) {
      var i = y * b.c + x, ch = b.ch[i] || ' ', cl = ch === ' ' ? -1 : b.cl[i];
      if (cl !== runCl) { if (run) out += runCl < 0 ? esc(run) : '<span class="' + CLS[runCl] + '">' + esc(run) + '</span>'; run = ''; runCl = cl; }
      run += ch;
    }
    run += '\n';
  }
